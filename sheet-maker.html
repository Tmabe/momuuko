<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>시트 생성기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Jua&family=Black+Han+Sans&family=Do+Hyeon&family=Montserrat:wght@800;900&family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=Noto+Sans+KR:wght@300;400;500;700;900&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --Y:#3D8EF0;
  --bg:#1A1A22;
  --panel:#22222C;
  --border:rgba(255,255,255,.12);
  --text:#F0EEE8;
  --text2:#B8B4AC;
  --text3:#7A7870;
  --cond:'Barlow Condensed',sans-serif;
  --mono:'DM Mono',monospace;
  --kr:'Noto Sans KR',sans-serif;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--kr);overflow:hidden;}
#app{display:flex;height:100vh;}

/* ── 좌측 패널 ── */
#side{
  width:308px;flex-shrink:0;height:100%;overflow-y:auto;
  background:var(--panel);border-right:1px solid var(--border);
  padding:14px 14px 40px;
  scrollbar-width:thin;scrollbar-color:#444 transparent;
}
.sec{margin-bottom:18px;}
.sec h3{
  font-family:var(--cond);font-size:12px;font-weight:700;letter-spacing:1.5px;
  color:var(--text3);text-transform:uppercase;margin-bottom:8px;
  border-bottom:1px solid var(--border);padding-bottom:4px;
}
/* 템플릿 선택 */
#tplRow{display:flex;gap:5px;}
.tplBtn{
  flex:1;padding:8px 4px;border-radius:8px;border:1px solid var(--border);
  background:rgba(255,255,255,.04);color:var(--text3);font-size:11px;
  font-family:var(--kr);cursor:pointer;transition:.15s;text-align:center;line-height:1.4;
}
.tplBtn b{display:block;font-size:12px;color:var(--text2);}
.tplBtn.active{border-color:var(--Y);background:rgba(61,142,240,.14);}
.tplBtn.active b{color:var(--Y);}
.drop{
  border:1.5px dashed rgba(255,255,255,.22);border-radius:10px;
  padding:10px;text-align:center;cursor:pointer;transition:.15s;
  font-size:12px;color:var(--text3);position:relative;min-height:54px;
  display:flex;align-items:center;justify-content:center;gap:8px;
  margin-bottom:8px;background:rgba(255,255,255,.02);
}
.drop:hover,.drop.over{border-color:var(--Y);color:var(--text2);background:rgba(61,142,240,.06);}
.drop img{max-height:64px;max-width:60px;border-radius:6px;background:
  repeating-conic-gradient(#333 0% 25%, #2a2a33 0% 50%) 0 0/12px 12px;}
.drop .x{
  position:absolute;top:4px;right:6px;width:18px;height:18px;line-height:16px;
  border-radius:50%;background:rgba(0,0,0,.5);color:#ccc;font-size:11px;
  display:none;
}
.drop.has .x{display:block;}
.drop .lbl{flex:1;}
input[type=file]{display:none;}
.row{display:flex;gap:6px;align-items:center;margin-bottom:6px;}
.row label{font-size:11px;color:var(--text2);width:56px;flex-shrink:0;}
.row input[type=text], .row textarea{
  flex:1;background:rgba(255,255,255,.05);border:1px solid var(--border);
  border-radius:6px;padding:5px 8px;color:var(--text);font-size:12px;
  font-family:var(--kr);min-width:0;resize:vertical;
}
.row textarea{min-height:34px;line-height:1.5;}
.row input[type=text]:focus, .row textarea:focus{outline:none;border-color:var(--Y);}
.row select, .selRow select{
  flex:1;background:#2c2c36;border:1px solid var(--border);border-radius:6px;
  padding:5px;color:var(--text);font-size:12px;font-family:var(--kr);min-width:0;
}
.row input[type=range]{flex:1;accent-color:var(--Y);}
/* 팔레트 */
#palGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px;}
.palSw{
  aspect-ratio:1.35;border-radius:7px;border:1px solid rgba(255,255,255,.15);
  cursor:pointer;position:relative;overflow:hidden;padding:0;
}
.palSw input{position:absolute;inset:-8px;width:200%;height:200%;cursor:pointer;border:none;padding:0;opacity:0;}
.palSw .pd{
  position:absolute;top:1px;right:1px;width:18px;height:18px;line-height:18px;
  text-align:center;font-size:10px;z-index:2;cursor:crosshair;
  background:rgba(0,0,0,.35);border-radius:0 6px 0 6px;opacity:0;transition:.15s;
}
.palSw:hover .pd{opacity:1;}
.colorRow{display:flex;gap:6px;align-items:center;margin-bottom:6px;}
.colorRow label{font-size:11px;color:var(--text2);flex:1;}
.colorRow .cw{
  width:44px;height:24px;border-radius:6px;border:1px solid var(--border);
  overflow:hidden;position:relative;cursor:pointer;flex-shrink:0;
}
.colorRow .cw input{position:absolute;inset:-8px;width:70px;height:44px;border:none;padding:0;cursor:pointer;}
.dropBtn{
  width:26px;height:24px;border-radius:6px;border:1px solid var(--border);
  background:rgba(255,255,255,.05);color:var(--text2);cursor:crosshair;font-size:12px;
  flex-shrink:0;padding:0;
}
.dropBtn:hover{border-color:var(--Y);}
button.bt{
  width:100%;padding:7px;border-radius:8px;border:1px solid var(--border);
  background:rgba(255,255,255,.05);color:var(--text2);font-size:12px;
  font-family:var(--kr);cursor:pointer;transition:.15s;margin-bottom:6px;
}
button.bt:hover{border-color:var(--Y);color:var(--text);}
button.bt.pri{background:var(--Y);border-color:var(--Y);color:#fff;font-weight:700;font-size:13px;padding:10px;}
button.bt.pri:hover{filter:brightness(1.1);}
/* 표정 */
.thumbCtl{display:flex;gap:6px;align-items:center;margin-bottom:6px;}
.thumbCtl .tprev{
  width:44px;height:44px;border-radius:8px;flex-shrink:0;
  border:1px solid var(--border);background:#333;object-fit:cover;
}
.thumbCtl select{
  flex:1;background:#2c2c36;border:1px solid var(--border);border-radius:6px;
  padding:4px;color:var(--text);font-size:11px;font-family:var(--kr);
}
.thumbCtl .mini{
  width:26px;height:26px;border-radius:6px;border:1px solid var(--border);
  background:rgba(255,255,255,.05);color:var(--text2);cursor:pointer;font-size:12px;
  flex-shrink:0;
}
.thumbCtl .mini:hover{border-color:var(--Y);}
.hint{font-size:10px;color:var(--text3);line-height:1.5;margin-top:4px;}
.selRow{display:flex;gap:6px;margin-bottom:6px;}
.chk{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2);margin-bottom:6px;cursor:pointer;}
/* 프리셋 */
#presetList{display:flex;flex-direction:column;gap:4px;margin-bottom:6px;}
.pItem{display:flex;gap:4px;align-items:center;}
.pItem .pl{
  flex:1;text-align:left;padding:5px 8px;border-radius:6px;font-size:12px;
  background:rgba(255,255,255,.04);border:1px solid var(--border);color:var(--text2);
  cursor:pointer;font-family:var(--kr);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.pItem .pl:hover{border-color:var(--Y);color:var(--text);}
.pItem .px{
  width:24px;height:26px;border-radius:6px;border:1px solid var(--border);
  background:transparent;color:var(--text3);cursor:pointer;flex-shrink:0;
}
.pItem .px:hover{color:#e66;border-color:#e66;}

/* ── 미리보기 ── */
#main{flex:1;display:flex;flex-direction:column;min-width:0;}
#topbar{
  height:38px;flex-shrink:0;display:flex;align-items:center;gap:14px;
  padding:0 16px;border-bottom:1px solid var(--border);
  font-family:var(--mono);font-size:11px;color:var(--text3);
}
#topbar b{color:var(--Y);font-family:var(--cond);font-size:14px;letter-spacing:1px;}
#stage{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:14px;position:relative;}
#pv{box-shadow:0 8px 40px rgba(0,0,0,.5);border-radius:6px;cursor:grab;max-width:100%;max-height:100%;}
#pv.dragging{cursor:grabbing;}
#pv.picking{cursor:crosshair;}
#hintFloat{
  position:absolute;bottom:10px;left:50%;transform:translateX(-50%);
  background:rgba(20,20,28,.85);border:1px solid var(--border);border-radius:20px;
  padding:5px 16px;font-size:11px;color:var(--text2);pointer-events:none;
  white-space:nowrap;
}
#toast{
  position:fixed;top:52px;left:50%;transform:translateX(-50%);
  background:var(--Y);color:#fff;padding:8px 20px;border-radius:20px;
  font-size:13px;font-weight:700;opacity:0;transition:.3s;pointer-events:none;z-index:99;
}
#toast.show{opacity:1;}
@media(max-width:760px){
  #app{flex-direction:column;}
  #side{width:100%;height:auto;max-height:45vh;order:2;}
  #main{order:1;height:55vh;}
}
</style>
</head>
<body>
<div id="app">
  <div id="side">
    <div class="sec">
      <h3>템플릿</h3>
      <div id="tplRow">
        <button class="tplBtn active" data-tpl="sheet"><b>시트</b>기본 시트</button>
        <button class="tplBtn" data-tpl="poster"><b>포스터A</b>소개 카드풍</button>
        <button class="tplBtn" data-tpl="graphic"><b>포스터B</b>그래픽풍</button>
      </div>
    </div>

    <div class="sec">
      <h3>이미지</h3>
      <div class="drop" id="dropBase">
        <span class="lbl">기본 일러스트<br><small>클릭 or 드래그 (투명 PNG)</small></span>
        <span class="x" data-slot="base">✕</span>
      </div>
      <div class="drop" id="dropVari">
        <span class="lbl">바리에이션 (선택)<br><small>시트 템플릿의 확대컷에 사용</small></span>
        <span class="x" data-slot="vari">✕</span>
      </div>
      <input type="file" id="fileBase" accept="image/png,image/webp">
      <input type="file" id="fileVari" accept="image/png,image/webp">
      <button class="bt" id="btnAutoPlace">🧲 현재 템플릿 자동 배치 리셋</button>
    </div>

    <div class="sec">
      <h3>텍스트</h3>
      <div class="row"><label>제목</label><input type="text" id="inName" placeholder="칸나 / GamRabbit"></div>
      <div class="row"><label>서브</label><input type="text" id="inSub" placeholder="Live 2D illust / Kanna"></div>
      <div class="row"><label>크레딧</label><input type="text" id="inCredit" placeholder="momukko"></div>
      <div class="row"><label>인용문</label><textarea id="inQuote" rows="2" placeholder="포스터A 우상단 대사&#10;(줄바꿈 가능)"></textarea></div>
      <div class="row"><label>소속</label><textarea id="inRibbon" rows="2" placeholder="포스터A 리본 / 포스터B 세로 스펙&#10;(줄바꿈 가능)"></textarea></div>
      <div class="row"><label>설명</label><textarea id="inDesc" rows="2" placeholder="포스터A 하단 소개문&#10;(줄바꿈 가능)"></textarea></div>
    </div>

    <div class="sec">
      <h3>폰트</h3>
      <div class="selRow">
        <select id="selFont">
          <option value="round">라운드 (Baloo 2 + Jua)</option>
          <option value="impact">임팩트 고딕 (Black Han Sans)</option>
          <option value="dohyeon">도현 (각진 고딕)</option>
          <option value="bebas">컨덴스드 (Bebas Neue)</option>
          <option value="modern">모던 (Montserrat)</option>
        </select>
      </div>
    </div>

    <div class="sec">
      <h3>색</h3>
      <div id="palGrid"></div>
      <div class="colorRow"><label>포인트색</label><button class="dropBtn" data-pick="accent">💧</button><div class="cw"><input type="color" id="cAccent"></div></div>
      <div class="colorRow"><label>배경색</label><button class="dropBtn" data-pick="bg">💧</button><div class="cw"><input type="color" id="cBg"></div></div>
      <div class="colorRow"><label>무늬색</label><button class="dropBtn" data-pick="stripe">💧</button><div class="cw"><input type="color" id="cStripe"></div></div>
      <button class="bt" id="btnReExtract">🎨 색 자동 재추출</button>
      <div class="hint">💧 = 스포이드. 크롬은 화면 어디서든 확대경으로 픽, 그 외엔 미리보기 클릭.</div>
    </div>

    <div class="sec">
      <h3>효과</h3>
      <div class="row"><label>배경</label>
        <select id="fxBg">
          <option value="wash">워시 그라데이션</option>
          <option value="blurimg">일러스트 블러</option>
          <option value="flat">단색</option>
        </select>
      </div>
      <div class="row"><label>글로우</label><input type="range" id="fxGlow" min="0" max="100" value="35"></div>
      <div class="colorRow"><label>글로우색</label><button class="dropBtn" data-pick="glowColor">💧</button><div class="cw"><input type="color" id="cGlow"></div></div>
      <div class="row"><label>라이팅</label>
        <select id="fxLight">
          <option value="none">없음</option>
          <option value="rays">빛줄기</option>
          <option value="bokeh">보케 (빛망울)</option>
          <option value="hearts">하트 보케</option>
          <option value="sparkle">스파클</option>
        </select>
        <button class="dropBtn" id="fxSeed" title="배치 무작위 재생성">🔀</button>
      </div>
      <div class="row"><label>프레임</label>
        <select id="fxFrame">
          <option value="round">라운드 사각</option>
          <option value="circle">원형 + 2색 링</option>
          <option value="square">사각 (얇은 테두리)</option>
        </select>
      </div>
    </div>

    <div class="sec">
      <h3>표정 (시트 3개 · 포스터A 4개)</h3>
      <div class="selRow">
        <select id="selFaceSrc">
          <option value="base">얼굴 소스: 기본</option>
          <option value="vari">얼굴 소스: 바리에이션</option>
        </select>
      </div>
      <div class="thumbCtl" data-i="0">
        <canvas class="tprev" width="88" height="88"></canvas>
        <select class="tFilter"></select>
        <button class="mini tUp" title="이미지로 교체">📁</button>
        <button class="mini tClr" title="교체 해제">↻</button>
      </div>
      <div class="thumbCtl" data-i="1">
        <canvas class="tprev" width="88" height="88"></canvas>
        <select class="tFilter"></select>
        <button class="mini tUp" title="이미지로 교체">📁</button>
        <button class="mini tClr" title="교체 해제">↻</button>
      </div>
      <div class="thumbCtl" data-i="2">
        <canvas class="tprev" width="88" height="88"></canvas>
        <select class="tFilter"></select>
        <button class="mini tUp" title="이미지로 교체">📁</button>
        <button class="mini tClr" title="교체 해제">↻</button>
      </div>
      <div class="thumbCtl" data-i="3">
        <canvas class="tprev" width="88" height="88"></canvas>
        <select class="tFilter"></select>
        <button class="mini tUp" title="이미지로 교체">📁</button>
        <button class="mini tClr" title="교체 해제">↻</button>
      </div>
      <input type="file" id="fileThumb" accept="image/*">
      <div class="hint">썸네일 위에서 드래그/휠 = 얼굴 위치·크기 (전체 공통)</div>
    </div>

    <div class="sec">
      <h3>시트 전용</h3>
      <div class="selRow">
        <select id="selCropSrc">
          <option value="auto">확대컷: 자동 (바리에이션 우선)</option>
          <option value="base">확대컷: 기본 일러스트</option>
          <option value="vari">확대컷: 바리에이션</option>
        </select>
      </div>
      <label class="chk"><input type="checkbox" id="chkLogo" checked> 로고 표시 (우하단 Z)</label>
      <label class="chk"><input type="checkbox" id="chkPanel" checked> 흰 패널 배경</label>
    </div>

    <div class="sec">
      <h3>프리셋</h3>
      <div id="presetList"></div>
      <button class="bt" id="btnSavePreset">💾 현재 상태를 프리셋으로 저장</button>
    </div>

    <div class="sec">
      <button class="bt pri" id="btnExport">⬇ PNG 다운로드 (고해상도)</button>
      <button class="bt" id="btnReset">전체 초기화</button>
    </div>
  </div>

  <div id="main">
    <div id="topbar">
      <b>SHEET MAKER</b>
      <span id="tbSize"></span>
      <span id="tbInfo"></span>
    </div>
    <div id="stage">
      <canvas id="pv"></canvas>
      <div id="hintFloat">드래그 = 이동 · 휠 = 크기 · 💧 스포이드 = 색 추출</div>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
'use strict';
/* ═══════════════ 설계 좌표계: 폭 1000 고정, 높이는 템플릿별 ═══════════════ */
const DW = 1000;
const TPL = {
  sheet:   {dh:1417, label:'시트'},
  poster:  {dh:1778, label:'포스터A'},
  graphic: {dh:1917, label:'포스터B'},
};
const EXPORT_W = 3000;
const DH = () => TPL[S.tpl].dh;

const L = { // 시트 템플릿 레이아웃 상수
  panel: {x:52, y:96, w:896, h:1244, r:44},
  titleX: 36, titleY: 62, subY: 104,
  pal: {x:92, y:172, w:54, h:40, gx:10, gy:12},
  creditY: 420,
  thumbs: {x:20, y:844, size:176, gap:16, r:34},
  logo: {x:902, y:1322, size:76, r:20},
};
const PB = { // 포스터A 레이아웃
  titleX:42, titleY:170, subY:236,
  ribbonY:470,
  thumbCx:108, thumbY0:660, thumbR:92, thumbGap:226,
  descY:1600,
};

const FILTERS = [
  ['none','기본'],['shadow','그늘 (어둡게)'],['sparkle','반짝임'],['blush','홍조'],['gloom','섬뜩 (보라그늘)'],
];

/* ─── 상태 ─── */
const defaultSettings = () => ({
  tpl:'sheet',
  nameEn:'', sub:'Live 2D illust', credit:'momukko',
  quote:'', ribbon:'', desc:'',
  font:'round',
  palette:['#f3d9c2','#e8b06a','#f5efe2','#7ab8f0','#d9ae56','#4a90d9','#8a6f4d','#2b2b33'],
  accent:'#e8a13d', bg:'#faf3e4', stripe:'#f0dcae', second:'#ffd95e',
  fx:{bg:'wash', glow:0.35, glowColor:'#ffffff', light:'none', frame:'round', seed:7},
  pl:{ sheet:null, poster:null, graphic:null }, // 템플릿별 {full:{x,y,s}, crop:{x,y,s}}
  face:{x:0,y:0,s:1},
  cropSrc:'auto', faceSrc:'base',
  filters:['shadow','none','sparkle','blush'],
  showLogo:true, showPanel:true,
  autoColor:true,
});
let S = defaultSettings();
let IMG = {base:null, vari:null, thumb0:null, thumb1:null, thumb2:null, thumb3:null};
let META = {base:null, vari:null};

/* ─── IndexedDB ─── */
const idb = {
  db:null,
  open(){ return new Promise((res,rej)=>{
    const r = indexedDB.open('mm_sheet',1);
    r.onupgradeneeded = e=>{
      const d=e.target.result;
      if(!d.objectStoreNames.contains('imgs')) d.createObjectStore('imgs');
      if(!d.objectStoreNames.contains('presets')) d.createObjectStore('presets');
    };
    r.onsuccess=e=>{idb.db=e.target.result;res();};
    r.onerror=rej;
  });},
  put(store,key,val){ return new Promise((res,rej)=>{
    const t=idb.db.transaction(store,'readwrite');
    t.objectStore(store).put(val,key); t.oncomplete=res; t.onerror=rej;
  });},
  get(store,key){ return new Promise((res,rej)=>{
    const r=idb.db.transaction(store).objectStore(store).get(key);
    r.onsuccess=()=>res(r.result); r.onerror=rej;
  });},
  del(store,key){ return new Promise((res,rej)=>{
    const t=idb.db.transaction(store,'readwrite');
    t.objectStore(store).delete(key); t.oncomplete=res; t.onerror=rej;
  });},
  keys(store){ return new Promise((res,rej)=>{
    const r=idb.db.transaction(store).objectStore(store).getAllKeys();
    r.onsuccess=()=>res(r.result); r.onerror=rej;
  });},
};

const $ = s=>document.querySelector(s);
const $$ = s=>[...document.querySelectorAll(s)];
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._to); t._to=setTimeout(()=>t.classList.remove('show'),2200); }
function hex2rgb(h){ h=h.replace('#',''); if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2]; return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; }
function rgb2hex(r,g,b){ return '#'+[r,g,b].map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,'0')).join(''); }
function rgb2hsv(r,g,b){ r/=255;g/=255;b/=255; const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn; let h=0;
  if(d){ if(mx===r)h=((g-b)/d)%6; else if(mx===g)h=(b-r)/d+2; else h=(r-g)/d+4; h*=60; if(h<0)h+=360; }
  return [h, mx?d/mx:0, mx]; }
function hsv2rgb(h,s,v){ const c=v*s, x=c*(1-Math.abs((h/60)%2-1)), m=v-c;
  let r,g,b; if(h<60)[r,g,b]=[c,x,0]; else if(h<120)[r,g,b]=[x,c,0]; else if(h<180)[r,g,b]=[0,c,x];
  else if(h<240)[r,g,b]=[0,x,c]; else if(h<300)[r,g,b]=[x,0,c]; else [r,g,b]=[c,0,x];
  return [(r+m)*255,(g+m)*255,(b+m)*255]; }
function mix(hexA,hexB,t){ const a=hex2rgb(hexA),b=hex2rgb(hexB); return rgb2hex(a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t); }
function withAlpha(hex,a){ const [r,g,b]=hex2rgb(hex); return `rgba(${r},${g},${b},${a})`; }
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

/* ─── 이미지 분석: bbox + 얼굴 추정 ─── */
function analyzeImage(img){
  const mw = 240, sc = Math.min(1, mw/img.width);
  const w = Math.max(1,Math.round(img.width*sc)), h = Math.max(1,Math.round(img.height*sc));
  const c = document.createElement('canvas'); c.width=w; c.height=h;
  const x = c.getContext('2d',{willReadFrequently:true});
  x.drawImage(img,0,0,w,h);
  const d = x.getImageData(0,0,w,h).data;
  let minX=w,minY=h,maxX=0,maxY=0,found=false;
  for(let y=0;y<h;y++)for(let xx=0;xx<w;xx++){
    if(d[(y*w+xx)*4+3]>40){ found=true;
      if(xx<minX)minX=xx; if(xx>maxX)maxX=xx; if(y<minY)minY=y; if(y>maxY)maxY=y; }
  }
  if(!found){minX=0;minY=0;maxX=w-1;maxY=h-1;}
  const bbox = {x:minX/sc, y:minY/sc, w:(maxX-minX+1)/sc, h:(maxY-minY+1)/sc};
  // 얼굴 추정: 상단 25% 구간에서 "가로폭이 가장 넓은 행" = 머리.
  const bh = maxY-minY+1;
  const yEnd = Math.min(h-1, minY + Math.floor(bh*0.25));
  const rows = [];
  let wMax = 0;
  for(let y=minY;y<=yEnd;y++){
    let cnt=0, sx=0;
    for(let xx=minX;xx<=maxX;xx++)
      if(d[(y*w+xx)*4+3]>40){ cnt++; sx+=xx; }
    rows.push({y, cnt, cx: cnt? sx/cnt : (minX+maxX)/2});
    if(cnt>wMax) wMax=cnt;
  }
  let headTop = minY, headCx = (minX+maxX)/2;
  for(const r of rows){ if(r.cnt > wMax*0.5){ headTop=r.y; headCx=r.cx; break; } }
  const headW = Math.min(wMax, bh*0.32);
  const face = { x:headCx/sc, y:(headTop+headW*0.55)/sc, head:(headW*0.9)/sc };
  return {w:img.width, h:img.height, bbox, face};
}

/* ─── 색 추출: median cut ─── */
function extractColors(img){
  const mw = 160, sc = Math.min(1, mw/img.width);
  const w = Math.max(1,Math.round(img.width*sc)), h = Math.max(1,Math.round(img.height*sc));
  const c = document.createElement('canvas'); c.width=w; c.height=h;
  const x = c.getContext('2d',{willReadFrequently:true});
  x.drawImage(img,0,0,w,h);
  const d = x.getImageData(0,0,w,h).data;
  const px=[];
  for(let i=0;i<d.length;i+=4) if(d[i+3]>200) px.push([d[i],d[i+1],d[i+2]]);
  if(!px.length) return null;
  let boxes=[px];
  while(boxes.length<16){
    let bi=-1,bs=-1;
    boxes.forEach((b,i)=>{ if(b.length<2) return;
      let rng=0; for(let ch=0;ch<3;ch++){ let mn=255,mx=0; for(const p of b){if(p[ch]<mn)mn=p[ch];if(p[ch]>mx)mx=p[ch];} rng=Math.max(rng,mx-mn); }
      const sc2=rng*Math.sqrt(b.length); if(sc2>bs){bs=sc2;bi=i;} });
    if(bi<0) break;
    const b=boxes[bi]; let ch=0,rng=-1;
    for(let k=0;k<3;k++){ let mn=255,mx=0; for(const p of b){if(p[k]<mn)mn=p[k];if(p[k]>mx)mx=p[k];} if(mx-mn>rng){rng=mx-mn;ch=k;} }
    b.sort((a,q)=>a[ch]-q[ch]);
    const mid=b.length>>1;
    boxes.splice(bi,1,b.slice(0,mid),b.slice(mid));
  }
  const clusters = boxes.filter(b=>b.length).map(b=>{
    let r=0,g=0,bl=0; for(const p of b){r+=p[0];g+=p[1];bl+=p[2];}
    const n=b.length; return {rgb:[r/n,g/n,bl/n], n};
  });
  let accent=null, best=-1, accentH=0;
  for(const cl of clusters){
    const [hh,ss,vv]=rgb2hsv(...cl.rgb);
    if(vv>0.97&&ss<0.1) continue; if(vv<0.13) continue;
    const score = Math.pow(ss,1.3)*Math.sqrt(cl.n)*(0.4+0.6*vv);
    if(score>best){best=score;accent=cl.rgb.slice();accentH=hh;}
  }
  if(!accent) accent=clusters[0].rgb.slice();
  // 2차색(글로우 후보): 포인트색과 색상 차이가 큰 채도 높은 클러스터
  let second=null, sBest=-1;
  for(const cl of clusters){
    const [hh,ss,vv]=rgb2hsv(...cl.rgb);
    if(vv>0.97&&ss<0.12) continue; if(vv<0.2) continue;
    let dh=Math.abs(hh-accentH); if(dh>180)dh=360-dh;
    if(dh<50) continue;
    const score = ss*Math.sqrt(cl.n)*vv;
    if(score>sBest){sBest=score;second=cl.rgb.slice();}
  }
  clusters.sort((a,b)=>b.n-a.n);
  const pal=[];
  for(const cl of clusters){
    if(pal.length>=8) break;
    if(pal.every(p=>Math.hypot(p[0]-cl.rgb[0],p[1]-cl.rgb[1],p[2]-cl.rgb[2])>24)) pal.push(cl.rgb.slice());
  }
  while(pal.length<8) pal.push([230,230,230]);
  pal.sort((a,b)=>(b[0]*.299+b[1]*.587+b[2]*.114)-(a[0]*.299+a[1]*.587+a[2]*.114));
  const [ah,as,av]=rgb2hsv(...accent);
  return {
    accent: rgb2hex(...accent),
    bg: rgb2hex(...hsv2rgb(ah, Math.min(0.30,as*0.42), 0.975)),
    stripe: rgb2hex(...hsv2rgb(ah, Math.min(0.42,as*0.6), 0.90)),
    palette: pal.map(p=>rgb2hex(...p)),
    second: second? rgb2hex(...second) : rgb2hex(...hsv2rgb((ah+40)%360, Math.min(0.5,as), 0.95)),
  };
}

/* ═══════════════ 공용 그리기 헬퍼 ═══════════════ */
function rr(ctx,x,y,w,h,r){
  if(typeof r==='number') r=[r,r,r,r];
  ctx.beginPath();
  ctx.moveTo(x+r[0],y);
  ctx.lineTo(x+w-r[1],y); ctx.arcTo(x+w,y,x+w,y+r[1],r[1]);
  ctx.lineTo(x+w,y+h-r[2]); ctx.arcTo(x+w,y+h,x+w-r[2],y+h,r[2]);
  ctx.lineTo(x+r[3],y+h); ctx.arcTo(x,y+h,x,y+h-r[3],r[3]);
  ctx.lineTo(x,y+r[0]); ctx.arcTo(x,y,x+r[0],y,r[0]);
  ctx.closePath();
}
function vText(ctx, text, x, y, angle){
  ctx.save(); ctx.translate(x,y); ctx.rotate(angle); ctx.fillText(text,0,0); ctx.restore();
}
/* 실루엣 글로우/고스트: img을 단색 실루엣으로 만들어 blur/offset해 그림 */
function drawSilhouette(ctx, img, dx, dy, dw, dh, color, blurPx, alpha, offX, offY){
  if(alpha<=0.01) return;
  const cap = 2400; // 오프스크린 상한 (성능)
  const sc = Math.min(1, cap/Math.max(dw,dh));
  const oc = document.createElement('canvas');
  oc.width=Math.max(1,Math.round(dw*sc)); oc.height=Math.max(1,Math.round(dh*sc));
  const c=oc.getContext('2d');
  c.drawImage(img,0,0,oc.width,oc.height);
  c.globalCompositeOperation='source-in';
  c.fillStyle=color; c.fillRect(0,0,oc.width,oc.height);
  ctx.save();
  ctx.globalAlpha=alpha;
  if(blurPx>0) ctx.filter=`blur(${blurPx}px)`;
  ctx.drawImage(oc, dx+(offX||0), dy+(offY||0), dw, dh);
  ctx.restore();
}
/* 배경: 일러스트 블러 */
function drawBlurBg(ctx,k,W,H){

/* 라이팅 오버레이 */
function heartPath(c,x,y,s){
  c.moveTo(x,y+s*0.3);
  c.bezierCurveTo(x, y, x-s*0.5, y-s*0.15, x-s*0.5, y+s*0.15);
  c.bezierCurveTo(x-s*0.5, y+s*0.45, x, y+s*0.6, x, y+s*0.85);
  c.bezierCurveTo(x, y+s*0.6, x+s*0.5, y+s*0.45, x+s*0.5, y+s*0.15);
  c.bezierCurveTo(x+s*0.5, y-s*0.15, x, y, x, y+s*0.3);
}
function sparklePath(c,x,y,r){
  c.moveTo(x,y-r);
  c.quadraticCurveTo(x+r*0.12,y-r*0.12,x+r,y);
  c.quadraticCurveTo(x+r*0.12,y+r*0.12,x,y+r);
  c.quadraticCurveTo(x-r*0.12,y+r*0.12,x-r,y);
  c.quadraticCurveTo(x-r*0.12,y-r*0.12,x,y-r);
}
function drawLighting(ctx,k,W,H){
  const mode=S.fx.light;
  if(mode==='none') return;
  const rnd=mulberry32(S.fx.seed);
  ctx.save();
  if(mode==='rays'){
    ctx.globalCompositeOperation='overlay';
    for(let i=0;i<4;i++){
      const bx = W*(0.35+rnd()*0.6), bw=(50+rnd()*110)*k;
      ctx.save();
      ctx.translate(bx,0); ctx.rotate(0.45+rnd()*0.15);
      const g=ctx.createLinearGradient(0,0,0,H*1.1);
      const a=0.25+rnd()*0.3;
      g.addColorStop(0,`rgba(255,255,255,${a})`);
      g.addColorStop(0.7,`rgba(255,255,255,${a*0.25})`);
      g.addColorStop(1,'rgba(255,255,255,0)');
      ctx.fillStyle=g;
      ctx.fillRect(-bw/2,-H*0.1,bw,H*1.3);
      ctx.restore();
    }
  }else if(mode==='bokeh'){
    ctx.globalCompositeOperation='lighter';
    for(let i=0;i<20;i++){
      const x=rnd()*W, y=rnd()*H, r=(10+rnd()*52)*k, a=0.04+rnd()*0.12;
      ctx.beginPath(); ctx.arc(x,y,r,0,7);
      if(rnd()<0.3){ ctx.strokeStyle=`rgba(255,255,255,${a*2})`; ctx.lineWidth=2.5*k; ctx.stroke(); }
      else{ ctx.fillStyle=`rgba(255,255,255,${a})`; ctx.fill(); }
    }
  }else if(mode==='hearts'){
    ctx.globalCompositeOperation='lighter';
    for(let i=0;i<13;i++){
      const x=rnd()*W, y=rnd()*H*0.85, s=(20+rnd()*70)*k, a=0.05+rnd()*0.11;
      ctx.beginPath(); heartPath(ctx,x,y,s);
      ctx.fillStyle=`rgba(255,158,196,${a})`; ctx.fill();
    }
  }else if(mode==='sparkle'){
    for(let i=0;i<14;i++){
      const x=rnd()*W, y=rnd()*H*0.7, r=(5+rnd()*16)*k, a=0.35+rnd()*0.55;
      ctx.beginPath(); sparklePath(ctx,x,y,r);
      ctx.fillStyle=`rgba(255,255,255,${a})`; ctx.fill();
    }
  }
  ctx.restore();
}
/* 표정 콘텐츠 (정사각 오프스크린) */
function thumbContent(idx, O){
  const T=L.thumbs.size;

  const key = faceSource();
  const src = custom || IMG[key];
  const filter = custom ? 'none' : S.filters[idx];
  const oc=document.createElement('canvas'); oc.width=O; oc.height=O;
  const c=oc.getContext('2d');
  const ks=O/T;
  c.fillStyle = mix(S.bg,'#ffffff',0.5);
  c.fillRect(0,0,O,O);
  if(src){
    if(custom){
      const cs=Math.max(O/src.width,O/src.height);
      c.drawImage(src,(O-src.width*cs)/2,(O-src.height*cs)/2,src.width*cs,src.height*cs);
    }else{
      c.drawImage(src, S.face.x*ks, S.face.y*ks, src.width*S.face.s*ks, src.height*S.face.s*ks);
    }
    if(filter==='shadow'){
      c.globalCompositeOperation='source-atop';

    }else if(filter==='gloom'){
      c.globalCompositeOperation='source-atop';
      c.fillStyle='rgba(70,40,110,0.4)'; c.fillRect(0,0,O,O);
      const g=c.createLinearGradient(0,0,0,O);
      g.addColorStop(0,'rgba(30,15,60,0.72)'); g.addColorStop(0.55,'rgba(30,15,60,0.08)'); g.addColorStop(1,'rgba(30,15,60,0)');
      c.fillStyle=g; c.fillRect(0,0,O,O);
      c.globalCompositeOperation='source-over';
    }else if(filter==='sparkle'){
      c.globalCompositeOperation='source-atop';
      c.fillStyle='rgba(255,255,255,0.09)'; c.fillRect(0,0,O,O);
      c.globalCompositeOperation='source-over';
      const sp=(px,py,r,a)=>{ c.beginPath(); sparklePath(c,px*O,py*O,r); c.fillStyle=`rgba(255,255,255,${a})`; c.fill(); };
      sp(0.30,0.34,O*0.09,0.95); sp(0.72,0.30,O*0.06,0.9); sp(0.58,0.52,O*0.045,0.8);
    }else if(filter==='blush'){
      c.globalCompositeOperation='source-atop';
      for(const cx of [0.30,0.70]){
        const g=c.createRadialGradient(cx*O,0.60*O,0,cx*O,0.60*O,O*0.14);
        g.addColorStop(0,'rgba(255,120,140,0.5)'); g.addColorStop(1,'rgba(255,120,140,0)');
        c.fillStyle=g; c.beginPath(); c.arc(cx*O,0.60*O,O*0.15,0,7); c.fill();
      }
      c.fillStyle='rgba(255,170,170,0.10)'; c.fillRect(0,0,O,O);
      c.globalCompositeOperation='source-over';
    }
  }else{
    c.fillStyle='rgba(0,0,0,0.15)';
    c.font=`${O*0.15}px sans-serif`; c.textAlign='center';
    c.fillText('표정',O/2,O/2);
  }
  return oc;
}
/* 프레임 씌워 그리기: shape=round|circle|square, (cx,cy)=중심, size=지름/변 */
function drawFramedThumb(ctx,k,idx,cx,cy,size){

  const x=(cx-size/2)*k, y=(cy-size/2)*k;
  if(shape==='circle'){
    const r=size/2*k;
    ctx.save();
    ctx.shadowColor='rgba(0,0,0,0.15)'; ctx.shadowBlur=12*k; ctx.shadowOffsetY=4*k;
    ctx.beginPath(); ctx.arc(cx*k,cy*k,r,0,7); ctx.fillStyle='#fff'; ctx.fill();
    ctx.restore();
    ctx.save();
    ctx.beginPath(); ctx.arc(cx*k,cy*k,r-3*k,0,7); ctx.clip();
    ctx.drawImage(oc,x,y,O,O);
    ctx.restore();
    // 2색 링
    ctx.lineWidth=5*k; ctx.strokeStyle=S.accent;
    ctx.beginPath(); ctx.arc(cx*k,cy*k,r-2.5*k,0,7); ctx.stroke();
    ctx.lineWidth=3*k; ctx.strokeStyle='#ffffff';
    ctx.beginPath(); ctx.arc(cx*k,cy*k,r-7*k,0,7); ctx.stroke();
    ctx.lineWidth=2*k; ctx.strokeStyle=withAlpha(mix(S.accent,'#000',0.25),0.8);
    ctx.beginPath(); ctx.arc(cx*k,cy*k,r+1.5*k,0,7); ctx.stroke();
  }else if(shape==='square'){
    ctx.save();
    ctx.shadowColor='rgba(0,0,0,0.14)'; ctx.shadowBlur=10*k; ctx.shadowOffsetY=3*k;
    ctx.fillStyle='#fff'; ctx.fillRect(x,y,O,O);
    ctx.restore();
    ctx.drawImage(oc, x+2*k, y+2*k, O-4*k, O-4*k);
    ctx.strokeStyle='rgba(255,255,255,0.95)'; ctx.lineWidth=3*k;
    ctx.strokeRect(x+1.5*k,y+1.5*k,O-3*k,O-3*k);
  }else{ // round
    const r=L.thumbs.r;
    ctx.save();
    ctx.shadowColor='rgba(0,0,0,0.13)'; ctx.shadowBlur=14*k; ctx.shadowOffsetY=4*k;
    rr(ctx,x,y,O,O,r*k); ctx.fillStyle='#fff'; ctx.fill();
    ctx.restore();
    ctx.save();
    rr(ctx,x,y,O,O,r*k); ctx.clip();
    ctx.drawImage(oc,x,y);
    ctx.restore();
    ctx.save();
    rr(ctx,x+2*k,y+2*k,O-4*k,O-4*k,(r-2)*k);
    ctx.strokeStyle='#ffffff'; ctx.lineWidth=5*k; ctx.stroke();
    ctx.restore();
  }
}
function drawStripes(ctx,k){
  const zones = [
    {x:640*k,y:0,w:360*k,h:300*k},
    {x:0,y:1120*k,w:330*k,h:297*k},
  ];
  for(const z of zones){
    ctx.save();
    ctx.beginPath(); ctx.rect(z.x,z.y,z.w,z.h); ctx.clip();
    ctx.strokeStyle = withAlpha(S.stripe,0.5);
    ctx.lineWidth = 10*k;
    const step = 46*k, ext = 500*k;
    for(let i=-20;i<40;i++){
      ctx.beginPath();
      ctx.moveTo(z.x - ext + i*step, z.y - ext);
      ctx.lineTo(z.x + i*step + ext, z.y + z.h + ext);
      ctx.stroke();
    }
    ctx.lineWidth = 3.5*k;
    ctx.strokeStyle = withAlpha(S.stripe,0.75);
    for(let i=-20;i<40;i++){
      ctx.beginPath();
      ctx.moveTo(z.x + i*step + ext, z.y - ext);
      ctx.lineTo(z.x - ext + i*step, z.y + z.h + ext);
      ctx.stroke();
    }
    ctx.restore();
  }
}
function drawFullBody(ctx,k,p){
  if(!IMG.base) return;
  // 글로우
  const g=S.fx.glow;
  if(g>0.01){
    drawSilhouette(ctx, IMG.base, p.full.x*k, p.full.y*k,
      IMG.base.width*p.full.s*k, IMG.base.height*p.full.s*k,
      S.fx.glowColor, 22*k*g+4, Math.min(1,g*1.15), 0, 0);
  }
  ctx.save();
  ctx.shadowColor='rgba(0,0,0,0.16)'; ctx.shadowBlur=20*k; ctx.shadowOffsetY=6*k;
  ctx.drawImage(IMG.base, p.full.x*k, p.full.y*k, IMG.base.width*p.full.s*k, IMG.base.height*p.full.s*k);
  ctx.restore();
}
function drawPlaceholder(ctx,k,W,H){
  ctx.fillStyle='rgba(0,0,0,0.25)';
  ctx.font=`700 ${26*k}px "Noto Sans KR",sans-serif`; ctx.textAlign='center';
  ctx.fillText('← 기본 일러스트를 업로드하세요', W/2, H/2);
  ctx.textAlign='left';
}

/* ═══════════════ 템플릿 1: 시트 ═══════════════ */
function renderSheet(ctx,k){
  const W=DW*k, H=TPL.sheet.dh*k;
  const p=pl();
  drawBgByMode(ctx,k,W,H);
  if(S.fx.bg!=='blurimg') drawStripes(ctx,k);
  if(S.showPanel){
    ctx.save();
    ctx.shadowColor=withAlpha(S.accent,0.18); ctx.shadowBlur=34*k; ctx.shadowOffsetY=8*k;
    rr(ctx,L.panel.x*k,L.panel.y*k,L.panel.w*k,L.panel.h*k,L.panel.r*k);
    ctx.fillStyle='rgba(255,255,255,0.72)';
    ctx.fill();
    ctx.restore();
  }
  // 확대컷
  const ck = cropSource();
  if(IMG[ck]){
    ctx.save();
    ctx.shadowColor=withAlpha(S.accent,0.30); ctx.shadowBlur=26*k; ctx.shadowOffsetX=-6*k;
    ctx.drawImage(IMG[ck], p.crop.x*k, p.crop.y*k, IMG[ck].width*p.crop.s*k, IMG[ck].height*p.crop.s*k);
    ctx.restore();
  }
  if(IMG.base) drawFullBody(ctx,k,p); else drawPlaceholder(ctx,k,W,H);
  drawLighting(ctx,k,W,H);
  // 타이틀
  const dark = mix(S.accent,'#000000',0.25);
  const grad = ctx.createLinearGradient(0,(L.titleY-52)*k,0,L.titleY*k);
  grad.addColorStop(0, mix(S.accent,'#ffffff',0.18));
  grad.addColorStop(1, dark);
  ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  ctx.save();
  ctx.shadowColor='rgba(255,255,255,0.9)'; ctx.shadowBlur=6*k;
  ctx.fillStyle=grad;
  ctx.font=titleFont(74*k);
  ctx.fillText(S.nameEn||'', L.titleX*k, L.titleY*k);
  ctx.restore();
  ctx.fillStyle=withAlpha(S.accent,0.55);
  ctx.font=titleFont(30*k);
  ctx.fillText(S.sub||'', (L.titleX+4)*k, L.subY*k);
  // 팔레트
  const P=L.pal;
  for(let i=0;i<8;i++){
    const col=i%2, row=i>>1;
    const x=(P.x+col*(P.w+P.gx))*k, y=(P.y+row*(P.h+P.gy))*k;
    const rad = col===0 ? [16,5,5,5] : [5,16,5,5];
    ctx.save();
    ctx.shadowColor='rgba(0,0,0,0.10)'; ctx.shadowBlur=5*k; ctx.shadowOffsetY=2*k;
    rr(ctx,x,y,P.w*k,P.h*k,rad.map(r=>r*k));
    ctx.fillStyle=S.palette[i]||'#ccc'; ctx.fill();
    ctx.restore();
  }
  // 크레딧
  ctx.fillStyle=withAlpha(S.accent,0.45);
  ctx.font=titleFont(25*k);
  ctx.fillText('illust', (P.x+2)*k, L.creditY*k);
  ctx.fillStyle=withAlpha(S.accent,0.75);
  ctx.font=titleFont(31*k);
  ctx.fillText(S.credit||'', (P.x+2)*k, (L.creditY+34)*k);
  // 표정 3개
  const T=L.thumbs;
  for(let i=0;i<3;i++){
    drawFramedThumb(ctx,k,i, T.x+T.size/2, T.y+i*(T.size+T.gap)+T.size/2, T.size);
  }
  // 로고
  if(S.showLogo){
    const G=L.logo;
    ctx.save();
    ctx.shadowColor='rgba(0,0,0,0.2)'; ctx.shadowBlur=8*k; ctx.shadowOffsetY=3*k;
    rr(ctx,G.x*k,G.y*k,G.size*k,G.size*k,G.r*k);
    ctx.fillStyle='#252B38'; ctx.fill();
    ctx.restore();
    ctx.fillStyle='#fff';
    ctx.font=`800 ${G.size*0.62*k}px "Baloo 2",sans-serif`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('Z', (G.x+G.size/2)*k, (G.y+G.size/2+3)*k);
    ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  }
}

/* ═══════════════ 템플릿 2: 포스터A (소개 카드풍) ═══════════════ */
function renderPoster(ctx,k){
  const W=DW*k, H=TPL.poster.dh*k;
  const p=pl();
  drawBgByMode(ctx,k,W,H);
  // 안쪽 얇은 프레임
  ctx.strokeStyle='rgba(255,255,255,0.5)'; ctx.lineWidth=2*k;
  ctx.strokeRect(26*k,26*k,W-52*k,H-52*k);
  // 캐릭터
  if(IMG.base) drawFullBody(ctx,k,p); else drawPlaceholder(ctx,k,W,H);
  drawLighting(ctx,k,W,H);
  const dark = mix(S.accent,'#000000',0.42);
  // ── 제목 (좌상단, 큰 글씨) ──
  ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  ctx.save();
  ctx.shadowColor='rgba(255,255,255,0.75)'; ctx.shadowBlur=10*k;
  ctx.fillStyle=dark;
  ctx.font=titleFont(112*k);
  ctx.fillText(S.nameEn||'', PB.titleX*k, PB.titleY*k);
  ctx.restore();
  ctx.fillStyle=mix(S.accent,'#ffffff',0.1);
  ctx.font=titleFont(46*k);
  ctx.fillText(S.sub||'', (PB.titleX+4)*k, PB.subY*k);
  // ── 인용문 (우상단) ──
  if(S.quote){
    const lines=S.quote.split('\n');
    ctx.textAlign='right';
    ctx.fillStyle=mix(S.accent,'#ffffff',0.25);
    ctx.font=`800 ${72*k}px Georgia,serif`;
    ctx.fillText('“', (W-56*k), 128*k);
    ctx.fillStyle=dark;
    ctx.font=`700 ${29*k}px "Noto Sans KR",sans-serif`;
    lines.forEach((ln,i)=>ctx.fillText(ln, W-60*k, (168+i*44)*k));
    ctx.fillStyle=mix(S.accent,'#ffffff',0.25);
    ctx.font=`800 ${72*k}px Georgia,serif`;
    ctx.fillText('”', (W-56*k), (188+lines.length*44)*k);
    ctx.textAlign='left';
  }
  // ── 소속 리본 ──
  if(S.ribbon){
    const lines=S.ribbon.split('\n');
    const rh=(26+lines.length*34)*k;
    ctx.save();
    ctx.shadowColor='rgba(0,0,0,0.25)'; ctx.shadowBlur=8*k; ctx.shadowOffsetY=3*k;
    ctx.fillStyle=mix(dark,'#000',0.35);
    ctx.beginPath();
    ctx.moveTo(0,PB.ribbonY*k);
    ctx.lineTo(348*k,PB.ribbonY*k);
    ctx.lineTo(322*k,PB.ribbonY*k+rh);
    ctx.lineTo(0,PB.ribbonY*k+rh);
    ctx.closePath(); ctx.fill();
    ctx.restore();
    ctx.fillStyle='#fff';
    ctx.font=`700 ${24*k}px "Noto Sans KR",sans-serif`;
    lines.forEach((ln,i)=>ctx.fillText(ln, 30*k, (PB.ribbonY+38+i*34)*k));
  }
  // ── 표정 4개 (좌측 열) ──
  for(let i=0;i<4;i++){
    drawFramedThumb(ctx,k,i, PB.thumbCx, PB.thumbY0+i*PB.thumbGap, PB.thumbR*2);
  }
  // ── 하단 설명 ──
  if(S.desc){
    const lines=S.desc.split('\n');
    const dh2=(46+lines.length*40)*k;
    ctx.save();
    rr(ctx,70*k,PB.descY*k,(W-140*k),dh2,18*k);
    ctx.fillStyle='rgba(255,255,255,0.8)'; ctx.fill();
    ctx.restore();
    ctx.fillStyle=mix(dark,'#000',0.2);
    ctx.font=`500 ${26*k}px "Noto Sans KR",sans-serif`;
    ctx.textAlign='center';
    lines.forEach((ln,i)=>ctx.fillText(ln, W/2, (PB.descY+52+i*40)*k));
    ctx.textAlign='left';
  }
  // ── 하단 크레딧 로고 ──
  ctx.textAlign='center';
  ctx.save();
  ctx.shadowColor='rgba(255,255,255,0.8)'; ctx.shadowBlur=6*k;
  ctx.fillStyle=dark;
  ctx.font=titleFont(40*k);
  ctx.fillText(S.credit||'', W/2, (TPL.poster.dh-42)*k);
  ctx.restore();
  ctx.textAlign='left';
  // ── 우측 세로 소문구 ──
  ctx.fillStyle=withAlpha(dark,0.55);
  ctx.font=`400 ${17*k}px "DM Mono",monospace`;
  vText(ctx, `© ${new Date().getFullYear()} ${S.credit||''}  all rights reserved.`, (W-20*k), H*0.42, Math.PI/2);
}

/* ═══════════════ 템플릿 3: 포스터B (그래픽풍) ═══════════════ */
function renderGraphic(ctx,k){
  const W=DW*k, H=TPL.graphic.dh*k;
  const p=pl();
  const paper = mix(S.palette[0]||'#f2f2f4','#ffffff',0.55);
  ctx.fillStyle=paper; ctx.fillRect(0,0,W,H);
  const ac = S.accent;
  // 고스트색: 사용자가 안 바꿨거나 너무 밝으면 2차색/노랑 폴백 (흰 배경에서 안 보이므로)
  let ac2 = S.fx.glowColor;
  { const [,,v]=rgb2hsv(...hex2rgb(ac2)); const [,s2]=rgb2hsv(...hex2rgb(ac2));
    if(v>0.93&&s2<0.2) ac2 = S.second || '#ffd95e'; }
  const rnd=mulberry32(S.fx.seed+11);
  // ── 데코: 그리드 코너 ──
  ctx.save();
  ctx.strokeStyle=withAlpha('#8a8a96',0.35); ctx.lineWidth=1*k;
  ctx.beginPath(); ctx.rect(0,H-260*k,300*k,260*k); ctx.clip();
  for(let i=0;i<14;i++){
    ctx.beginPath(); ctx.moveTo(i*26*k, H); ctx.lineTo(i*26*k-90*k, H-260*k); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, H-i*24*k); ctx.lineTo(300*k, H-i*24*k-40*k); ctx.stroke();
  }
  ctx.restore();
  // 점 패턴 사각
  ctx.fillStyle=withAlpha(ac,0.25);
  for(let gy=0;gy<7;gy++)for(let gx=0;gx<7;gx++){
    ctx.beginPath(); ctx.arc((790+gx*22)*k,(560+gy*22)*k,2.2*k,0,7); ctx.fill();
  }
  // 얇은 원형 커브
  ctx.strokeStyle=withAlpha(ac,0.4); ctx.lineWidth=2.2*k;
  ctx.beginPath(); ctx.ellipse(W*0.52,H*0.42,W*0.55,H*0.30,-0.25,0,7); ctx.stroke();
  ctx.strokeStyle=withAlpha(ac2,0.45); ctx.lineWidth=2.2*k;
  ctx.beginPath(); ctx.ellipse(W*0.45,H*0.62,W*0.58,H*0.24,0.18,0,7); ctx.stroke();
  // + 크로스
  ctx.strokeStyle=withAlpha('#55555f',0.5); ctx.lineWidth=2*k;
  for(let i=0;i<6;i++){
    const cx2=(700+(i%3)*80)*k, cy2=(1490+Math.floor(i/3)*70)*k;
    ctx.beginPath(); ctx.moveTo(cx2-10*k,cy2); ctx.lineTo(cx2+10*k,cy2);
    ctx.moveTo(cx2,cy2-10*k); ctx.lineTo(cx2,cy2+10*k); ctx.stroke();
  }
  // 점선 사각
  ctx.setLineDash([6*k,6*k]);
  ctx.strokeStyle=withAlpha('#55555f',0.5); ctx.lineWidth=1.6*k;
  ctx.strokeRect(760*k,1620*k,190*k,150*k);
  ctx.setLineDash([]);
  // 작은 사각 마커 상단
  ctx.fillStyle=withAlpha('#55555f',0.5);
  for(let i=0;i<4;i++){
    if(i%2) ctx.strokeRect((430+i*46)*k,60*k,14*k,14*k);
    else ctx.fillRect((430+i*46)*k,60*k,14*k,14*k);
  }
  // ── 배경 대형 아웃라인 텍스트 (가로, 뒤) ──
  // 한글 제목이면 지저분해지므로 영문(ASCII) 필드를 우선 사용
  const isAscii = t=>/^[\x20-\x7e]+$/.test(t);
  const big=((isAscii(S.sub||'')&&S.sub) || (isAscii(S.nameEn||'')&&S.nameEn) || (isAscii(S.credit||'')&&S.credit) || 'NAME').toUpperCase();
  ctx.save();
  ctx.strokeStyle=withAlpha(ac,0.18); ctx.lineWidth=2.2*k;
  ctx.font=titleFont(170*k);
  ctx.textAlign='left';
  ['READ','THE','TITLE'].forEach((t,i)=>{}); // (자리표시 데코는 생략)
  ctx.strokeText(big, 40*k, 420*k);
  ctx.strokeText(big, -60*k, 580*k);
  ctx.restore();
  // ── 우측 세로 초대형 타이포 ──
  ctx.save();
  ctx.translate((W-40*k), 30*k);
  ctx.rotate(Math.PI/2);
  ctx.font=titleFont(215*k);
  ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  ctx.strokeStyle=withAlpha(mix(ac,'#000',0.1),0.5); ctx.lineWidth=2.6*k;
  ctx.strokeText(big, 0, 0);
  ctx.fillStyle=withAlpha(ac,0.10);
  ctx.fillText(big, 0, 0);
  ctx.restore();
  // ── 좌상단 브랜드 ──
  ctx.fillStyle=mix(ac,'#000',0.15);
  ctx.font=titleFont(56*k);
  ctx.fillText(S.sub||S.credit||'', 40*k, 96*k);
  // ── 캐릭터 (고스트 오프셋 + 본체) ──
  if(IMG.base){
    const dw=IMG.base.width*p.full.s*k, dh2=IMG.base.height*p.full.s*k;
    const g=S.fx.glow;
    if(g>0.01){
      drawSilhouette(ctx, IMG.base, p.full.x*k, p.full.y*k, dw, dh2,
        ac2, 3*k, Math.min(1,0.55+g*0.45), 20*k, 12*k);
    }
    ctx.save();
    ctx.shadowColor='rgba(40,40,60,0.18)'; ctx.shadowBlur=18*k; ctx.shadowOffsetY=6*k;
    ctx.drawImage(IMG.base, p.full.x*k, p.full.y*k, dw, dh2);
    ctx.restore();
  }else drawPlaceholder(ctx,k,W,H);
  drawLighting(ctx,k,W,H);
  // ── 좌측 세로 스펙 ──
  if(S.ribbon){
    ctx.save();
    ctx.translate(58*k, H-120*k);
    ctx.rotate(-Math.PI/2);
    ctx.fillStyle=mix(ac,'#000',0.1);
    ctx.font=`500 ${21*k}px "DM Mono","Noto Sans KR",monospace`;
    const parts=S.ribbon.split('\n').join('  ■  ');
    ctx.fillText(parts, 0, 0);
    ctx.restore();
  }
  // ── 바코드 (우하단) ──
  const bx=700*k, by=(TPL.graphic.dh-105)*k;
  ctx.fillStyle='#2a2a32';
  let xoff=0;
  const seedStr=(S.nameEn||'char')+'|'+(S.credit||'');
  for(let i=0;i<46;i++){
    const chc=seedStr.charCodeAt(i%seedStr.length)+i*7;
    const bw=(1+ (chc%3))*1.6*k;
    if(chc%2===0) ctx.fillRect(bx+xoff,by,bw,58*k);
    xoff+=bw+1.8*k;
  }
  ctx.font=`400 ${15*k}px "DM Mono",monospace`;
  ctx.fillStyle='#2a2a32';
  let nums=''; for(let i=0;i<16;i++) nums+= (seedStr.charCodeAt(i%seedStr.length)+i)%10 + ' ';
  ctx.fillText(nums, bx, by+78*k);
  // ── 좌하단 로고 마름모 ──
  ctx.save();
  ctx.translate(70*k,(TPL.graphic.dh-78)*k);
  ctx.rotate(Math.PI/4);
  ctx.fillStyle=withAlpha(ac,0.85);
  rr(ctx,-19*k,-19*k,38*k,38*k,8*k); ctx.fill();
  ctx.restore();
  ctx.fillStyle='#fff';
  ctx.font=`800 ${26*k}px "Baloo 2",sans-serif`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText((S.credit||'m')[0].toUpperCase(), 70*k, (TPL.graphic.dh-78)*k);
  ctx.textAlign='left'; ctx.textBaseline='alphabetic';
}

function render(ctx,k){
  if(S.tpl==='poster') renderPoster(ctx,k);
  else if(S.tpl==='graphic') renderGraphic(ctx,k);
  else renderSheet(ctx,k);
}

/* ─── 미리보기 ─── */
const pv=$('#pv'), pvx=pv.getContext('2d');
let pvK=0.5;
function fitPreview(){
  const st=$('#stage');
  const availW=st.clientWidth-28, availH=st.clientHeight-28;
  pvK = Math.min(availW/DW, availH/DH());
  const dpr=Math.min(window.devicePixelRatio||1,2);
  pv.width=Math.round(DW*pvK*dpr); pv.height=Math.round(DH()*pvK*dpr);
  pv.style.width=Math.round(DW*pvK)+'px'; pv.style.height=Math.round(DH()*pvK)+'px';
  pv._dpr=dpr;
  $('#tbSize').textContent=`출력 ${EXPORT_W}×${Math.round(DH()*EXPORT_W/DW)}px`;
}
let rafPending=false;
function draw(){
  if(rafPending) return;
  rafPending=true;
  requestAnimationFrame(()=>{
    rafPending=false;
    pvx.setTransform(1,0,0,1,0,0);
    pvx.clearRect(0,0,pv.width,pv.height);
    render(pvx, pvK*pv._dpr);
    drawThumbPreviews();
  });
}
function drawThumbPreviews(){
  $$('.thumbCtl').forEach(el=>{
    const i=+el.dataset.i;
    const c=el.querySelector('.tprev'), x=c.getContext('2d');
    x.clearRect(0,0,88,88);
    x.drawImage(thumbContent(i,88),0,0);
  });
}

/* ─── 캔버스 인터랙션 ─── */
function designPos(e){
  const r=pv.getBoundingClientRect();
  return { x:(e.clientX-r.left)/pvK, y:(e.clientY-r.top)/pvK };
}
function hitRegion(pnt){
  const p=pl();
  if(S.tpl==='sheet'){
    const T=L.thumbs;
    for(let i=0;i<3;i++){
      const by=T.y+i*(T.size+T.gap);
      if(pnt.x>=T.x&&pnt.x<=T.x+T.size&&pnt.y>=by&&pnt.y<=by+T.size) return 'face';
    }
    if(IMG.base&&META.base){
      const m=META.base;
      const bx=p.full.x+m.bbox.x*p.full.s, by=p.full.y+m.bbox.y*p.full.s,
            bw=m.bbox.w*p.full.s, bh=m.bbox.h*p.full.s;
      if(pnt.x>=bx&&pnt.x<=bx+bw&&pnt.y>=by&&pnt.y<=by+bh&&pnt.x<620) return 'full';
    }
    if(pnt.x>560&&IMG[cropSource()]) return 'crop';
    if(IMG.base) return 'full';
    return null;
  }
  if(S.tpl==='poster'){
    for(let i=0;i<4;i++){
      const cy=PB.thumbY0+i*PB.thumbGap;
      if(Math.hypot(pnt.x-PB.thumbCx,pnt.y-cy)<=PB.thumbR+8) return 'face';
    }
    return IMG.base? 'full' : null;
  }
  return IMG.base? 'full' : null;
}
let drag=null;
let pendingPick=null;
pv.addEventListener('pointerdown',e=>{
  if(pendingPick){
    // 캔버스 픽셀 스포이드 (폴백)
    const r=pv.getBoundingClientRect();
    const x=Math.round((e.clientX-r.left)*pv._dpr*(pv.width/(r.width*pv._dpr)));
    const y=Math.round((e.clientY-r.top)*pv._dpr*(pv.height/(r.height*pv._dpr)));
    try{
      const d=pvx.getImageData(Math.min(pv.width-1,Math.max(0,x)),Math.min(pv.height-1,Math.max(0,y)),1,1).data;
      pendingPick(rgb2hex(d[0],d[1],d[2]));
    }catch(err){}
    pendingPick=null;
    pv.classList.remove('picking');
    return;
  }
  const pnt=designPos(e);
  const rg=hitRegion(pnt);
  if(!rg) return;
  drag={rg,px:pnt.x,py:pnt.y};
  pv.setPointerCapture(e.pointerId);
  pv.classList.add('dragging');
});
pv.addEventListener('pointermove',e=>{
  const pnt=designPos(e);
  const rg0=hitRegion(pnt);
  $('#tbInfo').textContent = rg0 ? {full:'전신',crop:'확대컷',face:'표정'}[rg0] : '';
  if(!drag) return;
  const dx=pnt.x-drag.px, dy=pnt.y-drag.py;
  drag.px=pnt.x; drag.py=pnt.y;
  const p=pl();
  const o = drag.rg==='full'?p.full : drag.rg==='crop'?p.crop : S.face;
  o.x+=dx; o.y+=dy;
  draw(); saveSoon();
});
pv.addEventListener('pointerup',e=>{ drag=null; pv.classList.remove('dragging'); });
pv.addEventListener('wheel',e=>{
  e.preventDefault();
  const pnt=designPos(e);
  const rg=hitRegion(pnt);
  if(!rg) return;
  const p=pl();
  const o = rg==='full'?p.full : rg==='crop'?p.crop : S.face;
  const f = Math.pow(1.0018, -e.deltaY);
  if(rg==='face'){
    if(S.tpl==='sheet'){
      const T=L.thumbs;
      let ly=(pnt.y-T.y)%(T.size+T.gap);
      const lx=pnt.x-T.x;
      o.x = lx-(lx-o.x)*f; o.y = ly-(ly-o.y)*f;
    }else{
      // 포스터: 프레임 내부 좌표로 환산
      const idx=Math.round((pnt.y-PB.thumbY0)/PB.thumbGap);
      const cy=PB.thumbY0+idx*PB.thumbGap;
      const scale=L.thumbs.size/(PB.thumbR*2);
      const lx=(pnt.x-(PB.thumbCx-PB.thumbR))*scale, ly=(pnt.y-(cy-PB.thumbR))*scale;
      o.x = lx-(lx-o.x)*f; o.y = ly-(ly-o.y)*f;
    }
  }else{
    o.x = pnt.x-(pnt.x-o.x)*f; o.y = pnt.y-(pnt.y-o.y)*f;
  }
  o.s*=f;
  draw(); saveSoon();
},{passive:false});
$$('.thumbCtl .tprev').forEach(c=>{
  let td=null;
  const scale=L.thumbs.size/88;
  c.addEventListener('pointerdown',e=>{ td={x:e.clientX,y:e.clientY}; c.setPointerCapture(e.pointerId); });
  c.addEventListener('pointermove',e=>{
    if(!td) return;
    S.face.x+=(e.clientX-td.x)*scale; S.face.y+=(e.clientY-td.y)*scale;
    td={x:e.clientX,y:e.clientY};
    draw(); saveSoon();
  });
  c.addEventListener('pointerup',()=>td=null);
  c.addEventListener('wheel',e=>{
    e.preventDefault();
    const r=c.getBoundingClientRect();
    const lx=(e.clientX-r.left)*scale, ly=(e.clientY-r.top)*scale;
    const f=Math.pow(1.0018,-e.deltaY);
    S.face.x=lx-(lx-S.face.x)*f; S.face.y=ly-(ly-S.face.y)*f; S.face.s*=f;
    draw(); saveSoon();
  },{passive:false});
});

/* ─── 스포이드 ─── */
async function pickColor(apply){
  if(window.EyeDropper){
    try{
      const r = await new EyeDropper().open();
      apply(r.sRGBHex);
    }catch(e){ /* 취소 */ }
  }else{
    pendingPick=apply;
    pv.classList.add('picking');
    toast('미리보기 캔버스를 클릭해 색을 선택하세요');
  }
}

/* ─── 업로드 ─── */
async function loadImageBlob(blob){
  const url=URL.createObjectURL(blob);
  const img=new Image();
  await new Promise((res,rej)=>{ img.onload=res; img.onerror=rej; img.src=url; });
  return img;
}
async function setSlot(slot, blob){
  const img=await loadImageBlob(blob);
  IMG[slot]=img;
  if(slot==='base'||slot==='vari'){
    META[slot]=analyzeImage(img);
    if(slot==='base'){
      S.pl={sheet:null,poster:null,graphic:null};
      if(S.autoColor){
        const c=extractColors(img);
        if(c){ S.accent=c.accent; S.bg=c.bg; S.stripe=c.stripe; S.palette=c.palette; S.second=c.second; syncColorUI(); }
      }
    }else{
      if(S.cropSrc!=='base') S.pl.sheet=null;
    }
    autoPlaceFace();
  }
  await idb.put('imgs',slot,blob);
  updateDropUI();
  draw(); saveSoon();
}
async function clearSlot(slot){
  IMG[slot]=null; if(META[slot]!==undefined) META[slot]=null;
  await idb.del('imgs',slot);
  if(slot==='vari'||slot==='base'){ S.pl={sheet:null,poster:null,graphic:null}; autoPlaceFace(); }
  updateDropUI(); draw(); saveSoon();
}
function updateDropUI(){
  const cfg=[['#dropBase','base','기본 일러스트'],['#dropVari','vari','바리에이션 (선택)']];
  for(const [sel,slot,label] of cfg){
    const el=$(sel);
    el.classList.toggle('has',!!IMG[slot]);
    const lbl=el.querySelector('.lbl');
    if(IMG[slot]){
      lbl.innerHTML='';
      const im=document.createElement('img'); im.src=IMG[slot].src;
      const sp=document.createElement('span'); sp.textContent=label+' ✓'; sp.style.fontSize='11px';
      lbl.append(im,sp);
      lbl.style.display='flex'; lbl.style.alignItems='center'; lbl.style.gap='8px'; lbl.style.justifyContent='center';
    }else{
      lbl.innerHTML = slot==='base'
        ? '기본 일러스트<br><small>클릭 or 드래그 (투명 PNG)</small>'
        : '바리에이션 (선택)<br><small>시트 템플릿의 확대컷에 사용</small>';
    }
  }
}
function wireDrop(dropSel, fileSel, slot){
  const dz=$(dropSel), fi=$(fileSel);
  dz.addEventListener('click',e=>{ if(e.target.classList.contains('x'))return; fi.click(); });
  dz.querySelector('.x').addEventListener('click',()=>clearSlot(slot));
  fi.addEventListener('change',()=>{ if(fi.files[0]) setSlot(slot,fi.files[0]); fi.value=''; });
  dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('over');});
  dz.addEventListener('dragleave',()=>dz.classList.remove('over'));
  dz.addEventListener('drop',e=>{
    e.preventDefault(); dz.classList.remove('over');
    const f=[...e.dataTransfer.files].find(f=>f.type.startsWith('image/'));
    if(f) setSlot(slot,f);
  });
}
wireDrop('#dropBase','#fileBase','base');
wireDrop('#dropVari','#fileVari','vari');
document.addEventListener('dragover',e=>e.preventDefault());
document.addEventListener('drop',e=>{
  e.preventDefault();
  const f=[...e.dataTransfer.files].find(f=>f.type.startsWith('image/'));
  if(f && !e.target.closest('.drop')) setSlot(IMG.base?'vari':'base',f);
});

/* ─── UI 바인딩 ─── */
$$('#tplRow .tplBtn').forEach(b=>{

    S.tpl=b.dataset.tpl;

}

bindText('#inQuote','quote'); bindText('#inRibbon','ribbon'); bindText('#inDesc','desc');
$('#selFont').addEventListener('change',e=>{ S.font=e.target.value; loadFonts().then(draw); saveSoon(); });

function buildPalGrid(){
  const g=$('#palGrid'); g.innerHTML='';
  for(let i=0;i<8;i++){
    const b=document.createElement('div'); b.className='palSw';
    b.style.background=S.palette[i];
    const inp=document.createElement('input'); inp.type='color'; inp.value=S.palette[i];
    inp.addEventListener('input',()=>{ S.palette[i]=inp.value; b.style.background=inp.value; S.autoColor=false; draw(); saveSoon(); });
    const pd=document.createElement('span'); pd.className='pd'; pd.textContent='💧'; pd.title='스포이드';

      e.stopPropagation(); e.preventDefault();

function syncColorUI(){
  buildPalGrid();
  $('#cAccent').value=S.accent; $('#cBg').value=S.bg; $('#cStripe').value=S.stripe; $('#cGlow').value=S.fx.glowColor;

  $('#cBg').parentElement.style.background=S.bg;
  $('#cStripe').parentElement.style.background=S.stripe;
  $('#cGlow').parentElement.style.background=S.fx.glowColor;
}
for(const [sel,get,set] of [
  ['#cAccent',()=>S.accent,v=>S.accent=v],
  ['#cBg',()=>S.bg,v=>S.bg=v],
  ['#cStripe',()=>S.stripe,v=>S.stripe=v],
  ['#cGlow',()=>S.fx.glowColor,v=>S.fx.glowColor=v],
]){
  $(sel).addEventListener('input',e=>{

  });
}
$$('.dropBtn[data-pick]').forEach(b=>{
  b.addEventListener('click',()=>{
    const key=b.dataset.pick;

});
$('#btnReExtract').addEventListener('click',()=>{
  if(!IMG.base){ toast('기본 일러스트를 먼저 업로드하세요'); return; }
  const c=extractColors(IMG.base);
  if(c){
    S.accent=c.accent; S.bg=c.bg; S.stripe=c.stripe; S.palette=c.palette; S.second=c.second;

});
/* 효과 */
$('#fxBg').addEventListener('change',e=>{ S.fx.bg=e.target.value; draw(); saveSoon(); });
$('#fxGlow').addEventListener('input',e=>{ S.fx.glow=e.target.value/100; draw(); saveSoon(); });
$('#fxLight').addEventListener('change',e=>{ S.fx.light=e.target.value; draw(); saveSoon(); });
$('#fxFrame').addEventListener('change',e=>{ S.fx.frame=e.target.value; draw(); saveSoon(); });
$('#fxSeed').addEventListener('click',()=>{ S.fx.seed=(Math.random()*1e9)|0; draw(); saveSoon(); });

$('#selCropSrc').addEventListener('change',e=>{ S.cropSrc=e.target.value; S.pl.sheet=null; draw(); saveSoon(); });
$('#selFaceSrc').addEventListener('change',e=>{ S.faceSrc=e.target.value; autoPlaceFace(); draw(); saveSoon(); });
$$('.thumbCtl').forEach(el=>{
  const i=+el.dataset.i;
  const sel=el.querySelector('.tFilter');
  sel.innerHTML = FILTERS.map(([v,l])=>`<option value="${v}">${l}</option>`).join('');
  sel.addEventListener('change',e=>{ S.filters[i]=e.target.value; draw(); saveSoon(); });
  el.querySelector('.tUp').addEventListener('click',()=>{
    const fi=$('#fileThumb');
    fi.onchange=()=>{ if(fi.files[0]) setSlot('thumb'+i,fi.files[0]); fi.value=''; };
    fi.click();

$('#btnAutoPlace').addEventListener('click',()=>{ S.pl[S.tpl]=null; autoPlaceFace(); draw(); saveSoon(); toast('자동 배치로 리셋'); });
$('#chkLogo').addEventListener('change',e=>{ S.showLogo=e.target.checked; draw(); saveSoon(); });
$('#chkPanel').addEventListener('change',e=>{ S.showPanel=e.target.checked; draw(); saveSoon(); });

/* ─── 저장/복원 ─── */
let saveTo=null;
function saveSoon(){ clearTimeout(saveTo); saveTo=setTimeout(()=>{
  localStorage.setItem('mm_sheet_v1', JSON.stringify(S));
},400); }
function syncUIFromState(){
  $('#inName').value=S.nameEn; $('#inSub').value=S.sub; $('#inCredit').value=S.credit;
  $('#inQuote').value=S.quote; $('#inRibbon').value=S.ribbon; $('#inDesc').value=S.desc;
  $('#selFont').value=S.font;
  $('#selCropSrc').value=S.cropSrc; $('#selFaceSrc').value=S.faceSrc;
  $$('.thumbCtl').forEach(el=>{ el.querySelector('.tFilter').value=S.filters[+el.dataset.i]||'none'; });
  $('#chkLogo').checked=S.showLogo; $('#chkPanel').checked=S.showPanel;
  $('#fxBg').value=S.fx.bg; $('#fxGlow').value=Math.round(S.fx.glow*100);
  $('#fxLight').value=S.fx.light; $('#fxFrame').value=S.fx.frame;
  $$('#tplRow .tplBtn').forEach(x=>x.classList.toggle('active',x.dataset.tpl===S.tpl));
  syncColorUI();
}
function migrate(raw){
  const s=Object.assign(defaultSettings(), raw);
  s.fx=Object.assign(defaultSettings().fx, raw.fx||{});
  s.pl=Object.assign({sheet:null,poster:null,graphic:null}, raw.pl||{});
  // v1(구버전): full/crop이 최상위에 있으면 sheet 배치로 이관
  if(raw.full && !raw.pl) s.pl.sheet={full:raw.full, crop:raw.crop||{x:0,y:0,s:1}};
  if(!Array.isArray(s.filters)||s.filters.length<4) s.filters=['shadow','none','sparkle','blush'];
  return s;
}
async function restore(){
  try{
    const raw=localStorage.getItem('mm_sheet_v1');
    if(raw) S=migrate(JSON.parse(raw));
  }catch(e){}
  for(const slot of ['base','vari','thumb0','thumb1','thumb2','thumb3']){
    try{
      const blob=await idb.get('imgs',slot);
      if(blob){
        IMG[slot]=await loadImageBlob(blob);
        if(slot==='base'||slot==='vari') META[slot]=analyzeImage(IMG[slot]);
      }
    }catch(e){}
  }
  syncUIFromState(); updateDropUI();
}

/* ─── 프리셋 ─── */
async function refreshPresets(){
  const keys=await idb.keys('presets');
  const list=$('#presetList'); list.innerHTML='';
  for(const k of keys){
    const it=document.createElement('div'); it.className='pItem';
    const b=document.createElement('button'); b.className='pl'; b.textContent=k;
    b.addEventListener('click',()=>loadPreset(k));
    const x=document.createElement('button'); x.className='px'; x.textContent='✕';
    x.addEventListener('click',async()=>{ await idb.del('presets',k); refreshPresets(); toast('삭제됨: '+k); });
    it.append(b,x); list.appendChild(it);
  }
}
$('#btnSavePreset').addEventListener('click',async()=>{
  const name=prompt('프리셋 이름 (캐릭터명 추천)', S.nameEn||'');
  if(!name) return;
  const imgs={};
  for(const slot of ['base','vari','thumb0','thumb1','thumb2','thumb3']){
    const blob=await idb.get('imgs',slot);
    if(blob) imgs[slot]=blob;
  }
  await idb.put('presets',name,{settings:JSON.parse(JSON.stringify(S)),imgs});
  refreshPresets(); toast('저장됨: '+name);
});
async function loadPreset(name){
  const p=await idb.get('presets',name);
  if(!p) return;
  S=migrate(p.settings);
  IMG={base:null,vari:null,thumb0:null,thumb1:null,thumb2:null,thumb3:null};
  META={base:null,vari:null};
  for(const slot of ['base','vari','thumb0','thumb1','thumb2','thumb3']){
    if(p.imgs[slot]){
      await idb.put('imgs',slot,p.imgs[slot]);
      IMG[slot]=await loadImageBlob(p.imgs[slot]);
      if(slot==='base'||slot==='vari') META[slot]=analyzeImage(IMG[slot]);
    }else{
      await idb.del('imgs',slot);
    }
  }
  syncUIFromState(); updateDropUI(); fitPreview(); draw(); saveSoon();
  toast('불러옴: '+name);
}

/* ─── 내보내기 ─── */
$('#btnExport').addEventListener('click',async()=>{
  if(!IMG.base){ toast('기본 일러스트를 먼저 업로드하세요'); return; }
  toast('렌더링 중…');
  await loadFonts();
  const k=EXPORT_W/DW;
  const c=document.createElement('canvas');
  c.width=EXPORT_W; c.height=Math.round(DH()*k);
  render(c.getContext('2d'),k);
  c.toBlob(blob=>{
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=(S.nameEn||'character')+'_'+S.tpl+'.png';
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),5000);
    toast('다운로드 완료!');
  },'image/png');
});
$('#btnReset').addEventListener('click',async()=>{
  if(!confirm('이미지·설정을 모두 초기화할까요? (프리셋은 유지)')) return;
  S=defaultSettings();
  for(const slot of ['base','vari','thumb0','thumb1','thumb2','thumb3']) await idb.del('imgs',slot);
  IMG={base:null,vari:null,thumb0:null,thumb1:null,thumb2:null,thumb3:null};
  META={base:null,vari:null};
  localStorage.removeItem('mm_sheet_v1');
  syncUIFromState(); updateDropUI(); fitPreview(); draw();
});

/* ─── 시작 ─── */
window.addEventListener('resize',()=>{ fitPreview(); draw(); });

  try{
    await Promise.all([
      document.fonts.load('800 80px "Baloo 2"'),

}
(async function init(){
  await idb.open();
  await restore();
  await refreshPresets();
  fitPreview();
  await loadFonts();
  draw();
})();
// 테스트/디버그용 훅
window.SM = { setSlot, get S(){return S;}, get IMG(){return IMG;}, draw, render, fitPreview, extractColors };
</script>
