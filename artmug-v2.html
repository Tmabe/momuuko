<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>모무꼬 · 커미션 안내 · Momukko Live2D</title>
<meta name="description" content="Live2D 일러스트레이터 모무꼬 · 커미션 및 작업 안내">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════════
   모무꼬 커미션 페이지 v2 — "스테이지"
   화면 전체를 무대로 쓰는 게임 공식 사이트 문법 + 기존 기능 전부.

   임베드(아트머그 iframe, 자동높이)에서 깨지는 것들 — 이미 겪은 함정:
   · vh/svh 는 화면이 아니라 문서 전체 높이가 된다 → px 상한 clamp 필수
   · position:fixed 는 화면이 아니라 iframe 기준이 된다 → body.solo 일 때만
   · 그래서 섹션 배경은 fixed 가 아니라 각 섹션 안의 absolute 로 깐다
   ══════════════════════════════════════════════════════════════ */
:root{
  --night:#141229; --night2:#2A2450;
  --halo:#FFA3CE;    /* 1차 — 연한 핑크. 누르는 것·브랜드 */
  --halo2:#8FD9F5;   /* 2차 — 하늘색. 읽는 것·상태·숫자. 어두운 바탕 위 11.8:1 */
  --sky:#DB3C8E;     /* 밝은 바탕 장식(핑크) */
  --sky-d:#B3246B;   /* 밝은 바탕 글자(핑크) 5.8:1 — 연한 핑크는 흰 위에서 못 읽는다 */
  --sky-b:#1B6FA8;   /* 밝은 바탕 글자(하늘) 5.0:1 */
  --paper:#F8F7FC; --white:#fff;
  --ink:#1F1D33; --ink2:#5E5A77; --ink3:#9C98B5;
  --line:rgba(31,29,51,.11); --line2:rgba(31,29,51,.07);
  --onNight:rgba(255,255,255,.72); --onNight2:rgba(255,255,255,.45);
  --nline:rgba(255,255,255,.14);

  --r:10px; --r-sm:6px; --r-xs:3px; --r-pill:999px;
  --sh:none;
  --sh-md:0 1px 2px rgba(20,18,41,.06);
  --sh-lg:0 12px 34px rgba(20,18,41,.16);

  --disp:'Archivo',sans-serif;
  --cond:'Barlow Condensed','Noto Sans KR',sans-serif;
  --tilt:-8deg;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:'Noto Sans KR',sans-serif;color:var(--ink);background:var(--paper);
  line-height:1.65;min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}

/* ── 무대 ──
   .wrap 은 더 이상 폭을 잡지 않는다. 섹션이 화면 끝까지 펼쳐지고,
   안쪽 요소만 980px 로 모인다(마크업을 건드리지 않으려고 :not(.bg) 로 고른다). */
.wrap{max-width:none;margin:0;padding:0;position:relative;z-index:1;counter-reset:sec}
.section{position:relative;overflow:hidden;margin:0;padding:48px 0;counter-increment:sec}
.section > *:not(.bg){position:relative;z-index:2;max-width:980px;margin-left:auto;margin-right:auto;
  padding-left:22px;padding-right:22px}
.section.night{background:var(--night);color:#fff}
.section.day{background:var(--paper)}
.section.day + .section.day{padding-top:8px}

/* 섹션마다 다른 작품이 배경으로 깔린다. 화면에 들어오면 1.1초에 걸쳐 떠오른다. */
.bg{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.bg img{position:absolute;left:0;top:-10%;width:100%;height:120%;object-fit:cover;object-position:50% 14%;
  opacity:0;transition:opacity 1.1s ease}
.night .bg img.on{opacity:.26}
.night .bg::after{content:'';position:absolute;inset:0;
  background:linear-gradient(100deg,var(--night) 20%,rgba(20,18,41,.84) 54%,rgba(20,18,41,.62) 100%)}
.day .bg img.on{opacity:.13}
.day .bg::after{content:'';position:absolute;inset:0;
  background:linear-gradient(95deg,var(--paper) 44%,rgba(248,247,252,.76) 74%,rgba(248,247,252,.54) 100%)}

/* ── 등장 ──
   섹션이 보이기 시작하면 안쪽 요소가 차례로 떠오른다. */
.rv{opacity:0;transform:translateY(18px);
  transition:opacity .6s cubic-bezier(.16,1,.3,1),transform .6s cubic-bezier(.16,1,.3,1)}
.rv.in{opacity:1;transform:none}
.rv:nth-child(2){transition-delay:.07s}
.rv:nth-child(3){transition-delay:.13s}
.rv:nth-child(4){transition-delay:.19s}

/* ── 섹션 제목 ── */
.sec-head{display:flex;align-items:baseline;gap:11px;margin-bottom:13px;padding-bottom:8px;
  border-bottom:2px solid var(--ink)}
.night .sec-head{border-bottom-color:var(--nline)}
.sec-head::before{content:counter(sec,decimal-leading-zero);font-family:var(--disp);font-size:13px;
  font-weight:900;letter-spacing:.06em;color:var(--sky-b);flex-shrink:0;line-height:1}
.night .sec-head::before{color:var(--halo2)}
.sec-titles{display:flex;flex-direction:column;gap:1px}
.sec-jp{display:none}
.sec-title{font-size:19px;font-weight:900;letter-spacing:-.02em;line-height:1.2}
.sec-line{flex:1;height:0}
.sec-badge{display:none}

/* ── 고정 크롬 — 단독 열람에서만 ── */
.lang-toggle{position:absolute;top:14px;right:14px;z-index:200;display:flex;overflow:hidden;
  background:rgba(255,255,255,.12);border:1px solid var(--nline);border-radius:var(--r-sm)}
body.solo .lang-toggle{position:fixed}
.lang-toggle button{border:none;background:transparent;color:rgba(255,255,255,.7);font-family:var(--cond);
  font-size:13.5px;font-weight:600;padding:7px 14px;cursor:pointer;transition:.18s;letter-spacing:.08em;
  text-transform:uppercase}
.lang-toggle button.on{background:var(--halo);color:var(--night)}
.prog{display:none}
body.solo .prog{display:block;position:fixed;top:0;left:0;height:3px;width:0;background:var(--halo2);
  z-index:210;transition:width .1s linear}

/* ── 히어로 (접수 슬롯을 안으로 합쳤다) ── */
.hero{position:relative;overflow:hidden;background:var(--night);color:#fff;
  display:flex;align-items:center;
  /* vh 를 쓰면 임베드에서 문서 전체 높이가 되므로 px 상한을 반드시 건다 */
  min-height:clamp(430px,78vh,680px)}
.hero > *:not(.bg):not(.motes){position:relative;z-index:2;width:100%;max-width:980px;
  margin:0 auto;padding:78px 22px 44px}
.hero .bg img{object-position:72% 12%}
.hero .bg img.on{opacity:.26}
.hero .bg::after{content:'';position:absolute;inset:0;
  background:linear-gradient(100deg,var(--night) 20%,rgba(20,18,41,.84) 54%,rgba(20,18,41,.6) 100%)}
.motes{position:absolute;inset:0;z-index:1;pointer-events:none}
.motes i{position:absolute;width:4px;height:4px;border-radius:50%;background:var(--halo);opacity:.4;
  animation:rise linear infinite}
@keyframes rise{from{transform:translateY(0);opacity:0}14%{opacity:.5}to{transform:translateY(-62vh);opacity:0}}
.hero-card{background:none;border:none;border-radius:0;padding:0;box-shadow:none;position:static}
.hero-card::before,.hero-card::after{display:none}
.hero-badge{display:inline-flex;align-items:center;gap:8px;background:var(--halo);color:var(--night);
  font-family:var(--cond);text-transform:uppercase;letter-spacing:.15em;font-size:13.5px;font-weight:700;
  padding:7px 16px;border:none;border-radius:0;margin-bottom:18px;transform:skewX(var(--tilt))}
.wordmark{font-family:var(--disp);font-weight:900;font-size:clamp(44px,9.6vw,108px);line-height:.86;
  letter-spacing:-.045em;text-transform:uppercase;color:#fff}
.wordmark span{display:inline-block;opacity:0;transform:translateY(28px);
  animation:wm .75s cubic-bezier(.16,1,.3,1) forwards}
.wordmark .wm-b{color:var(--halo)}
@keyframes wm{to{opacity:1;transform:none}}
.hero-role{font-family:var(--cond);text-transform:uppercase;letter-spacing:.18em;
  font-size:clamp(12.5px,1.8vw,16px);font-weight:600;color:rgba(255,255,255,.9);margin-top:13px;
  border-left:3px solid var(--halo);padding-left:12px}
.hero-jp{display:none}
.hero-sub{font-size:14px;color:var(--onNight);margin-top:16px;line-height:1.8;max-width:46ch;
  border:none;padding:0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:18px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 13px;background:rgba(255,255,255,.07);
  border:1px solid var(--nline);border-radius:var(--r-pill);font-size:12.5px;font-weight:500;
  color:var(--onNight)}
.chip b{color:#fff;font-weight:800}
.chip.pk b{color:var(--halo2)}
.chip .dotlive{width:6px;height:6px;border-radius:50%;background:var(--halo2);flex-shrink:0}
.hero-cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}

/* ── 버튼 ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:none;border-radius:0;
  font-family:var(--cond);text-transform:uppercase;letter-spacing:.13em;font-size:16px;font-weight:700;
  padding:14px 30px;cursor:pointer;text-decoration:none;transform:skewX(var(--tilt));
  transition:transform .2s,box-shadow .24s,background .24s,color .24s}
.btn > *{display:inline-block;transform:skewX(calc(var(--tilt) * -1))}
.btn-main{background:var(--halo);color:var(--night);box-shadow:0 8px 22px rgba(255,163,206,.26)}
.btn-main:hover{transform:skewX(var(--tilt)) translateY(-3px);box-shadow:0 13px 30px rgba(255,163,206,.4)}
.btn-ghost{background:transparent;color:#fff;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.42)}
.btn-ghost:hover{background:rgba(255,255,255,.11)}

/* ── 접수 슬롯 — 히어로 안 한 줄 ── */
#slotCard{background:none;border:none;border-radius:0;box-shadow:none;padding:0;
  display:flex;gap:8px;flex-wrap:wrap;margin-top:24px;padding-top:20px;border-top:1px solid var(--nline)}
.slot-row{display:flex;align-items:center;gap:10px;padding:9px 15px;border:none;
  background:rgba(255,255,255,.07);transform:skewX(var(--tilt));transition:background .25s}
.slot-row > *{transform:skewX(calc(var(--tilt) * -1))}
.slot-row:hover{background:rgba(255,255,255,.13)}
.slot-month{font-family:var(--disp);font-size:18px;font-weight:900;letter-spacing:-.03em;width:auto;
  flex-shrink:0;color:#fff}
.slot-dots{display:flex;gap:3px;flex:0 0 auto}
.dot{width:13px;height:4px;border-radius:0;border:none;background:rgba(255,255,255,.28);
  font-size:0;color:transparent;background-image:none}
.dot.filled{background:rgba(255,255,255,.28)}
.dot.open{background:var(--halo2)}
.slot-tag{font-family:var(--cond);text-transform:uppercase;letter-spacing:.12em;font-size:13px;
  font-weight:600;padding:0;border:none;background:none;flex-shrink:0}
.slot-tag.open{color:var(--halo2)}
.slot-tag.full{color:var(--onNight2)}

/* ── 카드 ── */
.card{background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:22px 24px;
  box-shadow:var(--sh)}
.night .card{background:rgba(255,255,255,.05);border-color:var(--nline);color:#fff}

/* ── 포트폴리오 ──
   레일 4.5개 보이기: 임베드에서 vh 가 문서 전체 높이가 되므로 px 상한 clamp 가 반드시 필요하다. */
:root{
  --stageH:clamp(320px,56vh,560px);
  --thumbGap:8px;
  --thumbH:clamp(110px, calc((var(--stageH) - 4*var(--thumbGap)) / 4.5), 180px);
  --railW:calc(var(--thumbH) * 0.75);
}
.port-wrap{display:none}
.port-stack{display:flex;gap:12px;align-items:flex-start}
.port-rail{flex:0 0 calc(var(--railW) + 8px);display:flex;flex-direction:column;gap:var(--thumbGap);
  max-height:var(--stageH);overflow-y:auto;overscroll-behavior:contain;padding:0 6px 0 2px;scrollbar-width:thin}
.port-th{position:relative;width:100%;height:var(--thumbH);padding:0;flex-shrink:0;cursor:pointer;
  border:none;border-radius:0;overflow:hidden;background:rgba(255,255,255,.06);box-shadow:none;
  transform:skewX(var(--tilt));transition:transform .3s,box-shadow .3s}
.port-th img{width:114%;margin-left:-7%;height:100%;object-fit:cover;object-position:50% 16%;
  transform:skewX(calc(var(--tilt) * -1))}
.port-th:hover{transform:skewX(var(--tilt)) translateY(-3px)}
.port-th.on{box-shadow:inset 0 0 0 2px var(--halo)}
.port-stage{position:relative;flex:1;min-width:0;height:var(--stageH);display:flex;align-items:center;
  justify-content:center;overflow:hidden;background:rgba(255,255,255,.05);border:1px solid var(--nline);
  border-radius:var(--r);box-shadow:none}
.port-stage img{max-width:100%;max-height:100%;object-fit:contain;animation:fade .22s}
.port-nav{position:absolute;top:50%;transform:translateY(-50%);width:36px;height:52px;border:none;
  background:rgba(20,18,41,.72);border-radius:0;font-family:inherit;font-size:20px;font-weight:700;
  line-height:1;color:#fff;cursor:pointer;transition:.18s}
.port-nav:hover{background:var(--halo);color:var(--night)}
.port-nav.prev{left:10px} .port-nav.next{right:10px}
.port-cap{position:absolute;left:12px;bottom:12px;display:flex;align-items:center;gap:9px;
  background:rgba(20,18,41,.86);border:none;border-radius:0;padding:6px 12px;
  font-family:var(--cond);text-transform:uppercase;letter-spacing:.1em;font-size:13px;font-weight:600;
  color:#fff;max-width:calc(100% - 130px)}
.port-cap .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.port-cap .ix{color:var(--halo2);font-variant-numeric:tabular-nums;flex-shrink:0}
.port-full{position:absolute;right:12px;bottom:12px;background:rgba(20,18,41,.86);border:none;
  border-radius:0;padding:6px 12px;font-family:var(--cond);text-transform:uppercase;letter-spacing:.1em;
  font-size:12.5px;font-weight:600;color:#fff;text-decoration:none;cursor:pointer;transition:.18s}
.port-full:hover{background:var(--halo);color:var(--night)}
.port-loading,.port-empty{text-align:center;padding:34px;color:var(--onNight2);font-size:13px;font-weight:600}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* ── 작업 순서 ── */
.wo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--nline);
  border:1px solid var(--nline);border-radius:0;overflow:hidden;counter-reset:wo}
.wo-cell{background:rgba(255,255,255,.04);color:#fff;padding:16px 13px 14px;text-align:left;
  position:relative;counter-increment:wo}
.wo-cell.last{background:var(--halo2)}
.wo-cell::before{content:counter(wo,decimal-leading-zero);position:absolute;right:9px;bottom:0;
  font-family:var(--disp);font-size:42px;font-weight:900;line-height:.8;color:rgba(255,255,255,.07);
  pointer-events:none}
.wo-cell.last::before{color:rgba(20,18,41,.16)}
.wo-num{position:relative;z-index:1;font-family:var(--cond);font-size:12px;font-weight:600;
  letter-spacing:.18em;color:var(--halo2);margin-bottom:6px;text-transform:uppercase}
.wo-cell.last .wo-num{color:rgba(20,18,41,.66)}
.wo-name{position:relative;z-index:1;font-size:14.5px;font-weight:800;color:#fff;line-height:1.3}
.wo-cell.last .wo-name{color:var(--night)}
.wo-sub{position:relative;z-index:1;font-size:11px;color:var(--onNight2);margin-top:3px}
.wo-cell.last .wo-sub{color:rgba(20,18,41,.62)}

/* ── 가격 계산기 ── */
.fgroup{margin-bottom:24px}
.fgroup:last-child{margin-bottom:0}
.fgroup-head{display:flex;align-items:center;gap:8px;margin-bottom:11px;flex-wrap:wrap;
  padding-bottom:7px;border-bottom:2px solid var(--ink)}
.fgroup-title{font-size:15px;font-weight:900;letter-spacing:-.01em;color:var(--ink)}
.fgroup-tag{font-family:var(--cond);text-transform:uppercase;letter-spacing:.1em;font-size:12px;
  font-weight:700;padding:2px 9px;border-radius:0}
.fgroup-tag.req{background:var(--sky-d);color:#fff}
.fgroup-tag.free{background:var(--sky-d);color:#fff}
.fgroup-note{font-size:12.5px;white-space:pre-line;color:var(--ink2);background:rgba(219,60,142,.09);
  border:none;border-left:3px solid var(--sky);border-radius:0;padding:10px 13px;margin-bottom:11px;
  line-height:1.65;font-weight:500}
.fgroup-hint{font-size:12px;white-space:pre-line;line-height:1.7;color:var(--sky-d);margin-top:10px;font-weight:700}
.fgroup.merged{padding-left:15px;border-left:2px solid rgba(219,60,142,.3)}
.fgroup:has(+ .fgroup.merged){margin-bottom:16px}
.fgroup.merged .fgroup-head{margin-bottom:10px;border-bottom-width:1px;border-bottom-color:var(--line)}
.fgroup.merged .fgroup-title{font-size:13.5px;font-weight:800;color:var(--sky-d)}

.opt-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:8px}
.opt-card{position:relative;background:var(--white);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:14px 15px;cursor:pointer;transition:.18s;user-select:none}
.opt-card:hover{border-color:var(--sky)}
.opt-card.sel{border-color:var(--sky-d);background:rgba(219,60,142,.08);box-shadow:inset 3px 0 0 var(--sky-d)}
.opt-card.sel::after{content:'✓';position:absolute;top:9px;right:10px;width:18px;height:18px;
  border-radius:50%;background:var(--sky-d);color:#fff;font-size:11px;font-weight:900;
  display:flex;align-items:center;justify-content:center}
.opt-card .n{font-size:13px;font-weight:600;line-height:1.5;color:var(--ink);padding-right:20px}
.opt-card .p{font-family:var(--disp);font-size:17px;font-weight:900;letter-spacing:-.02em;
  color:var(--ink);margin-top:8px;font-variant-numeric:tabular-nums}
.opt-card .sub{display:inline-block;font-size:11px;font-weight:800;color:var(--sky-d);
  background:rgba(219,60,142,.12);border:none;border-radius:0;padding:2px 8px;margin-top:7px}

.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:9px 15px;border-radius:var(--r-pill);
  border:1px solid var(--line);background:var(--white);font-size:12.5px;font-weight:600;color:var(--ink2);
  cursor:pointer;transition:.16s;user-select:none}
.pill:hover{border-color:var(--sky);color:var(--ink)}
.pill.sel{background:var(--sky-d);border-color:var(--sky-d);color:#fff}
.pill .pp{font-weight:800;color:var(--sky-d)}
.pill.sel .pp{color:var(--halo)}

.qty-list{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--line2)}
.qty-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 2px;
  border:none;border-bottom:1px solid var(--line2);border-radius:0;background:none;transition:.16s}
.qty-item.on{background:rgba(219,60,142,.08);box-shadow:none;padding-left:10px;padding-right:10px}
.qty-i-n{font-size:13.5px;font-weight:600;color:var(--ink)}
.qty-i-p{font-size:12px;font-weight:800;color:var(--ink2);margin-top:2px;font-variant-numeric:tabular-nums}
.qty-item.on .qty-i-p{color:var(--sky-d)}
.qty-ctrl{display:flex;align-items:center;border:1px solid var(--line);border-radius:var(--r-sm);
  overflow:hidden;flex-shrink:0;background:var(--white)}
.qc-btn{width:32px;height:32px;border:none;background:var(--paper);font-size:16px;font-weight:700;
  cursor:pointer;color:var(--ink);display:flex;align-items:center;justify-content:center;
  -webkit-tap-highlight-color:transparent;transition:.16s}
.qc-btn:hover{background:var(--sky-d);color:#fff}
.qc-btn.minus{color:var(--ink3)}
.qc-btn.minus:hover{background:var(--ink);color:#fff}
.qc-num{width:36px;text-align:center;font-size:14px;font-weight:800;color:var(--ink);
  border-left:1px solid var(--line);border-right:1px solid var(--line);height:32px;display:flex;
  align-items:center;justify-content:center;user-select:none;font-variant-numeric:tabular-nums}
.qc-sel{flex-shrink:0;padding:8px 11px;border:1px solid var(--line);border-radius:var(--r-sm);
  font-family:inherit;font-size:13px;font-weight:700;color:var(--ink);background:var(--white);cursor:pointer}

/* ── 신청서 ── */
.subcard{background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;
  margin-top:14px}
.form-2col>div>.subcard:first-child{margin-top:0}
.subcard-lbl{font-size:14px;font-weight:900;color:var(--ink);margin-bottom:13px;display:flex;
  align-items:center;gap:6px;padding-bottom:9px;border-bottom:2px solid var(--ink)}
.ta,.inp{width:100%;border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 13px;
  font-family:inherit;font-size:13px;color:var(--ink);background:var(--paper);outline:none;
  transition:border-color .16s,box-shadow .16s,background .16s;line-height:1.7}
.ta{min-height:74px;resize:vertical}
.ta:focus,.inp:focus{border-color:var(--sky-d);background:var(--white);box-shadow:0 0 0 2px rgba(219,60,142,.25)}
.aq-fill{margin-bottom:11px}
.aq-fill:last-child{margin-bottom:0}
.aq-fill-lbl{font-size:12px;font-weight:700;color:var(--ink);margin-bottom:6px;display:flex;
  align-items:flex-start;gap:7px;line-height:1.55}
.aq-fill-num{flex-shrink:0;width:18px;height:18px;border-radius:0;background:var(--sky-d);color:#fff;
  font-family:var(--cond);font-size:12.5px;font-weight:700;display:flex;align-items:center;
  justify-content:center;margin-top:1px}
.field-hint{font-size:11px;color:var(--ink3);margin-top:6px;font-weight:500}

/* ── 미리보기 / 합계 ── */
.preview-card{background:var(--white);border:1px solid var(--night);border-radius:var(--r);
  overflow:hidden;box-shadow:var(--sh-lg);position:sticky;top:16px}
.preview-head{background:var(--night);border-bottom:none;padding:14px 16px;display:flex;
  align-items:center;justify-content:space-between}
.preview-head-t{font-family:var(--cond);text-transform:uppercase;letter-spacing:.14em;font-size:14px;
  font-weight:600;color:#fff}
.preview-body{padding:15px 17px;font-family:'Noto Sans KR',monospace;font-size:11.5px;line-height:1.85;
  white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink);max-height:46vh;overflow-y:auto;
  background:var(--paper)}
.preview-total{padding:16px 18px;border-top:1px solid var(--line);background:var(--white);text-align:center}
.preview-total-lbl{font-family:var(--cond);font-size:12.5px;font-weight:600;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink3);margin-bottom:6px}
.preview-total-amt{font-family:var(--disp);font-weight:900;font-size:38px;color:var(--ink);line-height:1;
  font-variant-numeric:tabular-nums;letter-spacing:-.035em}
.preview-total-won{font-size:14px;font-weight:800;color:var(--ink2)}
.preview-total-cnt{font-size:11px;color:var(--ink3);font-weight:600}
.preview-copy{width:100%;padding:16px;border:none;background:var(--sky-d);color:#fff;font-family:var(--cond);
  text-transform:uppercase;letter-spacing:.12em;font-size:16px;font-weight:700;cursor:pointer;
  transition:background .18s}
.preview-copy:hover{background:var(--night)}
.preview-reset{display:block;width:100%;padding:9px;border:none;border-top:1px solid var(--line);
  background:var(--white);color:var(--ink3);font-family:inherit;font-size:11px;font-weight:600;
  cursor:pointer;transition:color .16s}
.preview-reset:hover{color:var(--ink)}
.form-2col{display:grid;grid-template-columns:1fr 360px;gap:18px;align-items:start;margin-top:18px}
@media(max-width:860px){
  .form-2col{display:flex;flex-direction:column;grid-template-columns:none;align-items:stretch}
  .preview-card{position:static;order:-1}
}

/* ── 약관 ── */
.notice-list{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--line)}
.nt{background:transparent;border:none;border-bottom:1px solid var(--line);border-radius:0;
  overflow:hidden;transition:background .16s,box-shadow .16s}
.nt.open{background:var(--white);box-shadow:inset 3px 0 0 var(--sky-d)}
.nt-q{display:flex;align-items:center;gap:11px;padding:15px 14px;cursor:pointer;font-size:13.5px;
  font-weight:800;color:var(--ink);user-select:none}
.nt-ico{display:none}
.nt-arr{margin-left:auto;color:var(--ink3);font-size:10px;transition:transform .2s,color .2s;flex-shrink:0}
.nt.open .nt-arr{transform:rotate(180deg);color:var(--sky-d)}
.nt-a{max-height:0;overflow:hidden;transition:max-height .25s ease;font-size:13px;line-height:1.9;
  color:var(--ink2);font-weight:400}
.nt-a-inner{padding:0 16px 17px 14px;white-space:pre-line}

.foot{text-align:center;padding:34px 22px 46px;background:var(--night);color:var(--onNight2);
  font-family:var(--cond);letter-spacing:.14em;text-transform:uppercase;font-size:12px;
  max-width:none!important;margin:0!important}

/* ── 토스트 / 떠있는 합계 ── */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);z-index:9000;
  background:var(--night);color:#fff;border-left:3px solid var(--halo);padding:12px 22px;
  border-radius:var(--r-sm);font-size:13px;font-weight:700;opacity:0;pointer-events:none;
  transition:all .3s;box-shadow:var(--sh-lg)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#sideMini{display:none}
body.solo #sideMini.show{display:block;position:fixed;top:84px;right:14px;z-index:500;width:158px;
  background:var(--night);border:1px solid var(--nline);border-radius:var(--r-sm);
  box-shadow:var(--sh-lg);padding:14px;color:#fff}
.sm-tl{font-family:var(--cond);font-size:11.5px;font-weight:600;color:var(--onNight2);letter-spacing:.14em;
  text-transform:uppercase}
.sm-amt{font-family:var(--disp);font-weight:900;font-size:20px;color:var(--halo2);margin:3px 0 10px;
  font-variant-numeric:tabular-nums;line-height:1.15;letter-spacing:-.03em}
.sm-nav{display:flex;flex-direction:column;gap:1px;border-top:1px solid var(--nline);padding-top:8px}
.sm-link{font-size:11.5px;font-weight:600;color:var(--onNight);padding:5px 7px;cursor:pointer;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:.14s}
.sm-link:hover{background:rgba(255,163,206,.14);color:var(--halo)}
@media(max-width:1340px){#sideMini{display:none!important}}

/* ── 모바일 하단 합계 바 ── */
.mbar{display:none}
@media(max-width:760px){
  body.solo .mbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:300;align-items:center;
    gap:12px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:var(--night);
    border-top:1px solid var(--nline)}
  body.solo{padding-bottom:64px}
  .mbar-l{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1}
  .mbar-k{font-family:var(--cond);font-size:11px;font-weight:600;letter-spacing:.14em;
    text-transform:uppercase;color:var(--onNight2)}
  .mbar-v{font-family:var(--disp);font-weight:900;font-size:19px;color:var(--halo2);line-height:1.15;
    font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mbar-b{flex-shrink:0;padding:11px 18px;border:none;background:var(--halo);color:var(--night);
    font-family:var(--cond);text-transform:uppercase;letter-spacing:.1em;font-size:15px;font-weight:700;
    cursor:pointer}
  .mbar-b:disabled{background:var(--nline);color:var(--onNight2);cursor:default}
}

/* ── 반응형 ── */
@media(max-width:760px){
  :root{--tilt:-5deg; --stageH:clamp(250px,46vh,400px);
    --thumbH:clamp(84px, calc((var(--stageH) - 4*var(--thumbGap)) / 4.5), 140px)}
  .section{padding:26px 0}
  .section > *:not(.bg){padding-left:0;padding-right:0}
  .sec-head{margin-left:15px;margin-right:15px}
  .notice-list{margin:0 15px}
  .card{border-left:none;border-right:none;border-radius:0;padding:16px 15px}
  .subcard{border-left:none;border-right:none;border-radius:0;padding:15px 15px;margin-top:10px}
  .preview-card{border-left:none;border-right:none;border-radius:0}
  .hero{min-height:clamp(400px,72vh,560px)}
  .hero > *:not(.bg):not(.motes){padding:56px 17px 24px}
  #slotCard{margin-top:16px;padding-top:13px}
  .opt-cards{grid-template-columns:1fr;gap:0;border-top:1px solid var(--line2)}
  .opt-card{display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px;border:none;
    border-bottom:1px solid var(--line2);border-radius:0;padding:10px 15px}
  .opt-card:hover{border-color:var(--line2)}
  .opt-card.sel{box-shadow:none}
  .opt-card.sel::after{position:static;order:3;top:auto;right:auto;width:17px;height:17px;flex-shrink:0}
  .opt-card .n{flex:1 1 0;min-width:0;padding-right:0;font-size:13.5px}
  .opt-card .p{order:2;margin-top:0;flex-shrink:0;font-size:16px}
  .opt-card .sub{order:4;flex-basis:100%;margin-top:0}
  .qty-item{padding:9px 15px}
  .qty-list{margin:0}
  .pills{padding:0 15px}
  .fgroup{margin-bottom:18px}
  .fgroup-head,.fgroup-note,.fgroup-hint{margin-left:15px;margin-right:15px}
  .fgroup.merged{margin-left:15px;padding-left:12px}
  .fgroup.merged .fgroup-head{margin-left:0;margin-right:0}
  .port-stack{flex-direction:column-reverse;gap:8px}
  /* 세로 배치에서는 flex-basis:0% 가 height 를 눌러 --stageH 상한이 무시된다
     (임베드에서 400px 상한인데 594px 로 늘어났다) → flex 를 끄고 height 가 이기게 한다 */
  .port-stage{flex:none;width:100%;height:var(--stageH)}
  .port-rail{flex:none;width:100%;flex-direction:row;max-height:none;overflow-x:auto;overflow-y:hidden;
    padding:0 0 4px}
  .port-th{width:var(--railW);height:var(--thumbH);flex-shrink:0}
  .port-nav{width:32px;height:46px;font-size:18px}
  .port-nav.prev{left:6px} .port-nav.next{right:6px}
  .port-cap{left:8px;bottom:8px;font-size:12px;padding:5px 10px;max-width:calc(100% - 100px)}
  .port-full{right:8px;bottom:8px;font-size:11.5px;padding:5px 10px}
  .wo-grid{grid-template-columns:1fr 1fr}
  .wo-cell::before{font-size:36px;right:7px}
}
@media(max-width:430px){.hero-role{letter-spacing:.1em}}

@media (prefers-reduced-motion:reduce){
  .rv{opacity:1!important;transform:none!important;transition:none}
  *{animation:none!important}
  html{scroll-behavior:auto}
  .bg img{transition:none}
}

var imgs=[],lbIdx=0;
function loadPortfolio(){
  fetch('https://api.github.com/repos/'+GH.user+'/'+GH.repo+'/contents/'+GH.folder)
    .then(function(r){if(!r.ok)throw new Error(r.status);return r.json();})
    .then(function(data){
      imgs=[];
      /* 경량화 이미지(make-thumbs.py 생성)를 먼저 쓰고, 없으면 원본으로 폴백한다.
         thumb=가로400(세로 레일) / view=가로1400(스테이지) / src=원본 */
      var BASE='https://'+GH.user+'.github.io/'+GH.repo+'/'+GH.folder+'/';
      (data||[]).forEach(function(f){if(f.type==='file'&&/\.(png|jpe?g|gif|webp)$/i.test(f.name)){
        var stem=f.name.replace(/\.[^.]+$/,'');
        imgs.push({src:BASE+encodeURIComponent(f.name),
                   view:BASE+'view/'+encodeURIComponent(stem)+'.webp',
                   thumb:BASE+'thumb/'+encodeURIComponent(stem)+'.webp',
                   cap:stem});
      }});
      if(DATA.portfolioOrder&&DATA.portfolioOrder.length){
        imgs.sort(function(a,b){var ia=DATA.portfolioOrder.indexOf(a.cap+'.png');
          // match by filename stem against order entries (strip extension in order list too)
          function idx(im){for(var k=0;k<DATA.portfolioOrder.length;k++){if(DATA.portfolioOrder[k].replace(/\.[^.]+$/,'')===im.cap)return k;}return 999;}
          return idx(a)-idx(b);});
      }
      document.getElementById('portLoading').style.display='none';
      if(!imgs.length){var e=document.getElementById('portEmpty');e.style.display='block';e.textContent=UI[lang].portEmpty;return;}
      var rail=document.getElementById('portRail'), rh='';
      imgs.forEach(function(im,i){
        rh+='<button class="port-th" type="button" onclick="pcShow('+i+')" aria-label="'+im.cap+'">'+
            '<img loading="lazy" src="'+im.thumb+'" alt="'+im.cap+'"></button>';
      });
      rail.innerHTML=rh;
      rail.querySelectorAll('.port-th img').forEach(function(el,i){ pvFallback(el,[imgs[i].src]); });
      document.getElementById('portWrap').style.display='block';
      pcShow(0);
    })
    .catch(function(){document.getElementById('portLoading').style.display='none';var e=document.getElementById('portEmpty');e.style.display='block';e.textContent=UI[lang].portErr;});
}
/* ── 뷰어: 세로 얼굴 레일 + 고정 스테이지 ──
   열고 닫는 개념이 없어 페이지가 절대 움직이지 않는다.
   position:fixed 를 전혀 쓰지 않으므로 아트머그 자동높이 iframe 임베드에서도 그대로 동작한다. */
/* 경량화 이미지가 아직 없으면 다음 후보(→원본)로 자동 교체 */
function pvFallback(el,alts){
  var q=alts.slice();
  el.onerror=function(){ var n=q.shift(); if(n){el.src=n;} else {el.onerror=null;} };
}
function pcShow(i){
  if(!imgs.length)return;
  lbIdx=(i+imgs.length)%imgs.length; var im=imgs[lbIdx];
  var el=document.getElementById('portImg');
  pvFallback(el,[im.src]); el.src=im.view; el.alt=im.cap;
  document.getElementById('portNm').textContent=im.cap;
  document.getElementById('portIx').textContent=(lbIdx+1)+' / '+imgs.length;
  document.getElementById('portFull').href=im.src;
  var rail=document.getElementById('portRail');
  var ths=rail.querySelectorAll('.port-th');
  for(var k=0;k<ths.length;k++)ths[k].classList.toggle('on',k===lbIdx);
  /* 선택된 얼굴을 레일 안에서만 스크롤해 보여준다(페이지는 건드리지 않음) */
  var t=ths[lbIdx]; if(!t)return;
  var top=t.offsetTop-rail.offsetTop, bot=top+t.offsetHeight;
  if(top<rail.scrollTop) rail.scrollTop=top;
  else if(bot>rail.scrollTop+rail.clientHeight) rail.scrollTop=bot-rail.clientHeight;
}
function pcNav(d){ pcShow(lbIdx+d); }
/* 스테이지 좌우 스와이프 */
(function(){
  var st=document.querySelector('.port-stage'); if(!st)return;
  var sx=0,sy=0;
  st.addEventListener('touchstart',function(e){sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
  st.addEventListener('touchend',function(e){
    var dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
    if(Math.abs(dx)>52&&Math.abs(dx)>Math.abs(dy)) pcNav(dx<0?1:-1);
  },{passive:true});
})();

/* ════════ selection ════════ */
function findItem(secId,itId){var s=DATA.sections.find(function(x){return x.id===secId;});return s.items.find(function(i){return i.id===itId;});}
function pickRadio(secId,itId){
  var sec=DATA.sections.find(function(s){return s.id===secId;});
  sec.items.forEach(function(it){var el=document.getElementById('oc-'+it.id);if(el)el.classList.remove('sel');});
  if(sel[secId]===itId){sel[secId]=null;}else{sel[secId]=itId;document.getElementById('oc-'+itId).classList.add('sel');}
  rebuild();
}
function togglePill(secId,itId){
  if(!sel[secId])sel[secId]={};
  var el=document.getElementById('pl-'+itId);
  if(sel[secId][itId]){delete sel[secId][itId];el.classList.remove('sel');}
  else{
    var sec=DATA.sections.find(function(s){return s.id===secId;});
    if(sec&&sec.type==='expr'){
      var max=sec.maxFree||5;
      if(Object.keys(sel[secId]).length>=max){ toast(lang==='ko'?('기본 제공 표정은 '+max+'개까지 무료예요'):('Up to '+max+' free expressions')); return; }
    }
    sel[secId][itId]=true;el.classList.add('sel');
  }
  rebuild();
}
function setQty(secId,itId,d){
  if(!sel[secId])sel[secId]={};
  var cur=(sel[secId][itId]||0)+d; if(cur<0)cur=0;
  setQtyVal(secId,itId,cur);
}
function setQtyVal(secId,itId,val){
  if(!sel[secId])sel[secId]={};
  val=parseInt(val,10)||0; if(val<0)val=0;
  if(val===0)delete sel[secId][itId]; else sel[secId][itId]=val;
  var it=findItem(secId,itId);
  var qn=document.getElementById('qn-'+itId); if(qn)qn.textContent=val;
  var qi=document.getElementById('qi-'+itId); if(qi)qi.classList.toggle('on',val>0);
  var qp=document.getElementById('qp-'+itId); if(qp)qp.textContent=won(it.p)+' '+UI[lang].won+(val>1?' × '+val+' = '+won(it.p*val):'');
  rebuild();
}
function resetForm(){
  sel={};
  renderForm(); // 라디오/필/수량 전부 초기 상태로 다시 그림
  document.getElementById('formMsg').value='';
  document.getElementById('fixedRef').value='';
  document.getElementById('fixedEmail').value='';
  DATA.apply.forEach(function(q,i){var e=document.getElementById('aq_'+i);if(e)e.value='';});
  rebuild();toast(UI[lang].resetDone);
}

/* ════════ build form text (DASHBOARD-COMPATIBLE, always Korean structure) ════════ */
function cleanLabel(s){return s.replace(/^[^\wㄱ-힣]+\s*/,'');}
function buildFormText(){
  var lines=['모무꼬 작가 · Live2D 의뢰 양식','━━━━━━━━━━━━━━━━━━━━━━━━━━━━',''];
  var total=0, any=false;
  DATA.sections.forEach(function(sec){
    if(sec.type==='radio'){
      if(!sel[sec.id])return; var it=findItem(sec.id,sel[sec.id]); if(!it)return;
      any=true;
      lines.push('▸ '+sec.koLabel); lines.push('  · '+it.ko); lines.push('    → '+won(it.p)+'원'); lines.push('');
      total+=it.p;
    } else if(sec.type==='pill'||sec.type==='qty'){
      if(!sel[sec.id])return; var ids=Object.keys(sel[sec.id]); if(!ids.length)return;
      any=true; lines.push('▸ '+sec.koLabel);
      ids.forEach(function(id){var it=findItem(sec.id,id);var q=sel[sec.id][id]||1;lines.push('  · '+it.ko+(q>1?' × '+q+'개':''));lines.push('    → '+won(it.p*q)+'원');total+=it.p*q;});
      lines.push('');
    } else if(sec.type==='expr'){
      if(!sel[sec.id])return; var ids=Object.keys(sel[sec.id]); if(!ids.length)return;
      var names=ids.map(function(id){return findItem(sec.id,id).ko;});
      lines.push('▸ '+sec.koLabel+' (무료)'); lines.push('  · '+names.join(', ')); lines.push('');
    }
  });
  lines.push('─────────────────────────────');
  lines.push('  합계 금액 : '+won(total)+'원');
  lines.push('─────────────────────────────');
  var msg=(document.getElementById('formMsg')||{}).value||'';
  if(msg.trim()){lines.push('');lines.push('✉ 작가님께 전할 말');lines.push('  '+msg.trim());}
  lines.push('');lines.push('[ 신청양식 ]');
  DATA.apply.forEach(function(q,i){
    var el=document.getElementById('aq_'+i); var v=el?el.value.trim():'';
    lines.push('▸ '+q.ko); lines.push('  '+(v||'(미입력)')); lines.push('');
  });
  var ref=(document.getElementById('fixedRef')||{}).value||'';
  var email=(document.getElementById('fixedEmail')||{}).value||'';
  if(ref.trim()||email.trim()){
    lines.push('[ 추가 정보 ]');
    if(ref.trim()){lines.push('▸ 레퍼런스 링크');lines.push('  레퍼런스: '+ref.trim());lines.push('');}
    if(email.trim()){lines.push('▸ 파일 수령 이메일');lines.push('  이메일: '+email.trim());lines.push('');}
  }
  lines.push('━━━━━━━━━━━━━━━━━━━━━━━━━━━━');
  lines.push('양식이 완성되면 복사해서 작가님께 전달해주세요 :)');
  return {text:lines.join('\n'), total:total, any:any};
}
function countSel(){
  var c=0;
  DATA.sections.forEach(function(sec){
    if(sec.type==='radio'&&sel[sec.id])c++;
    else if(sel[sec.id])c+=Object.keys(sel[sec.id]).length;
  });
  return c;
}
function mmPostMeta(total){
  try{
    if(window.self===window.top) return;
    var secs=[]; document.querySelectorAll('.section').forEach(function(s){var t=s.querySelector('.sec-title');var lab=t?t.textContent.trim():'';if(lab)secs.push({label:lab, y:s.getBoundingClientRect().top+(window.pageYOffset||document.documentElement.scrollTop||0)});});
    parent.postMessage({src:'momuuko-artmug', sections:secs, total:(total||0)}, '*');
  }catch(e){}
}
function rebuild(){
  var r=buildFormText();
  document.getElementById('totalAmt').textContent=won(r.total);
  var sm=document.getElementById('smTotal'); if(sm)sm.textContent=won(r.total)+' '+UI[lang].won;
  var mv=document.getElementById('mbarAmt'); if(mv)mv.textContent=won(r.total)+' '+UI[lang].won;
  var mk=document.getElementById('mbarK'); if(mk)mk.textContent=UI[lang].lTotal;
  var mb=document.getElementById('mbarCopy'); if(mb){mb.textContent=UI[lang].copy;mb.disabled=!r.any;}
  mmPostMeta(r.total);
  var c=countSel();
  document.getElementById('totalCnt').textContent=c?UI[lang].cnt(c):'';
  var body=document.getElementById('previewBody');
  if(!r.any){body.textContent=UI[lang].emptyPreview;body.style.color='var(--ink3)';}
  else{body.textContent=r.text;body.style.color='var(--ink)';}
}
function copyForm(){
  var r=buildFormText();
  if(!r.any){toast(UI[lang].needSel);return;}
  navigator.clipboard.writeText(r.text).then(function(){toast(UI[lang].copyDone);}).catch(function(){
    var ta=document.createElement('textarea');ta.value=r.text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast(UI[lang].copyDone);
  });
}

/* ════════ notice accordion ════════ */
function toggleNt(i){
  var nt=document.getElementById('nt-'+i),a=document.getElementById('nta-'+i);
  if(nt.classList.contains('open')){nt.classList.remove('open');a.style.maxHeight=0;}

/* ════════ toast ════════ */
var toastT;
function toast(msg){var el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){el.classList.remove('show');},2200);}

/* ════════ init ════════ */
/* 데이터는 data/commission.json 에서 불러옴 (스튜디오 편집탭에서 수정).
   불러오기 실패 시 위에 하드코딩된 DATA를 그대로 사용(fallback). */
function applyData(j){
  if(!j)return;
  if(j.hero)DATA.hero=j.hero;
  if(j.steps&&j.steps.length)STEPS=j.steps;
  if(j.chips)DATA.chips=j.chips;
  if(j.slots)DATA.slots=j.slots;
  if(j.sections)DATA.sections=j.sections;
  if(j.notice)DATA.notice=j.notice;
  if(j.apply)DATA.apply=j.apply;
  if(j.portfolioOrder)DATA.portfolioOrder=j.portfolioOrder;
}
/* 단독 열람일 때만 하단 고정 바를 켠다 (임베드에서는 fixed 가 iframe 기준이라 무용) */
try{ if(window.self===window.top) document.body.classList.add('solo'); }catch(e){}
function init(){
  fetch('data/commission.json?t='+Date.now())
    .then(function(r){return r.ok?r.json():null;})
    .then(function(j){applyData(j);})
    .catch(function(){})
    .then(function(){ setLang('ko'); loadPortfolio(); });
}
init();
document.addEventListener('keydown',function(e){
  if(!imgs.length)return;
  var t=e.target, tag=t&&t.tagName;
  if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT')return;   // 입력 중엔 무시
  if(e.key==='ArrowRight')pcNav(1); else if(e.key==='ArrowLeft')pcNav(-1);
});

/* ── iframe 자동 높이: 부모(artmug.kr)에 내 높이 전달 ── */
(function(){
  var _lastH=0;
  /* 실제 콘텐츠 바닥 높이 — body min-height 스트레치/position:fixed·absolute 요소에 영향 안 받음 → 무한루프 차단 */
  function contentHeight(){
    var max=0, kids=document.body.children;
    for(var i=0;i<kids.length;i++){
      var el=kids[i], pos='';
      try{ pos=getComputedStyle(el).position; }catch(e){}
      if(pos==='fixed'||pos==='absolute') continue;
      var b=el.getBoundingClientRect().bottom + (window.pageYOffset||document.documentElement.scrollTop||0);
      if(b>max) max=b;
    }
    return Math.ceil(max)||document.body.scrollHeight;
  }
  function postH(){
    try{
      var h=contentHeight();
      if(Math.abs(h-_lastH)<4) return; _lastH=h;
      parent.postMessage({src:'momuuko-artmug', mmHeight:h}, '*');
    }catch(e){}
  }
  if(window.self!==window.top){ try{ document.body.style.minHeight='0'; document.documentElement.style.minHeight='0'; }catch(e){} } // 보조: 스트레치 제거
  function tick(){ postH(); try{ if(window.mmPostMeta){ var el=document.getElementById('totalAmt'); var t=el?parseInt((el.textContent||'0').replace(/[^\d]/g,''),10)||0:0; mmPostMeta(t); } }catch(e){} }
  window.addEventListener('load', tick);
  window.addEventListener('resize', tick);
  try{ new MutationObserver(postH).observe(document.body, {childList:true,subtree:true,attributes:true,characterData:true}); }catch(e){}
  setInterval(tick, 1000);
  tick();
})();

/* ── 스테이지 연출: 배경 작품 · 등장 · 진행 막대 ──
   배경은 position:absolute 로 각 섹션 안에 깐다. fixed 는 임베드에서
   화면이 아니라 iframe 기준이 되어 문서 꼭대기에 박혀버린다. */
(function(){
  var ART=['감라빛','난지','달자기','유피','백곰형','엠쓔'];
  var BASE='https://'+GH.user+'.github.io/'+GH.repo+'/'+GH.folder+'/';
  document.querySelectorAll('.bg').forEach(function(b){
    var n=ART[(+b.dataset.art)%ART.length], el=b.querySelector('img');
    el.onerror=function(){el.onerror=null;el.src=BASE+encodeURIComponent(n)+'.png';};
    el.src=BASE+'view/'+encodeURIComponent(n)+'.webp';
  });

  var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;

  /* 섹션이 보이면 안쪽 요소가 차례로 떠오른다 */
  function mark(){
    document.querySelectorAll('.section > *:not(.bg), .hero-card > *').forEach(function(el){
      if(!el.classList.contains('rv')) el.classList.add('rv');
    });
  }
  mark();
  var io=new IntersectionObserver(function(es){
    es.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });
  },{rootMargin:'0px 0px -6% 0px'});
  function watch(){ document.querySelectorAll('.rv:not(.in)').forEach(function(el){io.observe(el);}); }
  watch();
  window.mmWatch=function(){ mark(); watch(); };   // 언어 전환 등 다시 그린 뒤 호출

  var ioBg=new IntersectionObserver(function(es){
    es.forEach(function(e){ e.target.classList.toggle('on', e.isIntersecting); });
  },{rootMargin:'-10% 0px -10% 0px'});
  document.querySelectorAll('.bg img').forEach(function(el){ioBg.observe(el);});

  /* 빛 입자 */
  var mo=document.getElementById('motes');
  if(mo && !reduce){
    var h='';
    for(var i=0;i<12;i++) h+='<i style="left:'+(5+Math.random()*90).toFixed(1)+'%;bottom:-10px;'+
      'animation-duration:'+(9+Math.random()*10).toFixed(1)+'s;animation-delay:'+(Math.random()*11).toFixed(1)+'s"></i>';
    mo.innerHTML=h;
  }

  /* 진행 막대 + 배경 시차 (단독 열람) */
  var bar=document.getElementById('prog');
  var bgs=[].slice.call(document.querySelectorAll('.bg'));
  function onScroll(){
    if(bar){
      var y=window.scrollY, hh=document.documentElement.scrollHeight-window.innerHeight;
      bar.style.width=(hh>0?y/hh*100:0)+'%';
    }
    if(reduce)return;
    bgs.forEach(function(b){
      var r=b.getBoundingClientRect();
      if(r.bottom<-200||r.top>innerHeight+200)return;
      var k=(r.top+r.height/2-innerHeight/2)/innerHeight;
      var img=b.querySelector('img');
      if(img) img.style.transform='translateY('+(k*-30).toFixed(1)+'px)';
    });
  }
  addEventListener('scroll',onScroll,{passive:true});
  addEventListener('resize',onScroll,{passive:true});
  onScroll();
})();

/* ── 떠있는 사이드바 (합계 + 섹션 이동) ── */
(function(){
  var EMB = window.self!==window.top;
  function navTo(sec){
    if(!sec) return;
    if(!EMB){ try{ sec.scrollIntoView({behavior:'smooth',block:'start'}); }catch(e){ sec.scrollIntoView(); } }
    else { try{ var y=sec.getBoundingClientRect().top+(window.pageYOffset||document.documentElement.scrollTop||0); parent.postMessage({src:'momuuko-artmug', scrollToY:y}, '*'); }catch(e){} }
  }
  function buildSideNav(){
    var nav=document.getElementById('smNav'); if(!nav) return;
    var secs=document.querySelectorAll('.section'); var h='';
    secs.forEach(function(s,i){ var t=s.querySelector('.sec-title'); var lab=t?t.textContent.trim():''; if(lab) h+='<div class="sm-link" data-i="'+i+'">'+lab+'</div>'; });
    nav.innerHTML=h;
    nav.querySelectorAll('.sm-link').forEach(function(a){ a.addEventListener('click',function(){ navTo(secs[+a.dataset.i]); }); });
  }
  function initSide(){
    window.buildSideNav=buildSideNav;
    buildSideNav();
    var sm=document.getElementById('sideMini');
    if(typeof rebuild==='function') rebuild();              // 합계 동기화
    if(!EMB){ if(sm) sm.classList.add('show'); }            // 단독 페이지: 고정 표시
    else {                                                  // 임베드: 부모 스크롤 동기화 시 표시
      window.addEventListener('message', function(e){
        var d=e.data; if(!d||d.src!=='momuuko-parent'||typeof d.vTop!=='number') return;
        if(!sm) return; sm.style.position='absolute'; sm.style.top=(d.vTop+16)+'px'; sm.classList.add('show');
      });
    }
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', initSide); else initSide();
})();
</script>
<div id="sideMini">
  <div class="sm-tl">현재 합계</div>
  <div class="sm-amt" id="smTotal">0 원</div>
  <div class="sm-nav" id="smNav"></div>
</div>
