<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>플래너 · 모무꼬 스튜디오</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700;900&family=Noto+Sans+KR:wght@300;400;500;700&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.15) transparent;}
*::-webkit-scrollbar{width:6px;height:6px;}
*::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:3px;}
*::-webkit-scrollbar-track{background:transparent;}
:root{
  --Y:#3D8EF0;
  --bg:#1A1A22;
  --panel:#20202A;
  --panel2:#262630;
  --border:rgba(255,255,255,.12);
  --border2:rgba(255,255,255,.07);
  --text:#F0EEE8;
  --text2:#B8B4AC;
  --text3:#7A7870;
  --red:#F87171;
  --yellow:#FBBF24;
  --green:#34D399;
  --display:'Bebas Neue',sans-serif;
  --cond:'Barlow Condensed',sans-serif;
  --mono:'DM Mono',monospace;
  --kr:'Noto Sans KR',sans-serif;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--kr);}
body{display:flex;flex-direction:column;}

/* ─── 상단 바 ─── */
.top{display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:1px solid var(--border);flex-shrink:0;background:rgba(26,26,34,.6);}
.top h1{font-family:var(--display);font-size:22px;letter-spacing:1.5px;color:var(--Y);}
.top .sub{font-family:var(--cond);font-size:13px;color:var(--text3);font-weight:600;letter-spacing:.5px;}
.top .spacer{margin-left:auto;}
.hint{font-family:var(--mono);font-size:10.5px;color:var(--text3);}

/* ─── 본문 레이아웃 ─── */
.wrap{flex:1;display:flex;min-height:0;}

/* ─── 좌측: 할일 태그 ─── */
.left{width:380px;flex-shrink:0;display:flex;flex-direction:column;border-right:1px solid var(--border);background:var(--panel);min-height:0;}
.left-head{padding:16px 18px 10px;display:flex;align-items:baseline;gap:8px;}
.left-head .t{font-family:var(--cond);font-weight:700;font-size:21px;letter-spacing:.5px;}
.left-head .c{font-family:var(--mono);font-size:14px;color:var(--text3);margin-left:auto;}
.taglist{flex:1;overflow-y:auto;padding:4px 14px 14px;display:flex;flex-direction:column;gap:10px;}
.taglist .empty{color:var(--text3);font-size:15px;text-align:center;padding:36px 12px;line-height:1.7;}

.chip{
  display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:11px;
  border:1px solid var(--c-bd,var(--border));background:var(--c-bg,var(--panel2));
  cursor:grab;user-select:none;transition:transform .1s,box-shadow .1s;
}
.chip:active{cursor:grabbing;}
.chip.dragging{opacity:.4;}
.chip .dot{width:10px;height:10px;border-radius:50%;background:var(--c-dot,var(--Y));flex-shrink:0;}
.chip .who{font-family:var(--mono);font-size:14px;color:var(--c-tx,var(--text2));flex-shrink:0;max-width:104px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.chip .txt{font-size:18px;color:var(--text);flex:1;line-height:1.4;word-break:break-word;}
.chip .del{margin-left:auto;color:var(--text3);font-size:19px;cursor:pointer;flex-shrink:0;width:26px;text-align:center;border-radius:6px;line-height:1.2;}
.chip .del:hover{color:var(--red);background:rgba(248,113,113,.12);}

/* ─── 좌측 하단 작성기 ─── */
.composer{border-top:1px solid var(--border);padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--panel2);flex-shrink:0;}
.composer .row{display:flex;gap:8px;}
.composer select,.composer input{
  font-family:var(--kr);font-size:17px;color:var(--text);
  background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:11px 13px;
}
.composer select{flex:1;cursor:pointer;}
.composer .addcli{width:48px;flex-shrink:0;background:var(--bg);border:1px solid var(--border);border-radius:10px;color:var(--text2);font-size:22px;cursor:pointer;transition:.15s;}
.composer .addcli:hover{border-color:var(--Y);color:var(--Y);}
.composer input.txt{flex:1;}
.composer input.txt::placeholder{color:var(--text3);}
.composer .mk{background:var(--Y);border:none;border-radius:10px;color:#0d1320;font-weight:700;font-size:17px;font-family:var(--cond);letter-spacing:.5px;padding:0 18px;cursor:pointer;transition:.15s;}
.composer .mk:hover{filter:brightness(1.1);}

/* ─── 우측: 캘린더 ─── */
.right{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;}
.cal-head{display:flex;align-items:center;gap:10px;padding:12px 18px;flex-shrink:0;}
.cal-head .ym{font-family:var(--display);font-size:24px;letter-spacing:1px;min-width:150px;}
.cal-head .ym small{font-family:var(--mono);font-size:13px;color:var(--text3);letter-spacing:0;margin-left:6px;}
.navbtn{width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:var(--panel);color:var(--text2);cursor:pointer;font-size:14px;transition:.15s;}
.navbtn:hover{border-color:var(--Y);color:var(--Y);}
.todaybtn{height:30px;padding:0 12px;border-radius:8px;border:1px solid var(--border);background:var(--panel);color:var(--text2);cursor:pointer;font-family:var(--cond);font-weight:700;font-size:12px;letter-spacing:.5px;transition:.15s;}
.todaybtn:hover{border-color:var(--Y);color:var(--Y);}
.cal-legend{margin-left:auto;display:flex;gap:14px;font-family:var(--mono);font-size:10px;color:var(--text3);align-items:center;}
.cal-legend span{display:flex;align-items:center;gap:5px;}
.lg-dl{width:18px;height:8px;border-radius:3px;background:rgba(248,113,113,.18);border:1px dashed rgba(248,113,113,.5);}

.dow{display:grid;grid-template-columns:repeat(7,1fr);padding:0 14px;flex-shrink:0;}
.dow div{text-align:center;font-family:var(--cond);font-weight:700;font-size:11px;letter-spacing:1px;color:var(--text3);padding:4px 0;}
.dow div:first-child{color:#e88;}
.dow div:last-child{color:#88c8f0;}

.grid{flex:1;display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:1fr;gap:5px;padding:0 14px 14px;min-height:0;}
.cell{
  background:var(--panel);border:1px solid var(--border2);border-radius:9px;
  padding:5px 6px;display:flex;flex-direction:column;min-height:0;overflow:hidden;transition:.12s;
}
.cell.dim{opacity:.4;}
.cell.today{border-color:var(--Y);box-shadow:inset 0 0 0 1px rgba(61,142,240,.4);}
.cell.dropok{border-color:var(--green);background:rgba(52,211,153,.08);}
.cell .dnum{font-family:var(--mono);font-size:11px;color:var(--text2);margin-bottom:3px;flex-shrink:0;display:flex;align-items:center;gap:4px;}
.cell.today .dnum{color:var(--Y);font-weight:500;}
.cell .dnum.sun{color:#e88;}
.cell .dnum.sat{color:#88c8f0;}
.cell .dnum .todaytag{font-family:var(--cond);font-size:9px;background:var(--Y);color:#0d1320;border-radius:4px;padding:0 4px;font-weight:700;}
.cell .items{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:3px;min-height:0;}

.dl{
  font-size:13px;font-family:var(--mono);color:#e89;
  background:rgba(248,113,113,.1);border:1px dashed rgba(248,113,113,.35);border-radius:6px;
  padding:3px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0;
}
.cchip{
  display:flex;align-items:center;gap:7px;padding:5px 8px;border-radius:8px;cursor:grab;
  border:1px solid var(--c-bd,var(--border));background:var(--c-bg,var(--panel2));flex-shrink:0;
  font-size:16px;transition:.1s;
}
.cchip:active{cursor:grabbing;}
.cchip.dragging{opacity:.4;}
.cchip .dot{width:9px;height:9px;border-radius:50%;background:var(--c-dot,var(--Y));flex-shrink:0;}
.cchip .ctxt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text);}
.cchip.done{opacity:.5;}
.cchip.done .ctxt{text-decoration:line-through;color:var(--text3);}
.cchip .cdel{color:var(--text3);font-size:17px;line-height:1;flex-shrink:0;padding:0 3px;border-radius:5px;}
.cchip .cdel:hover{color:var(--red);background:rgba(248,113,113,.15);}

/* ─── 상단 버튼 ─── */
.topbtn{
  height:32px;padding:0 13px;border-radius:8px;border:1px solid var(--border);
  background:var(--panel);color:var(--text2);cursor:pointer;
  font-family:var(--cond);font-weight:700;font-size:13px;letter-spacing:.5px;transition:.15s;
  display:flex;align-items:center;gap:5px;white-space:nowrap;
}
.topbtn:hover{border-color:var(--Y);color:var(--Y);}
.topbtn.ai{border-color:rgba(167,139,250,.4);color:#a78bfa;}
.topbtn.ai:hover{border-color:#a78bfa;background:rgba(167,139,250,.1);}

/* ─── 모달 ─── */
.modal-bg{
  position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);
  display:none;align-items:center;justify-content:center;z-index:100;padding:20px;
}
.modal-bg.open{display:flex;}
.modal{
  background:var(--panel);border:1px solid var(--border);border-radius:16px;
  width:100%;max-width:560px;max-height:88vh;overflow-y:auto;padding:22px;
}
.modal h2{font-family:var(--cond);font-size:20px;font-weight:700;letter-spacing:.5px;margin-bottom:4px;}
.modal .desc{font-size:13px;color:var(--text3);margin-bottom:14px;line-height:1.6;}
.modal label{display:block;font-family:var(--cond);font-weight:700;font-size:13px;color:var(--text2);letter-spacing:.5px;margin:12px 0 5px;}
.modal input,.modal select,.modal textarea{
  width:100%;font-family:var(--kr);font-size:14px;color:var(--text);
  background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:10px 12px;
}
.modal textarea{min-height:160px;resize:vertical;line-height:1.6;}
.modal .btnrow{display:flex;gap:8px;margin-top:16px;justify-content:flex-end;flex-wrap:wrap;}
.mbtn{
  padding:9px 16px;border-radius:9px;border:1px solid var(--border);
  background:var(--panel2);color:var(--text2);cursor:pointer;
  font-family:var(--cond);font-weight:700;font-size:14px;letter-spacing:.5px;transition:.15s;
}
.mbtn:hover{border-color:var(--Y);color:var(--Y);}
.mbtn.primary{background:var(--Y);border-color:var(--Y);color:#0d1320;}
.mbtn.primary:hover{filter:brightness(1.1);color:#0d1320;}
.mbtn.ai{background:#7c5ce0;border-color:#7c5ce0;color:#fff;}
.mbtn.ai:hover{filter:brightness(1.12);color:#fff;}
.mbtn:disabled{opacity:.5;cursor:wait;}
.mstatus{font-size:13px;margin-top:10px;line-height:1.6;display:none;}
.mstatus.show{display:block;}
.mstatus.ok{color:var(--green);}
.mstatus.err{color:var(--red);}
.mstatus.load{color:var(--yellow);}

/* AI 추출 미리보기 */
.ai-preview{margin-top:14px;display:none;flex-direction:column;gap:7px;}
.ai-preview.show{display:flex;}
.ai-item{
  display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;
  border:1px solid var(--border);background:var(--panel2);cursor:pointer;font-size:14px;
}
.ai-item input{width:auto;accent-color:var(--Y);transform:scale(1.2);cursor:pointer;}
.ai-item .adate{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--yellow);flex-shrink:0;}

/* 토스트 */
#toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);
  background:var(--panel2);border:1px solid var(--border);border-radius:10px;
  padding:11px 20px;font-size:14px;color:var(--text);z-index:200;
  transition:transform .25s;box-shadow:0 8px 30px rgba(0,0,0,.4);white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis;
}
#toast.show{transform:translateX(-50%) translateY(0);}

/* ─── 반응형 ─── */
@media(max-width:760px){
  html,body{overflow:auto;}
  .wrap{flex-direction:column;}
  .left{width:100%;border-right:none;border-bottom:1px solid var(--border);max-height:46vh;}
  .right{min-height:60vh;}
  .grid{grid-auto-rows:minmax(70px,1fr);}
  .cal-legend{display:none;}
}
</style>
</head>
<body>

<div class="top">
  <h1>PLANNER</h1>
  <span class="sub">할일 일정보드</span>
  <span class="spacer"></span>
  <span class="hint">칩을 날짜로 드래그 · 칩 클릭=완료 · ✕=삭제</span>
  <button class="topbtn ai" id="btnAi">🤖 AI 추출</button>
  <button class="topbtn" id="btnSync">☁ 동기화</button>
  <button class="topbtn" id="btnSettings" title="설정">⚙</button>
</div>

<div class="wrap">
  <!-- 좌측: 할일 태그 -->
  <div class="left">
    <div class="left-head">
      <span class="t">할일 태그</span>
      <span class="c" id="tagCount">0</span>
    </div>
    <div class="taglist" id="taglist"></div>
    <div class="composer">
      <div class="row">
        <select id="selClient"><option value="">신청자 선택…</option></select>
        <button class="addcli" id="addCli" title="신청자 직접 추가">＋</button>
      </div>
      <div class="row">
        <input class="txt" id="todoText" placeholder="할 일 입력 후 Enter" autocomplete="off">
        <button class="mk" id="mkBtn">생성</button>
      </div>
      <div class="row">
        <button class="mk" id="stageBtn" style="flex:1;background:var(--panel);border:1px solid var(--border);color:var(--text2);" title="선택한 신청자의 작업 단계 할일(러프~전달)을 한 번에 생성">⚡ 단계 할일 일괄 생성</button>
      </div>
    </div>
  </div>

  <!-- 우측: 캘린더 -->
  <div class="right">
    <div class="cal-head">
      <button class="navbtn" id="prevM">‹</button>
      <button class="navbtn" id="nextM">›</button>
      <div class="ym" id="ymLabel"></div>
      <button class="todaybtn" id="todayBtn">오늘</button>
      <div class="cal-legend">
        <span><i class="lg-dl"></i>의뢰 마감일</span>
      </div>
    </div>
    <div class="dow"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div>
    <div class="grid" id="grid"></div>
  </div>
</div>

<!-- ═══ AI 추출 모달 ═══ -->
<div class="modal-bg" id="aiModal">
  <div class="modal">
    <h2>🤖 AI 할일 추출</h2>
    <div class="desc">신청자와 나눈 대화를 붙여넣으면 Claude가 해야 할 일을 자동으로 뽑아 태그로 만들어줍니다. 날짜가 언급되면 캘린더에도 배치돼요.</div>
    <label>신청자</label>
    <select id="aiClient"></select>
    <label>대화 내용</label>
    <textarea id="aiText" placeholder="예)
신청자: 안녕하세요! 반신 커미션 신청하고 싶어요
나: 네! 6월 안에 가능하세요?
신청자: 네 25일까지 부탁드려요. 러프는 15일쯤 볼 수 있을까요?
나: 가능합니다. 입금 확인되면 시작할게요~"></textarea>
    <div class="mstatus" id="aiStatus"></div>
    <div class="ai-preview" id="aiPreview"></div>
    <div class="btnrow">
      <button class="mbtn" id="aiClose">닫기</button>
      <button class="mbtn ai" id="aiRun">추출하기</button>
      <button class="mbtn primary" id="aiAdd" style="display:none;">선택 항목 태그 추가</button>
    </div>
  </div>
</div>

<!-- ═══ 동기화 모달 ═══ -->
<div class="modal-bg" id="syncModal">
  <div class="modal">
    <h2>☁ GitHub 동기화</h2>
    <div class="desc">플래너 데이터를 저장소 <b>data/planner.json</b>에 백업하고, 다른 기기에서 복원할 수 있어요. (대시보드와 같은 GitHub 설정 공유)</div>
    <div class="mstatus" id="syncStatus"></div>
    <div class="btnrow">
      <button class="mbtn" id="syncClose">닫기</button>
      <button class="mbtn" id="syncRestore">⬇ 복원 (불러오기)</button>
      <button class="mbtn primary" id="syncBackup">⬆ 백업 (업로드)</button>
    </div>
  </div>
</div>

<!-- ═══ 설정 모달 ═══ -->
<div class="modal-bg" id="setModal">
  <div class="modal">
    <h2>⚙ 설정</h2>
    <div class="desc">키는 이 브라우저(localStorage)에만 저장됩니다.</div>
    <label>Claude API 키 <span style="color:var(--text3);font-weight:400;">(AI 추출용 · console.anthropic.com에서 발급)</span></label>
    <input id="setClaudeKey" type="password" placeholder="sk-ant-api03-...">
    <label>AI 모델</label>
    <select id="setClaudeModel">
      <option value="claude-opus-4-8">Claude Opus 4.8 — 가장 똑똑함 (기본, 1회 ~30원)</option>
      <option value="claude-sonnet-4-6">Claude Sonnet 4.6 — 균형 (1회 ~15원)</option>
      <option value="claude-haiku-4-5">Claude Haiku 4.5 — 가장 저렴 (1회 ~5원)</option>
    </select>
    <label>GitHub 사용자명</label>
    <input id="setGhUser" placeholder="Tmabe">
    <label>GitHub 저장소</label>
    <input id="setGhRepo" placeholder="momuuko">
    <label>GitHub 토큰</label>
    <input id="setGhToken" type="password" placeholder="ghp_...">
    <div class="btnrow">
      <button class="mbtn" id="setClose">닫기</button>
      <button class="mbtn primary" id="setSave">저장</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
/* ════════ 데이터 ════════ */
var PKEY='mm_planner_v1', DKEY='mm_dash_v1';
var DONE_STAGE=7;
// state: { todos:[{id,client,text}], placements:[{id,todoId,date,done}], clients:[수동추가명] }
var state=load();
var viewY, viewM; // 캘린더가 보는 연·월
(function(){ var t=new Date(); viewY=t.getFullYear(); viewM=t.getMonth(); })();

function load(){
  try{
    var s=JSON.parse(localStorage.getItem(PKEY)||'{}');
    return {todos:s.todos||[], placements:s.placements||[], clients:s.clients||[]};
  }catch(e){ return {todos:[],placements:[],clients:[]}; }
}
function save(){ try{ localStorage.setItem(PKEY, JSON.stringify(state)); }catch(e){} }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

/* 대시보드 의뢰 읽기 */
function dashCommissions(){
  try{
    var raw=JSON.parse(localStorage.getItem(DKEY)||'[]');
    return Array.isArray(raw)?raw:(raw.commissions||[]);
  }catch(e){ return []; }
}
function isActive(c){ return (typeof c.stage==='number'?c.stage<DONE_STAGE:c.stage!=='전달완료') && !c.hidden; }

/* 신청자 목록 = 대시보드 의뢰인(중복제거) + 수동추가 */
function allClients(){
  var set={}, order=[];
  dashCommissions().forEach(function(c){
    var n=(c.client||'').trim();
    if(n && !set[n]){ set[n]=1; order.push(n); }
  });
  (state.clients||[]).forEach(function(n){
    n=(n||'').trim();
    if(n && !set[n]){ set[n]=1; order.push(n); }
  });
  return order;
}

/* ════════ 색상 (신청자별 고정) ════════ */
function hueOf(name){
  if(!name) return 215; // 기본 = 블루 톤
  var h=0; for(var i=0;i<name.length;i++) h=(h*31+name.charCodeAt(i))%360;
  return h;
}
function colorVars(name){
  var h=hueOf(name);
  return '--c-bg:hsla('+h+',48%,52%,.16);--c-bd:hsla('+h+',48%,58%,.42);'
       + '--c-dot:hsl('+h+',60%,62%);--c-tx:hsl('+h+',45%,76%)';
}

/* ════════ 날짜 유틸 ════════ */
function ymd(d){ return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function todayStr(){ return ymd(new Date()); }

/* ════════ 신청자 셀렉트 ════════ */
function renderSelect(){
  var sel=document.getElementById('selClient');
  var keep=sel.value;
  sel.innerHTML='<option value="">신청자 선택…</option>';
  allClients().forEach(function(n){
    var o=document.createElement('option'); o.value=n; o.textContent=n; sel.appendChild(o);
  });
  // 신청자 없는 할일도 허용
  var o2=document.createElement('option'); o2.value='__none__'; o2.textContent='(신청자 없음)'; sel.appendChild(o2);
  if(keep && [].some.call(sel.options,function(o){return o.value===keep;})) sel.value=keep;
}

/* ════════ 좌측 태그 리스트 ════════ */
function renderTags(){
  var box=document.getElementById('taglist');
  box.innerHTML='';
  document.getElementById('tagCount').textContent=state.todos.length;
  if(!state.todos.length){
    box.innerHTML='<div class="empty">아래에서 할일을 만들고<br>달력 날짜로 드래그하세요.</div>';
    return;
  }
  state.todos.forEach(function(t){
    var el=document.createElement('div');
    el.className='chip'; el.draggable=true;
    el.style.cssText=colorVars(t.client);
    el.dataset.todoId=t.id;
    var who=t.client && t.client!=='__none__' ? '<span class="who" title="'+esc(t.client)+'">'+esc(t.client)+'</span>' : '';
    el.innerHTML='<span class="dot"></span>'+who+'<span class="txt">'+esc(t.text)+'</span><span class="del" title="태그 삭제">✕</span>';
    el.addEventListener('dragstart',function(e){
      e.dataTransfer.setData('text/plain', JSON.stringify({kind:'new', todoId:t.id}));
      e.dataTransfer.effectAllowed='copy';
      el.classList.add('dragging');
    });
    el.addEventListener('dragend',function(){ el.classList.remove('dragging'); });
    el.querySelector('.del').addEventListener('click',function(ev){
      ev.stopPropagation();
      // 태그 + 해당 태그의 모든 배치 삭제
      state.todos=state.todos.filter(function(x){return x.id!==t.id;});
      state.placements=state.placements.filter(function(p){return p.todoId!==t.id;});
      save(); renderTags(); renderGrid();
    });
    box.appendChild(el);
  });
}

/* ════════ 캘린더 ════════ */
function renderGrid(){
  document.getElementById('ymLabel').innerHTML=
    (viewY)+' <small>'+['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'][viewM]+'</small>';
  var grid=document.getElementById('grid');
  grid.innerHTML='';

  var first=new Date(viewY,viewM,1);
  var startDow=first.getDay();
  var gridStart=new Date(viewY,viewM,1-startDow);

  // 마감일 인덱스: date → [client...]
  var dlMap={};
  dashCommissions().forEach(function(c){
    if(c.deadline && isActive(c)){
      (dlMap[c.deadline]=dlMap[c.deadline]||[]).push(c.client||'의뢰');
    }
  });
  // 배치 인덱스: date → [placement...]
  var plMap={};
  state.placements.forEach(function(p){ (plMap[p.date]=plMap[p.date]||[]).push(p); });

  var tStr=todayStr();
  for(var i=0;i<42;i++){
    var d=new Date(gridStart.getFullYear(),gridStart.getMonth(),gridStart.getDate()+i);
    var ds=ymd(d);
    var inMonth=(d.getMonth()===viewM);
    var dow=d.getDay();

    var cell=document.createElement('div');
    cell.className='cell'+(inMonth?'':' dim')+(ds===tStr?' today':'');
    cell.dataset.date=ds;

    var dn=document.createElement('div');
    dn.className='dnum'+(dow===0?' sun':dow===6?' sat':'');
    dn.innerHTML='<span>'+d.getDate()+'</span>'+(ds===tStr?'<span class="todaytag">TODAY</span>':'');
    cell.appendChild(dn);

    var items=document.createElement('div'); items.className='items';

    // 마감일(옅게)
    (dlMap[ds]||[]).forEach(function(name){
      var dl=document.createElement('div'); dl.className='dl';
      dl.textContent='📌 '+name+' 마감';
      dl.title=name+' 의뢰 마감일';
      items.appendChild(dl);
    });

    // 배치된 할일
    (plMap[ds]||[]).forEach(function(p){
      var t=todoById(p.todoId);
      if(!t){ return; }
      var cc=document.createElement('div');
      cc.className='cchip'+(p.done?' done':''); cc.draggable=true;
      cc.style.cssText=colorVars(t.client);
      cc.dataset.placeId=p.id;
      var label=(t.client && t.client!=='__none__'?t.client+' · ':'')+t.text;
      cc.innerHTML='<span class="dot"></span><span class="ctxt" title="'+esc(label)+'">'+esc(t.text)+'</span><span class="cdel" title="삭제">✕</span>';
      cc.addEventListener('dragstart',function(e){
        e.dataTransfer.setData('text/plain', JSON.stringify({kind:'move', placeId:p.id}));
        e.dataTransfer.effectAllowed='move';
        cc.classList.add('dragging');
      });
      cc.addEventListener('dragend',function(){ cc.classList.remove('dragging'); });
      // 클릭 = 완료 토글
      cc.addEventListener('click',function(ev){
        if(ev.target.classList.contains('cdel')) return;
        p.done=!p.done; save(); renderGrid();
      });
      // ✕ = 배치 삭제
      cc.querySelector('.cdel').addEventListener('click',function(ev){
        ev.stopPropagation();
        state.placements=state.placements.filter(function(x){return x.id!==p.id;});
        save(); renderGrid();
      });
      items.appendChild(cc);
    });

    cell.appendChild(items);

    // 드롭 타깃
    cell.addEventListener('dragover',function(e){ e.preventDefault(); e.dataTransfer.dropEffect='copy'; this.classList.add('dropok'); });
    cell.addEventListener('dragleave',function(){ this.classList.remove('dropok'); });
    cell.addEventListener('drop',function(e){
      e.preventDefault(); this.classList.remove('dropok');
      var data; try{ data=JSON.parse(e.dataTransfer.getData('text/plain')); }catch(_){ return; }
      var date=this.dataset.date;
      if(data.kind==='new'){
        state.placements.push({id:uid(), todoId:data.todoId, date:date, done:false});
      }else if(data.kind==='move'){
        var p=state.placements.filter(function(x){return x.id===data.placeId;})[0];
        if(p) p.date=date;
      }
      save(); renderGrid();
    });

    grid.appendChild(cell);
  }
}
function todoById(id){ return state.todos.filter(function(t){return t.id===id;})[0]; }

/* ════════ 할일 생성 ════════ */
function makeTodo(){
  var inp=document.getElementById('todoText');
  var text=inp.value.trim();
  if(!text){ inp.focus(); return; }
  var client=document.getElementById('selClient').value;
  state.todos.push({id:uid(), client:client||'', text:text});
  save(); renderTags();
  inp.value=''; inp.focus();
}

/* ════════ 이스케이프 ════════ */
function esc(s){ return String(s).replace(/[&<>"']/g,function(m){return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[m];}); }

/* ════════ 이벤트 ════════ */
document.getElementById('mkBtn').addEventListener('click', makeTodo);
document.getElementById('todoText').addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); makeTodo(); } });
document.getElementById('addCli').addEventListener('click', function(){
  var n=prompt('추가할 신청자 이름:');
  if(n===null) return;
  n=n.trim(); if(!n) return;
  if(allClients().indexOf(n)<0){ state.clients.push(n); save(); }
  renderSelect();
  document.getElementById('selClient').value=n;
  document.getElementById('todoText').focus();
});
document.getElementById('prevM').addEventListener('click', function(){ viewM--; if(viewM<0){viewM=11;viewY--;} renderGrid(); });
document.getElementById('nextM').addEventListener('click', function(){ viewM++; if(viewM>11){viewM=0;viewY++;} renderGrid(); });
document.getElementById('todayBtn').addEventListener('click', function(){ var t=new Date(); viewY=t.getFullYear(); viewM=t.getMonth(); renderGrid(); });

// 대시보드/다른 탭에서 변경 시 반영
window.addEventListener('storage', function(e){
  if(e.key===DKEY){ renderSelect(); renderGrid(); }
  if(e.key===PKEY){ state=load(); renderTags(); renderGrid(); }
});

/* ════════ 토스트 ════════ */
var _toastT=null;
function toast(msg){
  var el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(_toastT); _toastT=setTimeout(function(){ el.classList.remove('show'); },2600);
}

/* ════════ 모달 공통 ════════ */
function openModal(id){ document.getElementById(id).classList.add('open'); }
function closeModal(id){ document.getElementById(id).classList.remove('open'); }
['aiModal','syncModal','setModal'].forEach(function(id){
  document.getElementById(id).addEventListener('click',function(e){ if(e.target===this) closeModal(id); });
});

/* ════════ 설정 (Claude 키·모델 + GitHub) ════════ */
function ghCfg(){ return {user:localStorage.getItem('gh_user')||'',repo:localStorage.getItem('gh_repo')||'',token:localStorage.getItem('gh_token')||''}; }
document.getElementById('btnSettings').addEventListener('click',function(){
  document.getElementById('setClaudeKey').value=localStorage.getItem('mm_claude_key')||'';
  document.getElementById('setClaudeModel').value=localStorage.getItem('mm_claude_model')||'claude-opus-4-8';
  var g=ghCfg();
  document.getElementById('setGhUser').value=g.user||'Tmabe';
  document.getElementById('setGhRepo').value=g.repo||'momuuko';
  document.getElementById('setGhToken').value=g.token||'';
  openModal('setModal');
});
document.getElementById('setClose').addEventListener('click',function(){ closeModal('setModal'); });
document.getElementById('setSave').addEventListener('click',function(){
  localStorage.setItem('mm_claude_key', document.getElementById('setClaudeKey').value.trim());
  localStorage.setItem('mm_claude_model', document.getElementById('setClaudeModel').value);
  localStorage.setItem('gh_user', document.getElementById('setGhUser').value.trim());
  localStorage.setItem('gh_repo', document.getElementById('setGhRepo').value.trim());
  localStorage.setItem('gh_token', document.getElementById('setGhToken').value.trim());
  closeModal('setModal'); toast('✅ 설정 저장 완료');
});

/* ════════ C. 단계 할일 일괄 생성 ════════ */
var WORK_STAGES=['러프','선화','채색','완성','전달'];
document.getElementById('stageBtn').addEventListener('click',function(){
  var client=document.getElementById('selClient').value;
  if(!client || client==='__none__'){ toast('⚠️ 신청자를 먼저 선택해주세요'); return; }
  var added=0;
  WORK_STAGES.forEach(function(st){
    var dup=state.todos.some(function(t){ return t.client===client && t.text===st; });
    if(!dup){ state.todos.push({id:uid(), client:client, text:st}); added++; }
  });
  if(added){ save(); renderTags(); toast('⚡ '+client+'님 단계 할일 '+added+'개 생성!'); }
  else toast('이미 모든 단계 할일이 있어요');
});

/* ════════ F. GitHub 동기화 ════════ */
var SYNC_PATH='data/planner.json';
function syncStatus(cls,msg){ var el=document.getElementById('syncStatus'); el.className='mstatus show '+cls; el.textContent=msg; }
document.getElementById('btnSync').addEventListener('click',function(){
  document.getElementById('syncStatus').className='mstatus';
  openModal('syncModal');
});
document.getElementById('syncClose').addEventListener('click',function(){ closeModal('syncModal'); });

async function ghGetFile(g){
  var res=await fetch('https://api.github.com/repos/'+g.user+'/'+g.repo+'/contents/'+SYNC_PATH+'?t='+Date.now(),
    {headers:{'Authorization':'token '+g.token}});
  if(res.status===404) return null;
  if(!res.ok) throw new Error('GitHub 응답 '+res.status);
  return res.json();
}
document.getElementById('syncBackup').addEventListener('click',async function(){
  var g=ghCfg();
  if(!g.token){ toast('⚙️ 설정에서 GitHub 토큰을 먼저 입력해주세요'); closeModal('syncModal'); document.getElementById('btnSettings').click(); return; }
  syncStatus('load','⬆ 업로드 중...');
  try{
    var prev=await ghGetFile(g);
    var body={
      message:'🗓 플래너 백업 '+new Date().toLocaleString('ko-KR'),
      content:btoa(unescape(encodeURIComponent(JSON.stringify(state,null,2))))
    };
    if(prev && prev.sha) body.sha=prev.sha;
    var res=await fetch('https://api.github.com/repos/'+g.user+'/'+g.repo+'/contents/'+SYNC_PATH,{
      method:'PUT', headers:{'Authorization':'token '+g.token,'Content-Type':'application/json'},
      body:JSON.stringify(body)
    });
    if(res.ok) syncStatus('ok','✅ 백업 완료! ('+SYNC_PATH+')');
    else { var e=await res.json(); throw new Error(e.message||res.status); }
  }catch(e){ syncStatus('err','❌ 실패: '+e.message); }
});
document.getElementById('syncRestore').addEventListener('click',async function(){
  var g=ghCfg();
  if(!g.token){ toast('⚙️ 설정에서 GitHub 토큰을 먼저 입력해주세요'); return; }
  if(!confirm('저장소의 백업으로 현재 플래너 데이터를 덮어씁니다. 계속할까요?')) return;
  syncStatus('load','⬇ 다운로드 중...');
  try{
    var f=await ghGetFile(g);
    if(!f){ syncStatus('err','❌ 백업 파일이 아직 없어요. 먼저 백업해주세요.'); return; }
    var json=decodeURIComponent(escape(atob(f.content.replace(/\n/g,''))));
    var s=JSON.parse(json);
    state={todos:s.todos||[], placements:s.placements||[], clients:s.clients||[]};
    save(); renderTags(); renderGrid(); renderSelect();
    syncStatus('ok','✅ 복원 완료! 할일 '+state.todos.length+'개 · 배치 '+state.placements.length+'개');
  }catch(e){ syncStatus('err','❌ 실패: '+e.message); }
});

/* ════════ AI 할일 추출 (Claude API) ════════ */
var _aiResult=[];
function aiStatus(cls,msg){ var el=document.getElementById('aiStatus'); el.className='mstatus show '+cls; el.textContent=msg; }
document.getElementById('btnAi').addEventListener('click',function(){
  if(!localStorage.getItem('mm_claude_key')){
    toast('⚙️ 설정에서 Claude API 키를 먼저 입력해주세요');
    document.getElementById('btnSettings').click(); return;
  }
  // 신청자 셀렉트 동기화
  var sel=document.getElementById('aiClient');
  sel.innerHTML='<option value="">(신청자 없음)</option>';
  allClients().forEach(function(n){ var o=document.createElement('option'); o.value=n; o.textContent=n; sel.appendChild(o); });
  var cur=document.getElementById('selClient').value;
  if(cur && cur!=='__none__') sel.value=cur;
  document.getElementById('aiStatus').className='mstatus';
  document.getElementById('aiPreview').className='ai-preview';
  document.getElementById('aiAdd').style.display='none';
  _aiResult=[];
  openModal('aiModal');
});
document.getElementById('aiClose').addEventListener('click',function(){ closeModal('aiModal'); });

document.getElementById('aiRun').addEventListener('click',async function(){
  var text=document.getElementById('aiText').value.trim();
  if(!text){ aiStatus('err','대화 내용을 붙여넣어주세요'); return; }
  var key=localStorage.getItem('mm_claude_key');
  var model=localStorage.getItem('mm_claude_model')||'claude-opus-4-8';
  var btn=this; btn.disabled=true;
  aiStatus('load','🤖 Claude가 대화를 읽는 중...');
  try{
    var res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'x-api-key':key,
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true'
      },
      body:JSON.stringify({
        model:model,
        max_tokens:2048,
        system:'당신은 일러스트 커미션 작가의 비서입니다. 작가와 신청자(의뢰인)의 대화에서 "작가가 해야 할 일"만 추출하세요.\n'
          +'규칙:\n'
          +'- 작가의 작업·확인·연락 등 실행 항목만. 신청자가 할 일이나 잡담은 제외.\n'
          +'- 각 할일은 8자 내외로 간결하게 (예: "러프 전달", "입금 확인", "배경 시안 2종").\n'
          +'- 날짜가 언급되면 YYYY-MM-DD로 변환해 date에 넣고, 없으면 빈 문자열. 오늘은 '+todayStr()+' 입니다.\n'
          +'- "15일쯤 러프" 같은 표현은 그 날짜의 할일로. "25일까지 완성"은 마감일로 해석해 그 날짜에.\n'
          +'- 중복·유사 항목은 하나로 합치세요.',
        messages:[{role:'user', content:text}],
        output_config:{format:{type:'json_schema', schema:{
          type:'object',
          properties:{
            todos:{type:'array', items:{
              type:'object',
              properties:{
                text:{type:'string', description:'할일 내용 (간결하게)'},
                date:{type:'string', description:'YYYY-MM-DD 형식 날짜. 날짜 언급이 없으면 빈 문자열'}
              },
              required:['text','date'], additionalProperties:false
            }}
          },
          required:['todos'], additionalProperties:false
        }}}
      })
    });
    if(!res.ok){
      var err=await res.json().catch(function(){return {};});
      var msg=(err.error&&err.error.message)||('HTTP '+res.status);
      if(res.status===401) msg='API 키가 올바르지 않아요. 설정에서 확인해주세요.';
      if(res.status===429) msg='요청이 너무 많아요. 잠시 후 다시 시도해주세요.';
      throw new Error(msg);
    }
    var data=await res.json();
    var textBlock=(data.content||[]).filter(function(b){return b.type==='text';})[0];
    if(!textBlock) throw new Error('응답이 비어있어요');
    _aiResult=(JSON.parse(textBlock.text).todos||[]).filter(function(t){return t.text&&t.text.trim();});
    if(!_aiResult.length){ aiStatus('err','추출된 할일이 없어요. 대화 내용을 확인해주세요.'); btn.disabled=false; return; }
    // 미리보기 렌더
    var pv=document.getElementById('aiPreview');
    pv.innerHTML='';
    _aiResult.forEach(function(t,i){
      var row=document.createElement('label');
      row.className='ai-item';
      row.innerHTML='<input type="checkbox" checked data-i="'+i+'"><span>'+esc(t.text)+'</span>'
        +(t.date?'<span class="adate">📅 '+esc(t.date)+'</span>':'');
      pv.appendChild(row);
    });
    pv.className='ai-preview show';
    document.getElementById('aiAdd').style.display='';
    aiStatus('ok','✅ '+_aiResult.length+'개 추출! 추가할 항목을 선택하세요.');
  }catch(e){
    aiStatus('err','❌ '+e.message);
  }
  btn.disabled=false;
});

document.getElementById('aiAdd').addEventListener('click',function(){
  var client=document.getElementById('aiClient').value;
  var checks=document.querySelectorAll('#aiPreview input:checked');
  var added=0, placed=0;
  checks.forEach(function(c){
    var t=_aiResult[+c.dataset.i];
    if(!t) return;
    var todo={id:uid(), client:client||'', text:t.text.trim()};
    state.todos.push(todo); added++;
    if(t.date && /^\d{4}-\d{2}-\d{2}$/.test(t.date)){
      state.placements.push({id:uid(), todoId:todo.id, date:t.date, done:false});
      placed++;
    }
  });
  if(added){
    save(); renderTags(); renderGrid();
    toast('🤖 할일 '+added+'개 추가'+(placed?' · '+placed+'개 캘린더 배치':'')+'!');
    closeModal('aiModal');
  } else toast('선택된 항목이 없어요');
});

/* ════════ 초기 렌더 ════════ */
renderSelect();
renderTags();
renderGrid();
</script>
