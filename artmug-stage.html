<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>모무꼬 · 시안 D — 스테이지</title>
<meta name="description" content="게임 공식 사이트형 · 메뉴판 겸용">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Archivo:wght@500;700;900&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#2E9BE0; --sky-d:#1B6FA8; --halo:#59D2FF;
  --night:#0C1F30;
  --paper:#F2F8FD;
  --ink:#13212E; --ink2:#55697C;
  --line:rgba(19,33,46,.11);
  --cond:'Barlow Condensed',sans-serif;
  --disp:'Archivo',sans-serif;
  --tilt:-8deg;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Noto Sans KR',sans-serif;color:var(--ink);background:var(--night);
  overflow-x:hidden;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}

/* ══════ 떠 있는 크롬 ══════ */
.prog{position:fixed;top:0;left:0;height:3px;width:0;background:var(--halo);z-index:95;transition:width .1s linear}
.topbar{position:fixed;top:0;left:0;right:0;z-index:90;display:flex;align-items:center;gap:16px;
  padding:14px 24px;transition:background .35s,backdrop-filter .35s,padding .35s,box-shadow .35s}
.topbar.solid{background:rgba(255,255,255,.9);backdrop-filter:blur(14px);padding:9px 24px;box-shadow:0 1px 0 var(--line)}
.logo{font-family:var(--disp);font-weight:900;font-size:18px;letter-spacing:-.02em;color:#fff;transition:color .35s}
.logo b{color:var(--halo)}
.topbar.solid .logo{color:var(--ink)}
.topbar nav{margin-left:auto;display:flex;gap:2px}
.topbar nav a{font-family:var(--cond);text-transform:uppercase;letter-spacing:.12em;font-size:14px;
  font-weight:600;color:rgba(255,255,255,.85);text-decoration:none;padding:6px 12px;transition:.22s}
.topbar.solid nav a{color:var(--ink2)}
.topbar nav a:hover{background:var(--halo);color:var(--night)}
@media(max-width:700px){.topbar nav{display:none}}

/* ══════ 무대 ══════
   메뉴판 역할을 겸하므로 화면을 억지로 꽉 채우지 않는다.
   히어로만 크게 잡고 나머지는 내용 높이만큼만 쓴다. */
.stage{position:relative;overflow:hidden}
.inner{position:relative;z-index:2;width:100%;max-width:1120px;margin:0 auto;padding:54px 24px}
.stage.night{background:var(--night);color:#fff}
.stage.day{background:var(--paper)}

/* 섹션마다 배경 작품이 다르다. 화면에 들어오면 켜지고 스크롤에 따라 천천히 밀린다.
   position:absolute 인 이유 — fixed 는 임베드에서 화면이 아니라 iframe 기준이 되어 쓸 수 없다. */
.bg{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.bg img{position:absolute;left:0;right:0;top:-10%;width:100%;height:120%;object-fit:cover;object-position:50% 14%;
  opacity:0;transition:opacity 1.1s ease}
.night .bg img.on{opacity:.3}
.night .bg::after{content:'';position:absolute;inset:0;
  background:linear-gradient(100deg,var(--night) 18%,rgba(12,31,48,.82) 52%,rgba(12,31,48,.58) 100%)}
.day .bg img.on{opacity:.16}
.day .bg::after{content:'';position:absolute;inset:0;
  background:linear-gradient(95deg,var(--paper) 42%,rgba(242,248,253,.72) 72%,rgba(242,248,253,.5) 100%)}

.kick{font-family:var(--cond);text-transform:uppercase;letter-spacing:.2em;font-size:13.5px;font-weight:600;
  color:var(--sky-d);display:flex;align-items:center;gap:9px;margin-bottom:9px}
.kick::before{content:'';width:22px;height:2px;background:var(--sky-d)}
.night .kick{color:var(--halo)}
.night .kick::before{background:var(--halo)}
h2{font-size:clamp(25px,4.4vw,38px);font-weight:900;letter-spacing:-.025em;line-height:1.18}
h2 em{font-style:normal;color:var(--sky-d)}
.night h2 em{color:var(--halo)}
.lead{color:var(--ink2);font-size:14.5px;max-width:54ch;margin-top:7px}
.night .lead{color:rgba(255,255,255,.62)}

.rv{opacity:0;transform:translateY(20px);transition:opacity .62s cubic-bezier(.16,1,.3,1),transform .62s cubic-bezier(.16,1,.3,1)}
.rv.in{opacity:1;transform:none}
.d1{transition-delay:.06s}.d2{transition-delay:.12s}.d3{transition-delay:.18s}

/* ══════ 1 · 히어로 — 접수 현황을 안으로 합쳐 섹션 하나를 줄였다 ══════ */
#s1{min-height:88svh;display:flex;align-items:center}
#s1 .inner{padding:92px 24px 46px}
#s1 .bg img{object-position:72% 12%}
.motes{position:absolute;inset:0;z-index:1;pointer-events:none}
.motes i{position:absolute;width:4px;height:4px;border-radius:50%;background:var(--halo);opacity:.45;
  animation:rise linear infinite}
@keyframes rise{from{transform:translateY(0);opacity:0}14%{opacity:.55}to{transform:translateY(-70vh);opacity:0}}
.badge{display:inline-flex;align-items:center;gap:8px;background:var(--halo);color:var(--night);
  font-family:var(--cond);text-transform:uppercase;letter-spacing:.15em;font-size:13.5px;font-weight:700;
  padding:7px 16px;margin-bottom:18px}
.badge .pip{width:6px;height:6px;border-radius:50%;background:var(--night)}
.wordmark{font-family:var(--disp);font-weight:900;font-size:clamp(46px,10vw,112px);line-height:.86;
  letter-spacing:-.045em;text-transform:uppercase}
.wordmark span{display:inline-block;opacity:0;transform:translateY(30px);animation:wm .75s cubic-bezier(.16,1,.3,1) forwards}
.wordmark .hl{color:var(--halo)}
@keyframes wm{to{opacity:1;transform:none}}
.role{font-family:var(--cond);text-transform:uppercase;letter-spacing:.18em;font-size:clamp(12.5px,1.8vw,16px);
  font-weight:600;color:rgba(255,255,255,.9);margin-top:13px;border-left:3px solid var(--halo);padding-left:12px}
.hcta{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.btn{border:none;font-family:var(--cond);text-transform:uppercase;letter-spacing:.13em;font-size:16px;
  font-weight:700;padding:14px 30px;cursor:pointer;transform:skewX(var(--tilt));
  transition:transform .2s,box-shadow .24s,background .24s}
.btn span{display:inline-block;transform:skewX(calc(var(--tilt) * -1))}
.btn.p{background:var(--halo);color:var(--night);box-shadow:0 8px 22px rgba(89,210,255,.28)}
.btn.p:hover{transform:skewX(var(--tilt)) translateY(-3px);box-shadow:0 13px 30px rgba(89,210,255,.42)}
.btn.g{background:transparent;color:#fff;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.42)}
.btn.g:hover{background:rgba(255,255,255,.11)}
.slotbar{display:flex;gap:9px;flex-wrap:wrap;margin-top:28px;padding-top:20px;border-top:1px solid rgba(255,255,255,.14)}
.sb{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.07);padding:9px 15px;
  transform:skewX(var(--tilt));transition:background .25s}
.sb>*{transform:skewX(calc(var(--tilt) * -1))}
.sb:hover{background:rgba(255,255,255,.13)}
.sb .mo{font-family:var(--disp);font-size:18px;font-weight:900;letter-spacing:-.03em}
.sb .bars{display:flex;gap:3px}
.sb .bars i{width:13px;height:4px;background:rgba(255,255,255,.28)}
.sb .bars i.free{background:var(--halo)}
.sb .st{font-family:var(--cond);text-transform:uppercase;letter-spacing:.12em;font-size:13px;font-weight:600;
  color:rgba(255,255,255,.58)}
.sb.open .st{color:var(--halo)}

/* ══════ 2 · 작품 ══════ */
.strip{display:flex;gap:12px;margin-top:22px;padding-bottom:8px;overflow-x:auto;scroll-snap-type:x proximity}
.strip::-webkit-scrollbar{height:4px}
.strip::-webkit-scrollbar-thumb{background:rgba(255,255,255,.22)}
.shot{position:relative;flex:0 0 clamp(185px,23vw,250px);scroll-snap-align:center;overflow:hidden;
  transform:skewX(var(--tilt));transition:transform .35s cubic-bezier(.16,1,.3,1)}
.shot img{aspect-ratio:3/4;width:114%;margin-left:-7%;object-fit:cover;object-position:50% 15%;
  transform:skewX(calc(var(--tilt) * -1)) scale(1.03);transition:transform .55s cubic-bezier(.16,1,.3,1)}
.shot:hover{transform:skewX(var(--tilt)) translateY(-6px)}
.shot:hover img{transform:skewX(calc(var(--tilt) * -1)) scale(1.1)}
.shot figcaption{position:absolute;left:0;right:0;bottom:0;padding:26px 14px 10px;
  background:linear-gradient(transparent,rgba(12,31,48,.9));
  font-family:var(--cond);text-transform:uppercase;letter-spacing:.12em;font-size:13px;font-weight:600;color:#fff}
.shot figcaption span{display:block;transform:skewX(calc(var(--tilt) * -1))}

/* ══════ 3 · 메뉴판 — 이 페이지의 주인공 ══════ */
.menu{column-count:2;column-gap:34px;margin-top:22px}
.grp{break-inside:avoid;margin-bottom:24px}
.grp h3{font-size:15px;font-weight:900;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;
  padding-bottom:7px;border-bottom:2px solid var(--ink)}
.grp h3 .tag{font-family:var(--cond);text-transform:uppercase;letter-spacing:.1em;font-size:12px;font-weight:700;
  background:var(--sky-d);color:#fff;padding:2px 8px}
.grp h3 .tag.free{background:var(--sky-d)}
.grp .row{display:flex;align-items:baseline;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.grp .row:last-child{border-bottom:none}
.grp .row .n{flex:1;font-size:13.5px;line-height:1.45}
.grp .row .n i{font-style:normal;display:block;font-size:11.5px;color:var(--sky-d);font-weight:700;margin-top:1px}
.grp .row .v{font-family:var(--disp);font-size:15px;font-weight:900;letter-spacing:-.02em;white-space:nowrap}
.grp .row .v.free{font-family:var(--cond);text-transform:uppercase;letter-spacing:.1em;font-size:13px;color:var(--sky-d)}
.note{font-size:12.5px;color:var(--ink2);background:rgba(46,155,224,.09);padding:9px 12px;margin-top:10px;
  border-left:3px solid var(--sky)}

/* ══════ 4 · 문의 ══════ */
#s4{text-align:center}
#s4 .kick{justify-content:center}
#s4 .lead{margin:7px auto 0}
#s4 .hcta{justify-content:center;margin-top:26px}
.foot{font-family:var(--cond);letter-spacing:.13em;text-transform:uppercase;font-size:12px;
  color:rgba(255,255,255,.38);margin-top:32px}

@media(max-width:760px){
  :root{--tilt:-5deg}
  .inner{padding:42px 17px}
  #s1{min-height:82svh}
  #s1 .inner{padding:82px 17px 36px}
  .menu{column-count:1}
  .night .bg img.on{opacity:.2}
  .night .bg::after{background:linear-gradient(175deg,rgba(12,31,48,.58) 12%,var(--night) 80%)}
  .day .bg::after{background:linear-gradient(175deg,rgba(242,248,253,.58) 10%,var(--paper) 70%)}
}
@media (prefers-reduced-motion:reduce){
  .rv{opacity:1!important;transform:none!important;transition:none}
  *{animation:none!important}
  html{scroll-behavior:auto}
  .bg img{transition:none}
}
</style>
</head>
<body>

<div class="prog" id="prog"></div>
<header class="topbar" id="topbar">
  <div class="logo">MOM<b>UK</b>KO</div>
  <nav><a href="#s2">WORKS</a><a href="#s3">MENU</a><a href="#s4">CONTACT</a></nav>
</header>

<!-- 1 · 히어로 + 접수현황 -->
<section class="stage night" id="s1">
  <div class="bg" data-art="0"><img alt=""></div>
  <div class="motes" id="motes"></div>
  <div class="inner">
    <div class="badge"><span class="pip"></span>커미션 접수 중</div>
    <h1 class="wordmark" id="wm"></h1>
    <div class="role">Subcultural Illustrator &amp; Live2D Designer</div>
    <div class="hcta">
      <button class="btn p"><span>메뉴 보기</span></button>
      <button class="btn g"><span>작품 보기</span></button>
    </div>
    <div class="slotbar" id="slotbar"></div>
  </div>
</section>

<!-- 2 · 작품 -->
<section class="stage night" id="s2">
  <div class="bg" data-art="1"><img alt=""></div>
  <div class="inner">
    <div class="kick rv">01 — Works</div>
    <h2 class="rv d1">지금까지 <em>그린 캐릭터</em></h2>
    <p class="lead rv d2">전부 새로 그린 인체 위에 올라간 파츠입니다.</p>
    <div class="strip rv d3" id="strip"></div>
  </div>
</section>

<!-- 3 · 메뉴판 -->
<section class="stage day" id="s3">
  <div class="bg" data-art="2"><img alt=""></div>
  <div class="inner">
    <div class="kick rv">02 — Menu</div>
    <h2 class="rv d1">작업 <em>메뉴와 단가</em></h2>
    <p class="lead rv d2">옵션은 자유롭게 더할 수 있어요.</p>
    <div class="menu rv d3" id="menu"></div>
  </div>
</section>

<!-- 4 · 문의 -->
<section class="stage night" id="s4">
  <div class="bg" data-art="3"><img alt=""></div>
  <div class="inner">
    <div class="kick rv">03 — Contact</div>
    <h2 class="rv d1">맡겨 보시겠어요?</h2>
    <p class="lead rv d2">고민되시면 먼저 편하게 물어봐 주세요. 답변율 98%입니다.</p>
    <div class="hcta rv d3">
      <button class="btn p"><span>문의하기</span></button>
      <button class="btn g"><span>가격 계산기</span></button>
    </div>
    <div class="foot rv">© Momukko · Live2D Illustration</div>
  </div>
</section>

<script>
/* 시안 D — 게임 공식 사이트 느낌이되 메뉴판 역할을 겸한다.
   실제 commission.json 의 7그룹 37개 항목을 그대로 싣는다. */
var SLOTS=[{m:10,f:[1,1,1]},{m:11,f:[0,0,0]},{m:12,f:[0,0,0]}];
var MENU=[
 {t:'기본 일러스트',tag:'필수',items:[
   ['전신 · 협업용',1050000,'20만원 할인'],['전신',1100000,'20만원 할인'],
   ['반신 (리깅X)',850000],['풀옵션 (디자인+전신+알몸파츠+게임기+저작권)',1950000]]},
 {t:'리깅 협업 세트',note:'리깅은 협업 작가님께 별도 신청이 필요해요.',items:[
   ['하예나 님 리깅 + 전신 세트',800000,'5만원 할인'],
   ['모몬 님 리깅 + 전신 세트',900000,'표정리깅 무료'],
   ['피니 님 리깅 + 전신 세트',1300000,'5만원 할인']]},
 {t:'신의상 · 신헤어',items:[
   ['신의상 (전신)',400000],['신헤어',300000],['신의상 + 신헤어 세트',700000],
   ['나체 파츠 (얼굴 제외)',100000],['기존 모델이 제 작업물이 아닌 경우',50000]]},
 {t:'추가 옵션',note:'의상·헤어는 먼저 문의 후 선택해 주세요.',items:[
   ['표정·얼굴 파츠 추가',10000],['의상 추가 (전신)',400000],['악세서리·소품 파츠',10000],
   ['게임기 파츠 및 맞춤 손·팔',150000],['헤어 추가',300000],['동물귀',20000],['꼬리',10000],
   ['3면도 (단색채색)',200000],['나체 파츠 (완전한 알몸)',100000],['겉옷 on/off',50000]]},
 {t:'기본 제공 표정',tag:'5개 무료',items:[
   ['빠직',0],['정색',0],['반짝이는 눈',0],['하트눈',0],['눈물',0],
   ['땀',0],['죽은눈',0],['동공 작아짐',0],['볼빵빵',0],['진한 홍조',0]]},
 {t:'데뷔축전',items:[['데뷔축전 전신',350000],['데뷔축전 (상업용·장패드)',550000]]},
 {t:'기타',items:[
   ['저작권 구매 (굿즈·모델양도·상업)',400000],['빠른 마감 7일',500000],['작품 비공개',100000]]}
];
var ART=['감라빛','난지','달자기','유피','백곰형','엠쓔'];
var won=function(n){return n.toLocaleString('en-US');};
function src(n){return 'portfolio/view/'+encodeURIComponent(n)+'.webp';}
function fall(el,n){el.onerror=function(){el.onerror=null;el.src='portfolio/'+encodeURIComponent(n)+'.png';};}

/* 섹션마다 다른 작품을 배경으로 깐다 */
document.querySelectorAll('.bg').forEach(function(b){
  var n=ART[(+b.dataset.art)%ART.length], el=b.querySelector('img');
  fall(el,n); el.src=src(n);
});

/* 로고 — 글자마다 시차 */
(function(){
  var parts=[['MOM',0],['UK',1],['KO',0]];
  document.getElementById('wm').innerHTML=parts.map(function(p,i){
    return '<span class="'+(p[1]?'hl':'')+'" style="animation-delay:'+(.1+i*.1)+'s">'+p[0]+'</span>';
  }).join('');
})();

/* 빛 입자 */
(function(){
  var h='';
  for(var i=0;i<13;i++) h+='<i style="left:'+(5+Math.random()*90).toFixed(1)+'%;bottom:-10px;'+
    'animation-duration:'+(9+Math.random()*10).toFixed(1)+'s;animation-delay:'+(Math.random()*11).toFixed(1)+'s"></i>';
  document.getElementById('motes').innerHTML=h;
})();

/* 접수 현황 — 히어로 안에 한 줄로 */
document.getElementById('slotbar').innerHTML=SLOTS.map(function(s){
  var free=s.f.filter(function(x){return !x;}).length;
  return '<div class="sb'+(free?' open':'')+'"><span class="mo">'+s.m+'월</span>'+
    '<span class="bars">'+s.f.map(function(x){return '<i class="'+(x?'':'free')+'"></i>';}).join('')+'</span>'+
    '<span class="st">'+(free?free+' open':'closed')+'</span></div>';
}).join('');

/* 작품 */
(function(){
  var box=document.getElementById('strip');
  box.innerHTML=ART.map(function(a){
    return '<figure class="shot"><img alt="'+a+'" data-n="'+a+'"><figcaption><span>'+a+'</span></figcaption></figure>';
  }).join('');
  box.querySelectorAll('img').forEach(function(el){var n=el.dataset.n;fall(el,n);el.src=src(n);});
})();

/* 메뉴판 */
document.getElementById('menu').innerHTML=MENU.map(function(g){
  return '<div class="grp"><h3>'+g.t+(g.tag?'<span class="tag">'+g.tag+'</span>':'')+'</h3>'+
    g.items.map(function(it){
      return '<div class="row"><span class="n">'+it[0]+(it[2]?'<i>'+it[2]+'</i>':'')+'</span>'+
        '<span class="v'+(it[1]?'':' free')+'">'+(it[1]?won(it[1])+'원':'무료')+'</span></div>';
    }).join('')+
    (g.note?'<div class="note">'+g.note+'</div>':'')+'</div>';
}).join('');

/* 등장 */
var io=new IntersectionObserver(function(es){
  es.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });
},{rootMargin:'0px 0px -8% 0px'});
document.querySelectorAll('.rv').forEach(function(el){io.observe(el);});

/* 배경 켜기 — 섹션이 화면에 들어오면 그 섹션의 작품이 떠오른다 */
var ioBg=new IntersectionObserver(function(es){
  es.forEach(function(e){ e.target.classList.toggle('on', e.isIntersecting); });
},{rootMargin:'-10% 0px -10% 0px'});
document.querySelectorAll('.bg img').forEach(function(el){ioBg.observe(el);});

/* 상단바 · 진행 막대 · 배경 시차 */
var topEl=document.getElementById('topbar'), bar=document.getElementById('prog');
var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
var bgs=[].slice.call(document.querySelectorAll('.bg'));
function onScroll(){
  var y=window.scrollY, h=document.documentElement.scrollHeight-window.innerHeight;
  bar.style.width=(h>0?y/h*100:0)+'%';
  topEl.classList.toggle('solid', y>window.innerHeight*.62);
  if(reduce)return;
  bgs.forEach(function(b){
    var r=b.getBoundingClientRect();
    if(r.bottom<-200||r.top>innerHeight+200)return;
    var k=(r.top+r.height/2-innerHeight/2)/innerHeight;
    var img=b.querySelector('img');
    if(img) img.style.transform='translateY('+(k*-34).toFixed(1)+'px)';
  });
}
addEventListener('scroll',onScroll,{passive:true});
addEventListener('resize',onScroll,{passive:true});
onScroll();
</script>
</body>
</html>
