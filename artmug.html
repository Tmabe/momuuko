<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>모무꼬 · 커미션 안내 ✦ Momukko Live2D</title>
<meta name="description" content="Live2D 일러스트레이터 모무꼬 · 커미션 및 작업 안내">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════════
   모무꼬 커미션 페이지 — 네임카드 리디자인
   팔레트 출처: 아트머그 콜로소 홍보 배너 (차콜 · 앰버 · 화이트)
   구성(섹션 순서·JS·data/commission.json 연동)은 전혀 건드리지 않음.
   다크 히어로 = 명함 앞면 / 종이 본문 = 명함 속지.
   ══════════════════════════════════════════════════════════════ */
:root{
  /* 잉크 — 배너 배경의 차콜 계열 */
  --ink:#17171A;        /* JS가 var(--ink) 직접 참조 → 이름 유지 필수 */
  --ink2:#5A5A63;
  --ink3:#94949E;       /* JS가 var(--ink3) 직접 참조 → 이름 유지 필수 */
  --ink-line:#35353D;   /* 다크면 위 헤어라인 */

  /* 앰버 — 배너의 UK / oso 색 */
  --amber:#F5A623;
  --amber-h:#FFB93D;
  --amber-ink:#8A5A00;  /* 종이 위 앰버 텍스트. #F5A623은 흰 배경 대비 1.97:1이라
                           본문 글자색으로 못 씀. 이 값이 약 4.9:1 확보. */
  --amber-l:#F3DCB0;
  --amber-pl:#FDF4E4;

  /* 종이 */
  --paper:#FAF9F7; --paper2:#F2F0EB; --white:#fff;
  --line:#E2DFD9; --line2:#EDEAE4;

  /* 명함 문법: 그림자 대신 헤어라인으로 면을 나눈다. 라운드는 각지지 않을 만큼만. */
  --r:8px; --r-sm:6px; --r-xs:4px;
  --sh:none;
  --sh-md:0 1px 2px rgba(23,23,26,.06);
  --sh-lg:0 10px 34px rgba(23,23,26,.14);

  --disp:'Anton','Zen Kaku Gothic New',sans-serif;          /* 로고타입 · 큰 숫자 */
  --cond:'Barlow Condensed','Zen Kaku Gothic New',sans-serif; /* 대문자 마이크로 라벨 */
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  font-family:'Zen Kaku Gothic New','Noto Sans KR',sans-serif;
  color:var(--ink); line-height:1.65;
  background:var(--paper);
  min-height:100vh; overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:980px;margin:0 auto;padding:0 22px;position:relative;z-index:1;counter-reset:sec}
.section{margin-bottom:52px;counter-increment:sec}

/* lang toggle */
.lang-toggle{position:fixed;top:14px;right:14px;z-index:200;display:flex;background:var(--ink);border:1px solid var(--ink);border-radius:var(--r-sm);overflow:hidden;box-shadow:var(--sh-md)}
.lang-toggle button{border:none;background:transparent;color:rgba(255,255,255,.55);font-family:var(--cond);font-size:13.5px;font-weight:600;padding:7px 14px;cursor:pointer;transition:.15s;letter-spacing:.08em;text-transform:uppercase}
.lang-toggle button.on{background:var(--amber);color:var(--ink)}

/* section heading — 번호 + 제목 + 잉크 룰 (명함의 항목 구분선) */
.sec-head{display:flex;align-items:baseline;gap:12px;margin-bottom:18px;padding-bottom:10px;border-bottom:1px solid var(--ink)}
.sec-head::before{content:counter(sec,decimal-leading-zero);font-family:var(--disp);font-size:13px;letter-spacing:.06em;color:var(--amber-ink);flex-shrink:0;line-height:1}
.sec-titles{display:flex;flex-direction:column;gap:1px}
.sec-jp{display:none}
.sec-title{font-size:16px;font-weight:900;letter-spacing:-.005em;color:var(--ink);line-height:1.25}
.sec-line{flex:1;height:0}
.sec-badge{display:none}

/* 떠있는 미니 사이드바 */
#sideMini{display:none;position:fixed;top:84px;right:14px;z-index:500;width:158px;
  background:
    linear-gradient(var(--amber),var(--amber)) 14px 0/16px 2px no-repeat,
    repeating-linear-gradient(0deg,rgba(255,255,255,.032) 0 1px,transparent 1px 30px),
    var(--ink);
  border:1px solid var(--ink-line);border-radius:var(--r-sm);box-shadow:var(--sh-lg);padding:15px 14px 13px;color:#fff}
#sideMini.show{display:block}
.sm-tl{font-family:var(--cond);font-size:11.5px;font-weight:600;color:rgba(255,255,255,.5);letter-spacing:.14em;text-transform:uppercase}
.sm-amt{font-family:var(--disp);font-size:21px;color:var(--amber);margin:3px 0 10px;font-variant-numeric:tabular-nums;letter-spacing:.01em;line-height:1.15}
.sm-nav{display:flex;flex-direction:column;gap:1px;border-top:1px solid var(--ink-line);padding-top:8px}
.sm-link{font-size:11.5px;font-weight:600;color:rgba(255,255,255,.62);padding:5px 7px;border-radius:var(--r-xs);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:.14s}
.sm-link:hover{background:rgba(245,166,35,.14);color:var(--amber)}
/* 떠있는 사이드바는 본문(max 980px)과 겹치지 않을 때만 띄운다.
   충돌 조건: 본문 우측(V/2+490) > 사이드바 좌측(V-172)  →  V < 1324px */
@media(max-width:1340px){#sideMini{display:none!important}}

/* ── HERO = 명함 앞면 ── */
.hero{padding:56px 22px 32px;max-width:980px;margin:0 auto}
.hero-card{
  background:
    radial-gradient(420px 320px at 88% -6%, rgba(245,166,35,.17), transparent 66%),
    repeating-linear-gradient(90deg, rgba(255,255,255,.030) 0 1px, transparent 1px 36px),
    repeating-linear-gradient(0deg,  rgba(255,255,255,.030) 0 1px, transparent 1px 36px),
    var(--ink);
  border:1px solid var(--ink);border-radius:var(--r);padding:40px 42px 36px;box-shadow:var(--sh-lg);position:relative;overflow:hidden;color:#fff}
.hero-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--amber)}
/* 배너에서 인물 실루엣이 앉던 우상단 자리를 앰버 광으로만 암시 */
/* 명함처럼 안쪽에 한 겹 더 두르고, 대각 두 모서리에만 앰버 브래킷을 건다 */
.hero-card::after{content:'';position:absolute;inset:14px;border:1px solid rgba(255,255,255,.075);border-radius:3px;pointer-events:none;
  background:
    linear-gradient(var(--amber),var(--amber)) left top/16px 1px no-repeat,
    linear-gradient(var(--amber),var(--amber)) left top/1px 16px no-repeat,
    linear-gradient(var(--amber),var(--amber)) right bottom/16px 1px no-repeat,
    linear-gradient(var(--amber),var(--amber)) right bottom/1px 16px no-repeat}
.hero-badge{position:relative;z-index:1;display:inline-flex;align-items:center;gap:6px;background:transparent;color:var(--amber);border:1px solid rgba(245,166,35,.42);font-family:var(--cond);font-size:12.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;padding:5px 12px;border-radius:var(--r-xs);margin-bottom:20px}
.wordmark{position:relative;z-index:1;font-family:var(--disp);font-weight:400;font-size:clamp(46px,10.2vw,104px);line-height:.9;letter-spacing:.004em;color:#fff;text-transform:uppercase}
.wordmark .wm-b{color:var(--amber)}
.hero-role{position:relative;z-index:1;font-family:var(--cond);font-size:clamp(12.5px,2.1vw,17px);font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:#fff;margin-top:11px}
.hero-jp{position:relative;z-index:1;font-size:12px;font-weight:500;letter-spacing:.34em;color:rgba(255,255,255,.5);margin-top:10px}
.hero-sub{position:relative;z-index:1;font-size:13.5px;color:rgba(255,255,255,.72);margin-top:20px;padding-top:18px;border-top:1px solid rgba(255,255,255,.11);line-height:1.85;font-weight:400;max-width:56ch}
.chips{position:relative;z-index:1;display:flex;gap:6px;flex-wrap:wrap;margin-top:20px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;background:rgba(255,255,255,.05);border:1px solid var(--ink-line);border-radius:var(--r-xs);font-size:12px;font-weight:500;color:rgba(255,255,255,.7)}
.chip b{color:#fff;font-weight:800}
.chip.pk b{color:var(--amber)}
.chip .dotlive{width:6px;height:6px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 0 rgba(245,166,35,.55);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(245,166,35,.55)}70%{box-shadow:0 0 0 7px rgba(245,166,35,0)}100%{box-shadow:0 0 0 0 rgba(245,166,35,0)}}
.hero-cta{position:relative;z-index:1;display:flex;gap:8px;flex-wrap:wrap;margin-top:26px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:13px 26px;border-radius:var(--r-sm);border:1px solid transparent;font-family:inherit;font-size:13.5px;font-weight:800;cursor:pointer;transition:background .15s,border-color .15s,color .15s;text-decoration:none;letter-spacing:.01em}
.btn-main{background:var(--amber);color:var(--ink);border-color:var(--amber)}
.btn-main:hover{background:var(--amber-h);border-color:var(--amber-h)}
.btn-ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.28)}
.btn-ghost:hover{border-color:#fff;background:rgba(255,255,255,.07)}

/* CARD */
.card{background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:22px 24px;box-shadow:var(--sh)}

/* SLOTS */
.slot-row{display:flex;align-items:center;gap:14px;padding:13px 2px;border-bottom:1px solid var(--line2)}
.slot-row:last-child{border-bottom:none}
.slot-month{font-family:var(--cond);font-size:18px;font-weight:600;flex:0 0 92px;color:var(--ink);letter-spacing:.02em}
.slot-dots{display:flex;gap:6px;flex:1;flex-wrap:wrap}
/* ■/□ 문자는 숨기고 사각형 자체로 읽히게 한다 (오른쪽 텍스트 태그가 상태를 말해줌) */
.dot{width:26px;height:26px;border-radius:var(--r-xs);border:1px solid var(--line);background:var(--paper2);display:flex;align-items:center;justify-content:center;font-size:0;color:transparent}
.dot.filled{background:var(--ink);border-color:var(--ink);
  background-image:linear-gradient(45deg,transparent 45%,rgba(255,255,255,.26) 45% 55%,transparent 55%)}
.dot.open{background:var(--white);border-color:var(--amber)}
.slot-tag{font-family:var(--cond);font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:4px 11px;border-radius:var(--r-xs);flex-shrink:0;border:1px solid}
.slot-tag.open{background:var(--amber);color:var(--ink);border-color:var(--amber)}
.slot-tag.full{background:transparent;color:var(--ink3);border-color:var(--line)}

/* PORTFOLIO — 세로 썸네일 레일 + 고정 스테이지 */
/* 스테이지 높이: 임베드(자동높이 iframe)에서는 vh가 문서 전체 높이가 되어버리므로
   clamp의 px 상한이 반드시 필요하다. 이게 없으면 아트머그 사이트에서 거대해진다.
   썸네일 크기는 "레일에 4.5개가 보이는 높이"에서 역산한다(반쯤 걸친 1장이 다음 작품을 암시). */
:root{
  --stageH:clamp(320px,60vh,620px);
  --thumbGap:8px;
  --thumbH:clamp(110px, calc((var(--stageH) - 4*var(--thumbGap)) / 4.5), 190px);
  --railW:calc(var(--thumbH) * 0.75);
}
.port-wrap{display:none}
.port-stack{display:flex;gap:12px;align-items:flex-start}
.port-rail{flex:0 0 calc(var(--railW) + 8px);display:flex;flex-direction:column;gap:var(--thumbGap);
  max-height:var(--stageH);overflow-y:auto;overscroll-behavior:contain;padding:0 6px 0 2px;scrollbar-width:thin}
/* 높이를 직접 지정해야 스크롤바 폭에 상관없이 "4.5개 보이기"가 정확히 유지된다 */
.port-th{position:relative;width:100%;height:var(--thumbH);padding:0;flex-shrink:0;cursor:pointer;
  border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--paper2);
  box-shadow:none;transition:border-color .14s,box-shadow .14s}
.port-th img{width:100%;height:100%;object-fit:cover;object-position:50% 16%;display:block}
.port-th:hover{border-color:var(--ink3)}
.port-th.on{border-color:var(--amber);box-shadow:0 0 0 2px rgba(245,166,35,.32)}
.port-stage{position:relative;flex:1;min-width:0;height:var(--stageH);
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  background:var(--paper2);border:1px solid var(--line);
  border-radius:var(--r);box-shadow:none}
.port-stage img{max-width:100%;max-height:100%;object-fit:contain;display:block;animation:fade .22s}
.port-nav{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:54px;
  border:1px solid var(--line);background:rgba(255,255,255,.94);border-radius:var(--r-sm);
  font-family:inherit;font-size:20px;font-weight:700;line-height:1;color:var(--ink);cursor:pointer;
  transition:.14s}
.port-nav:hover{background:var(--ink);color:var(--amber);border-color:var(--ink)}
.port-nav.prev{left:10px} .port-nav.next{right:10px}
.port-cap{position:absolute;left:12px;bottom:12px;display:flex;align-items:center;gap:9px;
  background:var(--ink);border:1px solid var(--ink);border-radius:var(--r-xs);
  padding:5px 11px;font-size:12px;font-weight:600;color:rgba(255,255,255,.85);max-width:calc(100% - 130px)}
.port-cap .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.port-cap .ix{color:var(--amber);font-variant-numeric:tabular-nums;flex-shrink:0;font-weight:800}
.port-full{position:absolute;right:12px;bottom:12px;background:rgba(255,255,255,.94);
  border:1px solid var(--line);border-radius:var(--r-xs);padding:5px 11px;font-size:11.5px;font-weight:700;
  color:var(--ink2);text-decoration:none;cursor:pointer;transition:.14s}
.port-full:hover{background:var(--ink);color:var(--amber);border-color:var(--ink)}
.port-loading,.port-empty{text-align:center;padding:34px;color:var(--ink3);font-size:13px;font-weight:600}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media(max-width:640px){
  :root{
    --stageH:clamp(260px,52vh,420px);
    --thumbGap:6px;
    --thumbH:clamp(84px, calc((var(--stageH) - 4*var(--thumbGap)) / 4.5), 140px);
  }
  .port-stack{gap:8px}
  .port-nav{width:32px;height:46px;font-size:18px}
  .port-nav.prev{left:6px} .port-nav.next{right:6px}
  .port-cap{left:8px;bottom:8px;font-size:11px;padding:4px 9px;max-width:calc(100% - 100px)}
  .port-full{right:8px;bottom:8px;font-size:11px;padding:4px 9px}
}

/* WORK ORDER — "떨어진 상자 8개"가 아니라 하나로 이어진 공정 스트립.
   칸 수는 데이터(STEPS / commission.json)에 따라 변하므로 개수에 의존하는 규칙을 쓰지 않는다.
   → 갭 1px 자체를 헤어라인으로 쓰고(테두리 대신), 진행 방향은 셰브론으로만 표시. */
.wo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:rgba(255,255,255,.13);
  border:1px solid var(--ink);border-radius:var(--r-sm);overflow:hidden;counter-reset:wo}
.wo-cell{background:linear-gradient(var(--amber),var(--amber)) 14px 0/16px 2px no-repeat, var(--ink);
  color:#fff;padding:17px 14px 15px;text-align:left;position:relative;counter-increment:wo}
.wo-cell.last{background:linear-gradient(rgba(23,23,26,.5),rgba(23,23,26,.5)) 14px 0/16px 2px no-repeat, var(--amber)}
/* 비어 보이던 검은 면을 채우는 고스트 번호. 텍스트가 아니라 CSS 카운터라 JS 손 안 댐 */
.wo-cell::before{content:counter(wo,decimal-leading-zero);position:absolute;right:10px;bottom:1px;
  font-family:var(--disp);font-size:46px;line-height:.8;color:rgba(255,255,255,.07);pointer-events:none}
.wo-cell.last::before{color:rgba(23,23,26,.15)}
/* 진행 방향 셰브론 — 칸 사이 헤어라인 위에 얹는다. 줄 끝에서는 숨김 */
.wo-cell::after{content:'';position:absolute;right:-4px;top:50%;width:6px;height:6px;
  transform:translateY(-50%) rotate(45deg);z-index:2;
  border-top:1px solid rgba(245,166,35,.6);border-right:1px solid rgba(245,166,35,.6)}
.wo-cell:nth-child(4n)::after,.wo-cell:last-child::after{display:none}
.wo-num{position:relative;z-index:1;font-family:var(--cond);font-size:11.5px;font-weight:600;letter-spacing:.2em;color:var(--amber);margin-bottom:7px}
.wo-cell.last .wo-num{color:rgba(23,23,26,.66)}
.wo-name{position:relative;z-index:1;font-size:15px;font-weight:800;color:#fff;line-height:1.3;letter-spacing:-.01em}
.wo-cell.last .wo-name{color:var(--ink)}
.wo-sub{position:relative;z-index:1;font-size:11px;color:rgba(255,255,255,.48);margin-top:4px}
.wo-cell.last .wo-sub{color:rgba(23,23,26,.62)}

/* PRICE form */
.fgroup{margin-bottom:26px;padding-bottom:26px;border-bottom:1px solid var(--line2)}
.fgroup:last-child{margin-bottom:0;padding-bottom:0;border-bottom:none}
/* mergeUp 섹션 = 앞 그룹에 딸린 하위 블록.
   섹션 타입이 서로 달라(radio vs expr) 한 섹션으로는 못 합치므로,
   구분선을 지우고 들여써서 "위 항목에 포함된 것"으로 읽히게 한다. */
.fgroup:has(+ .fgroup.merged){padding-bottom:18px;margin-bottom:0;border-bottom:none}
.fgroup.merged{padding-left:15px;border-left:2px solid var(--amber-l)}
.fgroup.merged .fgroup-head{margin-bottom:11px}
.fgroup.merged .fgroup-title{font-size:12.5px;font-weight:700;color:var(--ink2)}
.fgroup-head{display:flex;align-items:center;gap:8px;margin-bottom:13px;flex-wrap:wrap}
.fgroup-title{font-size:14px;font-weight:900;color:var(--ink);letter-spacing:-.005em}
.fgroup-tag{font-family:var(--cond);font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;padding:2px 9px;border-radius:var(--r-xs)}
.fgroup-tag.req{background:var(--ink);color:#fff}
.fgroup-tag.free{background:var(--amber);color:var(--ink)}
.fgroup-note{font-size:12.5px;white-space:pre-line;color:var(--ink2);background:var(--amber-pl);border:1px solid var(--amber-l);border-left:3px solid var(--amber);border-radius:var(--r-xs);padding:10px 13px;margin-bottom:11px;line-height:1.65;font-weight:500}
.fgroup-hint{font-size:12px;white-space:pre-line;line-height:1.7;color:var(--amber-ink);margin-top:10px;font-weight:700}
.opt-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:8px}
.opt-card{position:relative;background:var(--white);border:1px solid var(--line);border-radius:var(--r-sm);padding:15px 16px;cursor:pointer;transition:.15s;user-select:none}
.opt-card:hover{border-color:var(--ink3)}
.opt-card.sel{border-color:var(--ink);background:var(--paper);box-shadow:inset 3px 0 0 var(--amber)}
.opt-card.sel::after{content:'✓';position:absolute;top:9px;right:10px;width:18px;height:18px;border-radius:50%;background:var(--amber);color:var(--ink);font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center}

.qty-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 14px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--white);transition:.14s}

.qty-i-n{font-size:13px;font-weight:600;color:var(--ink)}
.qty-i-p{font-size:12px;font-weight:800;color:var(--ink2);margin-top:3px;font-variant-numeric:tabular-nums}

.qc-btn{width:32px;height:32px;border:none;background:var(--paper2);font-size:16px;font-weight:700;cursor:pointer;color:var(--ink);display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;transition:.14s}
.qc-btn:hover{background:var(--ink);color:var(--amber)}

.qc-sel{flex-shrink:0;padding:8px 11px;border:1px solid var(--line);border-radius:var(--r-sm);font-family:inherit;font-size:13px;font-weight:700;color:var(--ink);background:var(--white);cursor:pointer}
.qc-sel:hover{border-color:var(--ink3)}
.qc-num{width:36px;text-align:center;font-size:14px;font-weight:800;color:var(--ink);border-left:1px solid var(--line);border-right:1px solid var(--line);height:32px;display:flex;align-items:center;justify-content:center;user-select:none;font-variant-numeric:tabular-nums}

/* sub card (message / apply) */
.subcard{background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;margin-top:14px}
.form-2col>div>.subcard:first-child{margin-top:0}
.subcard-lbl{font-size:13px;font-weight:900;color:var(--ink);margin-bottom:13px;display:flex;align-items:center;gap:6px;padding-bottom:10px;border-bottom:1px solid var(--line2)}
.ta,.inp{width:100%;border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 13px;font-family:inherit;font-size:13px;color:var(--ink);background:var(--paper);outline:none;transition:border-color .15s,box-shadow .15s,background .15s;line-height:1.7}
.ta{min-height:88px;resize:vertical}
.ta:focus,.inp:focus{border-color:var(--ink);background:var(--white);box-shadow:0 0 0 2px rgba(245,166,35,.28)}
.aq-fill{margin-bottom:14px}
.aq-fill:last-child{margin-bottom:0}
.aq-fill-lbl{font-size:12px;font-weight:700;color:var(--ink);margin-bottom:6px;display:flex;align-items:flex-start;gap:7px;line-height:1.55}
.aq-fill-num{flex-shrink:0;width:18px;height:18px;border-radius:var(--r-xs);background:var(--ink);color:var(--amber);font-family:var(--cond);font-size:12.5px;font-weight:600;display:flex;align-items:center;justify-content:center;margin-top:1px}
.field-hint{font-size:11px;color:var(--ink3);margin-top:6px;font-weight:500}

.preview-head{background:

.preview-body{padding:15px 17px;font-family:'Noto Sans KR',monospace;font-size:11.5px;line-height:1.85;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink);max-height:46vh;overflow-y:auto;background:var(--paper)}
.preview-total{padding:16px 18px;border-top:1px solid var(--line);background:var(--white);text-align:center}
.preview-total-lbl{font-family:var(--cond);font-size:12.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);margin-bottom:6px}
.preview-total-amt{font-family:var(--disp);font-weight:400;font-size:40px;color:var(--ink);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.005em}

.preview-total-cnt{font-size:11px;color:var(--ink3);font-weight:600}
.preview-copy{width:100%;padding:16px;border:none;background:var(--amber);color:var(--ink);font-family:inherit;font-size:14px;font-weight:900;cursor:pointer;transition:background .15s;letter-spacing:.01em}
.preview-copy:hover{background:var(--amber-h)}
.preview-reset{display:block;width:100%;padding:9px;border:none;border-top:1px solid var(--line);background:var(--white);color:var(--ink3);font-family:inherit;font-size:11px;font-weight:600;cursor:pointer;transition:color .14s}
.preview-reset:hover{color:var(--ink)}

.form-2col{display:grid;grid-template-columns:1fr 360px;gap:18px;align-items:start;margin-top:18px}

.foot{text-align:center;padding:30px 20px 46px;margin-top:6px;border-top:1px solid var(--line);color:var(--ink3);font-size:11px;font-weight:500;letter-spacing:.09em}

/* toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);z-index:9000;background:var(--ink);color:#fff;border-left:3px solid var(--amber);padding:12px 22px;border-radius:var(--r-sm);font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:all .3s;box-shadow:var(--sh-lg)}

var imgs=[],lbIdx=0;
function loadPortfolio(){
  fetch('https://api.github.com/repos/'+GH.user+'/'+GH.repo+'/contents/'+GH.folder)
    .then(function(r){if(!r.ok)throw new Error(r.status);return r.json();})
    .then(function(data){
      imgs=[];
      /* 경량화 이미지(make-thumbs.py 생성)를 먼저 쓰고, 없으면 원본으로 폴백한다.
         thumb=가로400(세로 레일) / view=가로1400(스테이지) / src=원본 */
      var BASE='https://'+GH.user+'.github.io/'+GH.repo+'/'+GH.folder+'/';
      (data||[]).forEach(function(f){if(f.type==='file'&&/\.(png|jpe?g|gif|webp)$/i.test(f.name)){
        var stem=f.name.replace(/\.[^.]+$/,'');
        imgs.push({src:BASE+encodeURIComponent(f.name),
                   view:BASE+'view/'+encodeURIComponent(stem)+'.webp',
                   thumb:BASE+'thumb/'+encodeURIComponent(stem)+'.webp',
                   cap:stem});
      }});
      if(DATA.portfolioOrder&&DATA.portfolioOrder.length){
        imgs.sort(function(a,b){var ia=DATA.portfolioOrder.indexOf(a.cap+'.png');
          // match by filename stem against order entries (strip extension in order list too)
          function idx(im){for(var k=0;k<DATA.portfolioOrder.length;k++){if(DATA.portfolioOrder[k].replace(/\.[^.]+$/,'')===im.cap)return k;}return 999;}
          return idx(a)-idx(b);});
      }
      document.getElementById('portLoading').style.display='none';
      if(!imgs.length){var e=document.getElementById('portEmpty');e.style.display='block';e.textContent=UI[lang].portEmpty;return;}
      var rail=document.getElementById('portRail'), rh='';
      imgs.forEach(function(im,i){
        rh+='<button class="port-th" type="button" onclick="pcShow('+i+')" aria-label="'+im.cap+'">'+
            '<img loading="lazy" src="'+im.thumb+'" alt="'+im.cap+'"></button>';
      });
      rail.innerHTML=rh;
      rail.querySelectorAll('.port-th img').forEach(function(el,i){ pvFallback(el,[imgs[i].src]); });
      document.getElementById('portWrap').style.display='block';
      pcShow(0);
    })
    .catch(function(){document.getElementById('portLoading').style.display='none';var e=document.getElementById('portEmpty');e.style.display='block';e.textContent=UI[lang].portErr;});
}
/* ── 뷰어: 세로 얼굴 레일 + 고정 스테이지 ──
   열고 닫는 개념이 없어 페이지가 절대 움직이지 않는다.
   position:fixed 를 전혀 쓰지 않으므로 아트머그 자동높이 iframe 임베드에서도 그대로 동작한다. */
/* 경량화 이미지가 아직 없으면 다음 후보(→원본)로 자동 교체 */
function pvFallback(el,alts){
  var q=alts.slice();
  el.onerror=function(){ var n=q.shift(); if(n){el.src=n;} else {el.onerror=null;} };
}
function pcShow(i){
  if(!imgs.length)return;
  lbIdx=(i+imgs.length)%imgs.length; var im=imgs[lbIdx];
  var el=document.getElementById('portImg');
  pvFallback(el,[im.src]); el.src=im.view; el.alt=im.cap;
  document.getElementById('portNm').textContent=im.cap;
  document.getElementById('portIx').textContent=(lbIdx+1)+' / '+imgs.length;
  document.getElementById('portFull').href=im.src;
  var rail=document.getElementById('portRail');
  var ths=rail.querySelectorAll('.port-th');
  for(var k=0;k<ths.length;k++)ths[k].classList.toggle('on',k===lbIdx);
  /* 선택된 얼굴을 레일 안에서만 스크롤해 보여준다(페이지는 건드리지 않음) */
  var t=ths[lbIdx]; if(!t)return;
  var top=t.offsetTop-rail.offsetTop, bot=top+t.offsetHeight;
  if(top<rail.scrollTop) rail.scrollTop=top;
  else if(bot>rail.scrollTop+rail.clientHeight) rail.scrollTop=bot-rail.clientHeight;
}
function pcNav(d){ pcShow(lbIdx+d); }
/* 스테이지 좌우 스와이프 */
(function(){
  var st=document.querySelector('.port-stage'); if(!st)return;
  var sx=0,sy=0;
  st.addEventListener('touchstart',function(e){sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
  st.addEventListener('touchend',function(e){
    var dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
    if(Math.abs(dx)>52&&Math.abs(dx)>Math.abs(dy)) pcNav(dx<0?1:-1);
  },{passive:true});
})();

function findItem(secId,itId){var s=DATA.sections.find(function(x){return x.id===secId;});return s.items.find(function(i){return i.id===itId;});}
function pickRadio(secId,itId){
  var sec=DATA.sections.find(function(s){return s.id===secId;});
  sec.items.forEach(function(it){var el=document.getElementById('oc-'+it.id);if(el)el.classList.remove('sel');});
  if(sel[secId]===itId){sel[secId]=null;}else{sel[secId]=itId;document.getElementById('oc-'+itId).classList.add('sel');}
  rebuild();
}
function togglePill(secId,itId){
  if(!sel[secId])sel[secId]={};
  var el=document.getElementById('pl-'+itId);
  if(sel[secId][itId]){delete sel[secId][itId];el.classList.remove('sel');}
  else{
    var sec=DATA.sections.find(function(s){return s.id===secId;});
    if(sec&&sec.type==='expr'){
      var max=sec.maxFree||5;
      if(Object.keys(sel[secId]).length>=max){ toast(lang==='ko'?('기본 제공 표정은 '+max+'개까지 무료예요'):('Up to '+max+' free expressions')); return; }
    }
    sel[secId][itId]=true;el.classList.add('sel');
  }
  rebuild();
}
function setQty(secId,itId,d){
  if(!sel[secId])sel[secId]={};
  var cur=(sel[secId][itId]||0)+d; if(cur<0)cur=0;
  setQtyVal(secId,itId,cur);
}
function setQtyVal(secId,itId,val){
  if(!sel[secId])sel[secId]={};
  val=parseInt(val,10)||0; if(val<0)val=0;
  if(val===0)delete sel[secId][itId]; else sel[secId][itId]=val;
  var it=findItem(secId,itId);
  var qn=document.getElementById('qn-'+itId); if(qn)qn.textContent=val;
  var qi=document.getElementById('qi-'+itId); if(qi)qi.classList.toggle('on',val>0);
  var qp=document.getElementById('qp-'+itId); if(qp)qp.textContent=won(it.p)+' '+UI[lang].won+(val>1?' × '+val+' = '+won(it.p*val):'');
  rebuild();
}

  rebuild();toast(UI[lang].resetDone);
}

/* ════════ build form text (DASHBOARD-COMPATIBLE, always Korean structure) ════════ */
function cleanLabel(s){return s.replace(/^[^\wㄱ-힣]+\s*/,'');}
function buildFormText(){
  var lines=['모무꼬 작가 · Live2D 의뢰 양식','━━━━━━━━━━━━━━━━━━━━━━━━━━━━',''];
  var total=0, any=false;
  DATA.sections.forEach(function(sec){
    if(sec.type==='radio'){
      if(!sel[sec.id])return; var it=findItem(sec.id,sel[sec.id]); if(!it)return;
      any=true;
      lines.push('▸ '+sec.koLabel); lines.push('  · '+it.ko); lines.push('    → '+won(it.p)+'원'); lines.push('');
      total+=it.p;
    } else if(sec.type==='pill'||sec.type==='qty'){
      if(!sel[sec.id])return; var ids=Object.keys(sel[sec.id]); if(!ids.length)return;
      any=true; lines.push('▸ '+sec.koLabel);
      ids.forEach(function(id){var it=findItem(sec.id,id);var q=sel[sec.id][id]||1;lines.push('  · '+it.ko+(q>1?' × '+q+'개':''));lines.push('    → '+won(it.p*q)+'원');total+=it.p*q;});
      lines.push('');
    } else if(sec.type==='expr'){
      if(!sel[sec.id])return; var ids=Object.keys(sel[sec.id]); if(!ids.length)return;
      var names=ids.map(function(id){return findItem(sec.id,id).ko;});
      lines.push('▸ '+sec.koLabel+' (무료)'); lines.push('  · '+names.join(', ')); lines.push('');
    }
  });
  lines.push('─────────────────────────────');
  lines.push('  합계 금액 : '+won(total)+'원');
  lines.push('─────────────────────────────');
  var msg=(document.getElementById('formMsg')||{}).value||'';
  if(msg.trim()){lines.push('');lines.push('✉ 작가님께 전할 말');lines.push('  '+msg.trim());}
  lines.push('');lines.push('[ 신청양식 ]');
  DATA.apply.forEach(function(q,i){
    var el=document.getElementById('aq_'+i); var v=el?el.value.trim():'';
    lines.push('▸ '+q.ko); lines.push('  '+(v||'(미입력)')); lines.push('');
  });
  var ref=(document.getElementById('fixedRef')||{}).value||'';
  var email=(document.getElementById('fixedEmail')||{}).value||'';
  if(ref.trim()||email.trim()){
    lines.push('[ 추가 정보 ]');
    if(ref.trim()){lines.push('▸ 레퍼런스 링크');lines.push('  레퍼런스: '+ref.trim());lines.push('');}
    if(email.trim()){lines.push('▸ 파일 수령 이메일');lines.push('  이메일: '+email.trim());lines.push('');}
  }
  lines.push('━━━━━━━━━━━━━━━━━━━━━━━━━━━━');
  lines.push('양식이 완성되면 복사해서 작가님께 전달해주세요 :)');
  return {text:lines.join('\n'), total:total, any:any};
}
function countSel(){
  var c=0;
  DATA.sections.forEach(function(sec){
    if(sec.type==='radio'&&sel[sec.id])c++;
    else if(sel[sec.id])c+=Object.keys(sel[sec.id]).length;
  });
  return c;
}
function mmPostMeta(total){
  try{
    if(window.self===window.top) return;
    var secs=[]; document.querySelectorAll('.section').forEach(function(s){var t=s.querySelector('.sec-title');var lab=t?t.textContent.trim():'';if(lab)secs.push({label:lab, y:s.getBoundingClientRect().top+(window.pageYOffset||document.documentElement.scrollTop||0)});});
    parent.postMessage({src:'momuuko-artmug', sections:secs, total:(total||0)}, '*');
  }catch(e){}
}
function rebuild(){
  var r=buildFormText();
  document.getElementById('totalAmt').textContent=won(r.total);
  var sm=document.getElementById('smTotal'); if(sm)sm.textContent=won(r.total)+' '+UI[lang].won;
  mmPostMeta(r.total);
  var c=countSel();
  document.getElementById('totalCnt').textContent=c?UI[lang].cnt(c):'';
  var body=document.getElementById('previewBody');
  if(!r.any){body.textContent=UI[lang].emptyPreview;body.style.color='var(--ink3)';}
  else{body.textContent=r.text;body.style.color='var(--ink)';}
}
function copyForm(){
  var r=buildFormText();
  if(!r.any){toast(UI[lang].needSel);return;}
  navigator.clipboard.writeText(r.text).then(function(){toast(UI[lang].copyDone);}).catch(function(){
    var ta=document.createElement('textarea');ta.value=r.text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast(UI[lang].copyDone);
  });
}

/* ════════ notice accordion ════════ */
function toggleNt(i){
  var nt=document.getElementById('nt-'+i),a=document.getElementById('nta-'+i);
  if(nt.classList.contains('open')){nt.classList.remove('open');a.style.maxHeight=0;}
  else{nt.classList.add('open');a.style.maxHeight=a.scrollHeight+40+'px';}

/* ════════ toast ════════ */
var toastT;
function toast(msg){var el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){el.classList.remove('show');},2200);}

/* ════════ init ════════ */
/* 데이터는 data/commission.json 에서 불러옴 (스튜디오 편집탭에서 수정).
   불러오기 실패 시 위에 하드코딩된 DATA를 그대로 사용(fallback). */
function applyData(j){
  if(!j)return;
  if(j.hero)DATA.hero=j.hero;
  if(j.steps&&j.steps.length)STEPS=j.steps;
  if(j.chips)DATA.chips=j.chips;
  if(j.slots)DATA.slots=j.slots;
  if(j.sections)DATA.sections=j.sections;
  if(j.notice)DATA.notice=j.notice;
  if(j.apply)DATA.apply=j.apply;
  if(j.portfolioOrder)DATA.portfolioOrder=j.portfolioOrder;
}
function init(){
  fetch('data/commission.json?t='+Date.now())
    .then(function(r){return r.ok?r.json():null;})
    .then(function(j){applyData(j);})
    .catch(function(){})
    .then(function(){ setLang('ko'); loadPortfolio(); });
}
init();
document.addEventListener('keydown',function(e){
  if(!imgs.length)return;
  var t=e.target, tag=t&&t.tagName;
  if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT')return;   // 입력 중엔 무시
  if(e.key==='ArrowRight')pcNav(1); else if(e.key==='ArrowLeft')pcNav(-1);
});

/* ── iframe 자동 높이: 부모(artmug.kr)에 내 높이 전달 ── */
(function(){
  var _lastH=0;
  /* 실제 콘텐츠 바닥 높이 — body min-height 스트레치/position:fixed·absolute 요소에 영향 안 받음 → 무한루프 차단 */
  function contentHeight(){
    var max=0, kids=document.body.children;
    for(var i=0;i<kids.length;i++){
      var el=kids[i], pos='';
      try{ pos=getComputedStyle(el).position; }catch(e){}
      if(pos==='fixed'||pos==='absolute') continue;
      var b=el.getBoundingClientRect().bottom + (window.pageYOffset||document.documentElement.scrollTop||0);
      if(b>max) max=b;
    }
    return Math.ceil(max)||document.body.scrollHeight;
  }
  function postH(){
    try{
      var h=contentHeight();
      if(Math.abs(h-_lastH)<4) return; _lastH=h;
      parent.postMessage({src:'momuuko-artmug', mmHeight:h}, '*');
    }catch(e){}
  }
  if(window.self!==window.top){ try{ document.body.style.minHeight='0'; document.documentElement.style.minHeight='0'; }catch(e){} } // 보조: 스트레치 제거
  function tick(){ postH(); try{ if(window.mmPostMeta){ var el=document.getElementById('totalAmt'); var t=el?parseInt((el.textContent||'0').replace(/[^\d]/g,''),10)||0:0; mmPostMeta(t); } }catch(e){} }
  window.addEventListener('load', tick);
  window.addEventListener('resize', tick);
  try{ new MutationObserver(postH).observe(document.body, {childList:true,subtree:true,attributes:true,characterData:true}); }catch(e){}
  setInterval(tick, 1000);
  tick();
})();

/* ── 떠있는 사이드바 (합계 + 섹션 이동) ── */
(function(){
  var EMB = window.self!==window.top;
  function navTo(sec){
    if(!sec) return;
    if(!EMB){ try{ sec.scrollIntoView({behavior:'smooth',block:'start'}); }catch(e){ sec.scrollIntoView(); } }
    else { try{ var y=sec.getBoundingClientRect().top+(window.pageYOffset||document.documentElement.scrollTop||0); parent.postMessage({src:'momuuko-artmug', scrollToY:y}, '*'); }catch(e){} }
  }
  function buildSideNav(){
    var nav=document.getElementById('smNav'); if(!nav) return;
    var secs=document.querySelectorAll('.section'); var h='';
    secs.forEach(function(s,i){ var t=s.querySelector('.sec-title'); var lab=t?t.textContent.trim():''; if(lab) h+='<div class="sm-link" data-i="'+i+'">'+lab+'</div>'; });
    nav.innerHTML=h;
    nav.querySelectorAll('.sm-link').forEach(function(a){ a.addEventListener('click',function(){ navTo(secs[+a.dataset.i]); }); });
  }
  function initSide(){
    window.buildSideNav=buildSideNav;
    buildSideNav();
    var sm=document.getElementById('sideMini');
    if(typeof rebuild==='function') rebuild();              // 합계 동기화
    if(!EMB){ if(sm) sm.classList.add('show'); }            // 단독 페이지: 고정 표시
    else {                                                  // 임베드: 부모 스크롤 동기화 시 표시
      window.addEventListener('message', function(e){
        var d=e.data; if(!d||d.src!=='momuuko-parent'||typeof d.vTop!=='number') return;
        if(!sm) return; sm.style.position='absolute'; sm.style.top=(d.vTop+16)+'px'; sm.classList.add('show');
      });
    }
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', initSide); else initSide();
})();
</script>
<div id="sideMini">
  <div class="sm-tl">현재 합계</div>
  <div class="sm-amt" id="smTotal">0 원</div>
  <div class="sm-nav" id="smNav"></div>
</div>
