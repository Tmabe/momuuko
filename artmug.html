<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>모무꼬 · 커미션 안내 ✦ Momukko Live2D</title>
<meta name="description" content="Live2D 일러스트레이터 모무꼬 · 커미션 및 작업 안내">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700;900&family=Noto+Sans+KR:wght@300;400;500;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ═══ 포트폴리오 사이트 디자인 언어 차용 — 다크 · 골드 · 에디토리얼 ═══ */
:root{
  /* 포인트: 하늘색(메인 --Y/--Yhi) + 핑크(강조 --pink) */
  --Y:#1E88CC; --Yhi:#3BA5E8; --Y2:#A9D7F2;
  --pink:#FF7FB8; --pink-d:#E85A9E;
  --bg:#F4F7FA; --bg2:#FFFFFF; --bg3:#EBF0F5; --panel:#FFFFFF;
  --line:rgba(0,0,0,.11); --line2:rgba(0,0,0,.20);
  --ink:#16202B; --ink2:#3f4d59; --ink3:#6b7884;
  --mono:'DM Mono',monospace; --cond:'Barlow Condensed',sans-serif; --display:'Bebas Neue',sans-serif;
  --r:6px; --r-sm:5px; --r-xs:4px;
  --sh:0 2px 12px rgba(60,52,30,.07);
  --sh-md:0 8px 26px rgba(60,52,30,.10);
  --sh-lg:0 18px 46px rgba(40,34,16,.16);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  font-family:'Noto Sans KR',sans-serif; font-weight:400;
  color:var(--ink); line-height:1.6;
  background:
    radial-gradient(900px 520px at 100% -5%, rgba(59,165,232,.10) 0%, transparent 55%),
    radial-gradient(720px 460px at 0% 0%, rgba(255,127,184,.07) 0%, transparent 50%),
    linear-gradient(180deg,#FAFCFE 0%,#F1F5F9 100%);
  min-height:100vh; overflow-x:hidden;
}
.wrap{max-width:980px;margin:0 auto;padding:0 22px;position:relative;z-index:1}
.section{margin-bottom:46px}

/* lang toggle */
.lang-toggle{position:fixed;top:16px;right:16px;z-index:200;display:flex;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;box-shadow:var(--sh-md)}
.lang-toggle button{border:none;background:transparent;color:var(--ink3);font-family:var(--cond);font-size:13px;font-weight:700;padding:8px 14px;cursor:pointer;transition:all .15s;letter-spacing:.08em}
.lang-toggle button.on{background:var(--Yhi);color:#1A1A22}

/* section heading — 모노 라벨 + 콘덴스드 타이틀 */
.sec-head{display:flex;align-items:center;gap:13px;margin-bottom:18px}
.sec-titles{display:flex;flex-direction:column;gap:2px}
.sec-jp{font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.25em;color:var(--Y);opacity:.85}
.sec-title{font-family:var(--cond);font-size:24px;font-weight:900;letter-spacing:.02em;color:var(--ink);text-transform:uppercase;line-height:1}
.sec-line{flex:1;height:1px;background:linear-gradient(90deg,var(--line2),transparent)}
.sec-badge{font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.12em;padding:3px 10px;border-radius:var(--r-xs);background:transparent;color:var(--Y);border:1px solid var(--Y2)}

/* HERO */
.hero{padding:70px 22px 30px;max-width:980px;margin:0 auto}
.hero-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:42px 40px 34px;box-shadow:var(--sh-md);position:relative;overflow:hidden}
.hero-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--Y)}
.hero-card::after{content:'';position:absolute;top:16px;right:16px;width:18px;height:18px;border-top:2px solid var(--Y);border-right:2px solid var(--Y);opacity:.6}
.hero-badge{display:inline-flex;align-items:center;gap:6px;background:transparent;color:var(--Y);border:1px solid var(--Y2);font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;padding:5px 13px;border-radius:var(--r-xs);margin-bottom:18px}
.hero h1{font-family:var(--display);font-size:clamp(38px,7vw,68px);line-height:.95;letter-spacing:.02em;color:var(--ink)}
.hero h1 .g{color:var(--ink)}
.hero h1 .g:nth-of-type(2){color:var(--pink-d)}
.hero h1 .jp{display:block;font-family:var(--mono);font-size:.2em;font-weight:400;letter-spacing:.3em;color:var(--ink3);margin-top:14px}
.hero-sub{font-size:13.5px;color:var(--ink2);margin-top:16px;line-height:1.9;font-weight:400}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:22px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 13px;background:var(--bg3);border:1px solid var(--line);border-radius:30px;font-family:var(--mono);font-size:11.5px;font-weight:500;color:var(--ink2);letter-spacing:.02em}
.chip b{color:var(--Y);font-weight:500}
.chip.pk b{color:var(--pink-d)}
.chip .dotlive{width:6px;height:6px;border-radius:50%;background:var(--pink-d);box-shadow:0 0 0 0 rgba(232,90,158,.5);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(232,90,158,.5)}70%{box-shadow:0 0 0 7px rgba(232,90,158,0)}100%{box-shadow:0 0 0 0 rgba(232,90,158,0)}}
.hero-cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:13px 24px;border-radius:var(--r-sm);border:1px solid transparent;font-family:var(--cond);font-size:15px;font-weight:700;cursor:pointer;transition:all .16s;text-decoration:none;letter-spacing:.06em;text-transform:uppercase}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(0)}
.btn-main{background:var(--Yhi);color:#1A1A22;box-shadow:0 6px 20px rgba(59,165,232,.22)}
.btn-main:hover{box-shadow:0 12px 28px rgba(59,165,232,.34)}
.btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--line2)}
.btn-ghost:hover{border-color:var(--Y);color:var(--Y)}

/* CARD */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:24px 26px;box-shadow:var(--sh)}

/* SLOTS */
.slot-row{display:flex;align-items:center;gap:14px;padding:13px 2px;border-bottom:1px solid var(--line)}
.slot-row:last-child{border-bottom:none}
.slot-month{font-family:var(--cond);font-size:17px;font-weight:700;width:74px;flex-shrink:0;color:var(--ink);letter-spacing:.03em}
.slot-dots{display:flex;gap:6px;flex:1;flex-wrap:wrap}
.dot{width:28px;height:28px;border-radius:var(--r-xs);border:1.5px solid var(--line2);background:transparent;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--ink3)}
.dot.filled{background:var(--Yhi);border-color:var(--Yhi);color:#1A1A22}
.dot.open{color:var(--Y)}
.slot-tag{font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.1em;padding:4px 11px;border-radius:30px;flex-shrink:0;border:1px solid;text-transform:uppercase}
.slot-tag.open{background:transparent;color:var(--Y);border-color:var(--Y2)}
.slot-tag.full{background:transparent;color:var(--ink3);border-color:var(--line2)}

/* PORTFOLIO */
.port-wrap{display:none}
.port-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.port-item{position:relative;aspect-ratio:3/4;border-radius:var(--r-sm);overflow:hidden;cursor:pointer;border:1px solid var(--line);box-shadow:var(--sh);background:var(--bg3);transition:transform .4s cubic-bezier(.22,1,.36,1),box-shadow .4s,border-color .4s}
.port-item:hover{transform:translateY(-6px);box-shadow:var(--sh-md);border-color:rgba(59,165,232,.4)}
.port-item img{width:100%;height:100%;object-fit:cover;object-position:50% 16%;display:block;filter:saturate(.92);transition:transform .6s cubic-bezier(.22,1,.36,1),filter .4s}
.port-item:hover img{transform:scale(1.06);filter:saturate(1.08)}
.port-item .cap{position:absolute;left:0;right:0;bottom:0;padding:16px 10px 8px;font-family:var(--cond);font-size:13px;font-weight:700;letter-spacing:.04em;color:#fff;text-transform:uppercase;background:linear-gradient(to top,rgba(10,10,14,.9),transparent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.port-loading,.port-empty{text-align:center;padding:34px;color:var(--ink3);font-family:var(--mono);font-size:11px;letter-spacing:.1em}
.lb{display:none;position:fixed;inset:0;z-index:6000;background:rgba(15,15,20,.95);backdrop-filter:blur(8px);align-items:center;justify-content:center;padding:24px;flex-direction:column;gap:14px}
.lb.open{display:flex;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.lb img{max-width:92vw;max-height:78vh;border-radius:8px;box-shadow:0 24px 80px rgba(0,0,0,.6)}
.lb-cap{color:var(--ink);font-family:var(--cond);font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase}
.lb-nav{display:flex;gap:12px}
.lb-nav button,.lb-x{background:rgba(255,255,255,.08);border:1px solid var(--line2);color:#fff;border-radius:var(--r-sm);padding:9px 20px;font-family:var(--cond);font-weight:700;font-size:14px;cursor:pointer;transition:all .15s;text-transform:uppercase;letter-spacing:.05em}
.lb-nav button:hover,.lb-x:hover{background:var(--Yhi);color:#1A1A22;border-color:var(--Y)}
.lb-x{position:absolute;top:20px;right:20px;width:44px;height:44px;border-radius:var(--r-sm);padding:0;font-size:18px}

/* PRICE form */
.fgroup{margin-bottom:24px}
.fgroup:last-child{margin-bottom:0}
.fgroup-head{display:flex;align-items:center;gap:9px;margin-bottom:12px;flex-wrap:wrap}
.fgroup-title{font-family:var(--cond);font-size:17px;font-weight:700;color:var(--ink);letter-spacing:.03em}
.fgroup-tag{font-family:var(--mono);font-size:9px;font-weight:500;letter-spacing:.1em;padding:3px 8px;border-radius:var(--r-xs);text-transform:uppercase}
.fgroup-tag.req{background:var(--pink-d);color:#fff}
.fgroup-tag.free{background:transparent;color:var(--Y);border:1px solid var(--Y2)}
.fgroup-note{font-size:12px;color:var(--ink2);background:var(--bg3);border:1px solid var(--line);border-left:3px solid var(--Y);border-radius:var(--r-xs);padding:10px 13px;margin-bottom:11px;line-height:1.6;font-weight:400}
.fgroup-hint{font-family:var(--mono);font-size:11px;color:var(--Y);margin-top:10px;letter-spacing:.03em}
.opt-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:9px}
.opt-card{position:relative;background:var(--bg3);border:1px solid var(--line);border-radius:var(--r-sm);padding:15px 16px;cursor:pointer;transition:all .16s;user-select:none}
.opt-card:hover{border-color:var(--line2);background:#FAF8F1}
.opt-card.sel{border-color:var(--Y);background:rgba(59,165,232,.07);box-shadow:inset 0 0 0 1px var(--Y)}
.opt-card.sel::after{content:'✓';position:absolute;top:9px;right:11px;width:20px;height:20px;border-radius:var(--r-xs);background:var(--Yhi);color:#1A1A22;font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center}
.opt-card .n{font-size:13px;font-weight:500;line-height:1.5;color:var(--ink);padding-right:18px}
.opt-card .p{font-family:var(--cond);font-size:19px;font-weight:700;color:var(--Y);margin-top:8px;letter-spacing:.02em}
.opt-card .sub{display:inline-block;font-family:var(--mono);font-size:10px;font-weight:500;color:var(--Y);background:transparent;border:1px solid var(--Y2);border-radius:var(--r-xs);padding:2px 8px;margin-top:7px;letter-spacing:.03em}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:30px;border:1px solid var(--line2);background:var(--bg3);font-size:12.5px;font-weight:500;color:var(--ink2);cursor:pointer;transition:all .15s;user-select:none}
.pill:hover{border-color:var(--ink3);color:var(--ink)}
.pill.sel{background:rgba(59,165,232,.1);border-color:var(--Y);color:var(--Y)}
.pill .pp{font-family:var(--mono);font-weight:500;color:var(--Y)}
/* qty (수량 선택) */
.qty-list{display:flex;flex-direction:column;gap:7px}
.qty-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 14px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--bg3);transition:all .15s}
.qty-item.on{border-color:var(--Y);background:rgba(59,165,232,.07)}
.qty-i-n{font-size:13px;font-weight:500;color:var(--ink)}
.qty-i-p{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--Y);margin-top:3px}
.qty-ctrl{display:flex;align-items:center;border:1px solid var(--line2);border-radius:var(--r-sm);overflow:hidden;flex-shrink:0;background:var(--bg)}
.qc-btn{width:32px;height:32px;border:none;background:transparent;font-size:17px;font-weight:700;cursor:pointer;color:var(--Y);display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}
.qc-btn:hover{background:rgba(59,165,232,.12)}
.qc-btn.minus{color:var(--ink3)}
.qc-num{width:34px;text-align:center;font-family:var(--mono);font-size:14px;font-weight:500;color:var(--ink);border-left:1px solid var(--line2);border-right:1px solid var(--line2);height:32px;display:flex;align-items:center;justify-content:center;user-select:none}

/* sub card (message / apply) */
.subcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;margin-top:16px}
.subcard-lbl{font-family:var(--cond);font-size:15px;font-weight:700;color:var(--ink);margin-bottom:12px;display:flex;align-items:center;gap:7px;letter-spacing:.03em}
.ta,.inp{width:100%;border:1px solid var(--line2);border-radius:var(--r-sm);padding:11px 13px;font-family:'Noto Sans KR',sans-serif;font-size:13px;color:var(--ink);background:var(--bg);outline:none;transition:border-color .15s;line-height:1.7}
.ta{min-height:88px;resize:vertical}
.ta:focus,.inp:focus{border-color:var(--Y)}
.ta::placeholder,.inp::placeholder{color:var(--ink3)}
.aq-fill{margin-bottom:12px}
.aq-fill:last-child{margin-bottom:0}
.aq-fill-lbl{font-size:12px;font-weight:500;color:var(--ink);margin-bottom:6px;display:flex;align-items:flex-start;gap:7px}
.aq-fill-num{flex-shrink:0;width:18px;height:18px;border-radius:var(--r-xs);background:var(--Yhi);color:#1A1A22;font-family:var(--mono);font-size:10px;font-weight:500;display:flex;align-items:center;justify-content:center;margin-top:1px}
.field-hint{font-family:var(--mono);font-size:11px;color:var(--ink3);margin-top:6px}

/* work order steps */
.wo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.wo-cell{background:var(--bg3);border:1px solid var(--line);border-radius:var(--r-sm);padding:13px 8px;text-align:center;position:relative;overflow:hidden}
.wo-cell.last{border-color:var(--Y2);background:rgba(59,165,232,.06)}
.wo-num{font-family:var(--mono);font-size:9px;font-weight:500;letter-spacing:.12em;color:var(--ink3);margin-bottom:4px}
.wo-cell.last .wo-num{color:var(--Y)}
.wo-name{font-family:var(--cond);font-size:14px;font-weight:700;color:var(--ink);line-height:1.2;letter-spacing:.02em}
.wo-sub{font-size:10px;color:var(--ink3);margin-top:2px;font-weight:400}

/* live preview */
.preview-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh-md);position:sticky;top:16px}
.preview-head{background:var(--bg3);border-bottom:1px solid var(--line);padding:13px 16px;display:flex;align-items:center;justify-content:space-between}
.preview-head-t{font-family:var(--cond);font-size:14px;font-weight:700;color:var(--ink);letter-spacing:.04em;text-transform:uppercase}
.preview-head-b{font-family:var(--mono);font-size:9px;font-weight:500;letter-spacing:.14em;color:#1A1A22;background:var(--Yhi);padding:3px 8px;border-radius:var(--r-xs);animation:pulse2 2.4s infinite}
@keyframes pulse2{0%,100%{opacity:1}50%{opacity:.55}}
.preview-body{padding:15px 16px;font-family:var(--mono);font-size:11px;line-height:1.9;white-space:pre-wrap;color:var(--ink2);max-height:46vh;overflow-y:auto;background:var(--bg)}
.preview-total{padding:15px 18px;border-top:1px solid var(--line);background:var(--bg3);text-align:center}
.preview-total-lbl{font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);margin-bottom:5px}
.preview-total-amt{font-family:var(--display);font-size:42px;font-weight:400;color:var(--pink-d);line-height:1;letter-spacing:.03em}
.preview-total-won{font-family:var(--cond);font-size:16px;font-weight:700;color:var(--ink2)}
.preview-total-cnt{font-family:var(--mono);font-size:11px;color:var(--ink3)}
.preview-copy{width:100%;padding:16px;border:none;background:var(--Yhi);color:#1A1A22;font-family:var(--cond);font-size:15px;font-weight:700;cursor:pointer;transition:filter .15s;letter-spacing:.06em;text-transform:uppercase}
.preview-copy:hover{filter:brightness(1.08)}
.preview-reset{display:block;width:100%;padding:9px;border:none;border-top:1px solid var(--line);background:var(--panel);color:var(--ink3);font-family:var(--mono);font-size:11px;cursor:pointer;letter-spacing:.05em}
.preview-reset:hover{color:var(--Y)}

.form-2col{display:grid;grid-template-columns:1fr 360px;gap:18px;align-items:start;margin-top:18px}
@media(max-width:860px){.form-2col{grid-template-columns:1fr}.preview-card{position:static}}

/* NOTICE accordion */
.notice-list{display:flex;flex-direction:column;gap:8px}
.nt{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;transition:border-color .15s}
.nt.open{border-color:var(--Y2)}
.nt-q{display:flex;align-items:center;gap:11px;padding:14px 16px;cursor:pointer;font-family:var(--cond);font-size:15px;font-weight:700;color:var(--ink);user-select:none;letter-spacing:.03em}
.nt-ico{flex-shrink:0;font-size:15px}
.nt-arr{margin-left:auto;color:var(--Y);font-size:12px;transition:transform .2s;flex-shrink:0}
.nt.open .nt-arr{transform:rotate(180deg)}
.nt-a{max-height:0;overflow:hidden;transition:max-height .25s ease;font-size:13px;line-height:1.9;color:var(--ink2);font-weight:400}
.nt-a-inner{padding:0 16px 16px;white-space:pre-line}

.foot{text-align:center;padding:30px 20px 44px;color:var(--ink3);font-family:var(--mono);font-size:11px;letter-spacing:.08em}

/* toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);z-index:9000;background:var(--Yhi);color:#1A1A22;padding:13px 24px;border-radius:var(--r-sm);font-family:var(--cond);font-size:14px;font-weight:700;letter-spacing:.04em;opacity:0;pointer-events:none;transition:all .3s;box-shadow:var(--sh-lg)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:760px){
  .wrap{padding:0 16px}
  .hero{padding:54px 16px 22px}
  .hero-card{padding:30px 24px 26px}
  .opt-cards{grid-template-columns:1fr 1fr}
  .wo-grid{grid-template-columns:1fr 1fr}
}
@media(max-width:430px){
  .opt-cards{grid-template-columns:1fr}
  .port-grid{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>

<div class="lang-toggle">
  <button id="langKo" class="on" onclick="setLang('ko')">한국어</button>
  <button id="langEn" onclick="setLang('en')">EN</button>
</div>

<!-- HERO -->
<header class="hero">
  <div class="hero-card">
    <div class="hero-badge" id="heroBadge"></div>
    <h1><span class="g">Momukko</span><br><span class="g">Live2D Illustration</span><span class="jp">コミッション ご案内</span></h1>
    <p class="hero-sub" id="heroSub"></p>
    <div class="chips" id="chips"></div>
    <div class="hero-cta">
      <a class="btn btn-main" id="ctaPrice" href="#price"></a>
      <a class="btn btn-ghost" id="ctaPort" href="#port"></a>
    </div>
  </div>
</header>

<div class="wrap">

  <!-- SLOTS -->
  <section class="section">
    <div class="sec-head">
      <div class="sec-titles"><div class="sec-jp">受付状況</div><div class="sec-title" id="t-slots"></div></div>
      <div class="sec-line"></div><span class="sec-badge" id="b-slots"></span>
    </div>
    <div class="card" id="slotCard"></div>

  STEPS.forEach(function(s){
    var name=lang==='ko'?s.ko:s.en, sub=lang==='ko'?s.koSub:s.enSub;
    h+='<div class="wo-cell'+(s.last?' last':'')+'"><div class="wo-num">'+s.num+'</div><div class="wo-name">'+name+'</div>'+(sub?'<div class="wo-sub">'+sub+'</div>':'')+'</div>';
  });
  document.getElementById('woGrid').innerHTML=h;
}
function renderForm(){
  var h='';
  DATA.sections.forEach(function(sec){
    h+='<div class="fgroup"><div class="fgroup-head"><span class="fgroup-title">'+stripIco(sec[lang])+'</span>';
    var tag=lang==='ko'?sec.tagKo:sec.tagEn; if(tag)h+='<span class="fgroup-tag '+sec.tagCls+'">'+tag+'</span>';
    h+='</div>';
    var note=lang==='ko'?sec.noteKo:sec.noteEn; if(note)h+='<div class="fgroup-note">'+note+'</div>';
    if(sec.type==='radio'){
      h+='<div class="opt-cards">';
      sec.items.forEach(function(it){
        var sub=lang==='ko'?it.subKo:it.subEn;
        h+='<div class="opt-card'+(sel[sec.id]===it.id?' sel':'')+'" id="oc-'+it.id+'" onclick="pickRadio(\''+sec.id+'\',\''+it.id+'\')">'+
           '<div class="n">'+it[lang]+'</div><div class="p">'+won(it.p)+' '+UI[lang].won+'</div>'+(sub?'<span class="sub">'+sub+'</span>':'')+'</div>';
      });
      h+='</div>';
    } else if(sec.type==='qty'){ // 수량 선택 (개수 지정)
      h+='<div class="qty-list">';
      sec.items.forEach(function(it){
        var q=(sel[sec.id]&&sel[sec.id][it.id])||0;
        h+='<div class="qty-item'+(q>0?' on':'')+'" id="qi-'+it.id+'">'+
           '<div><div class="qty-i-n">'+it[lang]+'</div>'+
           '<div class="qty-i-p" id="qp-'+it.id+'">'+won(it.p)+' '+UI[lang].won+(q>1?' × '+q+' = '+won(it.p*q):'')+'</div></div>'+
           '<div class="qty-ctrl"><button class="qc-btn minus" onclick="setQty(\''+sec.id+'\',\''+it.id+'\',-1)">−</button>'+
           '<span class="qc-num" id="qn-'+it.id+'">'+q+'</span>'+
           '<button class="qc-btn" onclick="setQty(\''+sec.id+'\',\''+it.id+'\',1)">＋</button></div></div>';
      });
      h+='</div>';
    } else { // pill & expr both selectable multi
      h+='<div class="pills">';
      sec.items.forEach(function(it){
        var on=sel[sec.id]&&sel[sec.id][it.id];
        var price=sec.type==='expr'?'':' <span class="pp">+'+won(it.p)+'</span>';
        h+='<span class="pill'+(on?' sel':'')+'" id="pl-'+it.id+'" onclick="togglePill(\''+sec.id+'\',\''+it.id+'\')">'+it[lang]+price+'</span>';
      });
      h+='</div>';
    }
    var hint=lang==='ko'?sec.hintKo:sec.hintEn; if(hint)h+='<div class="fgroup-hint">'+hint+'</div>';
    h+='</div>';
  });
  document.getElementById('formGroups').innerHTML=h;
}
function renderApplyFill(){
  var h='';
  DATA.apply.forEach(function(q,i){
    var prev=document.getElementById('aq_'+i); var val=prev?prev.value:'';
    h+='<div class="aq-fill"><div class="aq-fill-lbl"><span class="aq-fill-num">'+(i+1)+'</span>'+q[lang]+'</div>'+
       '<textarea class="ta" id="aq_'+i+'" style="min-height:54px" oninput="rebuild()">'+val.replace(/</g,'&lt;')+'</textarea></div>';
  });
  document.getElementById('aqFill').innerHTML=h;
}
function renderNotice(){
  var h='';
  DATA.notice.forEach(function(n,i){
    h+='<div class="nt" id="nt-'+i+'"><div class="nt-q" onclick="toggleNt('+i+')">'+(lang==='ko'?n.qKo:n.qEn)+'<span class="nt-arr">▼</span></div>'+
       '<div class="nt-a" id="nta-'+i+'"><div class="nt-a-inner">'+(lang==='ko'?n.aKo:n.aEn)+'</div></div></div>';
  });
  document.getElementById('noticeList').innerHTML=h;
}

/* ════════ portfolio ════════ */
var imgs=[],lbIdx=0;
function loadPortfolio(){
  fetch('https://api.github.com/repos/'+GH.user+'/'+GH.repo+'/contents/'+GH.folder)
    .then(function(r){if(!r.ok)throw new Error(r.status);return r.json();})
    .then(function(data){
      imgs=[];
      (data||[]).forEach(function(f){if(f.type==='file'&&/\.(png|jpe?g|gif|webp)$/i.test(f.name)){imgs.push({src:'https://'+GH.user+'.github.io/'+GH.repo+'/'+GH.folder+'/'+encodeURIComponent(f.name),cap:f.name.replace(/\.[^.]+$/,'')});}});
      if(DATA.portfolioOrder&&DATA.portfolioOrder.length){
        imgs.sort(function(a,b){var ia=DATA.portfolioOrder.indexOf(a.cap+'.png');
          // match by filename stem against order entries (strip extension in order list too)
          function idx(im){for(var k=0;k<DATA.portfolioOrder.length;k++){if(DATA.portfolioOrder[k].replace(/\.[^.]+$/,'')===im.cap)return k;}return 999;}
          return idx(a)-idx(b);});
      }
      document.getElementById('portLoading').style.display='none';
      if(!imgs.length){var e=document.getElementById('portEmpty');e.style.display='block';e.textContent=UI[lang].portEmpty;return;}
      var g='';imgs.forEach(function(im,i){g+='<div class="port-item" onclick="openLb('+i+')"><img loading="lazy" src="'+im.src+'" alt="'+im.cap+'"><div class="cap">'+im.cap+'</div></div>';});
      document.getElementById('portGrid').innerHTML=g;document.getElementById('portWrap').style.display='block';
    })
    .catch(function(){document.getElementById('portLoading').style.display='none';var e=document.getElementById('portEmpty');e.style.display='block';e.textContent=UI[lang].portErr;});
}
function openLb(i){lbIdx=i;var im=imgs[i];document.getElementById('lbImg').src=im.src;document.getElementById('lbCap').textContent=im.cap;document.getElementById('lb').classList.add('open');}
function closeLb(){document.getElementById('lb').classList.remove('open');}
function lbNav(d){lbIdx=(lbIdx+d+imgs.length)%imgs.length;openLb(lbIdx);}
document.getElementById('lb').addEventListener('click',function(e){if(e.target===this)closeLb();});

/* ════════ selection ════════ */
function findItem(secId,itId){var s=DATA.sections.find(function(x){return x.id===secId;});return s.items.find(function(i){return i.id===itId;});}
function pickRadio(secId,itId){
  var sec=DATA.sections.find(function(s){return s.id===secId;});
  sec.items.forEach(function(it){var el=document.getElementById('oc-'+it.id);if(el)el.classList.remove('sel');});
  if(sel[secId]===itId){sel[secId]=null;}else{sel[secId]=itId;document.getElementById('oc-'+itId).classList.add('sel');}
  rebuild();
}
function togglePill(secId,itId){
  if(!sel[secId])sel[secId]={};
  var el=document.getElementById('pl-'+itId);
  if(sel[secId][itId]){delete sel[secId][itId];el.classList.remove('sel');}else{sel[secId][itId]=true;el.classList.add('sel');}
  rebuild();
}
function setQty(secId,itId,d){
  if(!sel[secId])sel[secId]={};
  var cur=(sel[secId][itId]||0)+d; if(cur<0)cur=0;
  if(cur===0)delete sel[secId][itId]; else sel[secId][itId]=cur;
  var it=findItem(secId,itId);
  var qn=document.getElementById('qn-'+itId); if(qn)qn.textContent=cur;
  var qi=document.getElementById('qi-'+itId); if(qi)qi.classList.toggle('on',cur>0);
  var qp=document.getElementById('qp-'+itId); if(qp)qp.textContent=won(it.p)+' '+UI[lang].won+(cur>1?' × '+cur+' = '+won(it.p*cur):'');
  rebuild();
}
function resetForm(){
  sel={};
  renderForm(); // 라디오/필/수량 전부 초기 상태로 다시 그림
  document.getElementById('formMsg').value='';
  document.getElementById('fixedRef').value='';
  document.getElementById('fixedEmail').value='';
  DATA.apply.forEach(function(q,i){var e=document.getElementById('aq_'+i);if(e)e.value='';});
  rebuild();toast(UI[lang].resetDone);
}

/* ════════ build form text (DASHBOARD-COMPATIBLE, always Korean structure) ════════ */
function cleanLabel(s){return s.replace(/^[^\wㄱ-힣]+\s*/,'');}
function buildFormText(){
  var lines=['모무꼬 작가 · Live2D 의뢰 양식','━━━━━━━━━━━━━━━━━━━━━━━━━━━━',''];
  var total=0, any=false;
  DATA.sections.forEach(function(sec){
    if(sec.type==='radio'){
      if(!sel[sec.id])return; var it=findItem(sec.id,sel[sec.id]); if(!it)return;
      any=true;
      lines.push('▸ '+sec.koLabel); lines.push('  · '+it.ko); lines.push('    → '+won(it.p)+'원'); lines.push('');
      total+=it.p;
    } else if(sec.type==='pill'){
      if(!sel[sec.id])return; var ids=Object.keys(sel[sec.id]); if(!ids.length)return;
      any=true; lines.push('▸ '+sec.koLabel);
      ids.forEach(function(id){var it=findItem(sec.id,id);lines.push('  · '+it.ko);lines.push('    → '+won(it.p)+'원');total+=it.p;});
      lines.push('');
    } else if(sec.type==='qty'){
      if(!sel[sec.id])return; var ids=Object.keys(sel[sec.id]); if(!ids.length)return;
      any=true; lines.push('▸ '+sec.koLabel);
      ids.forEach(function(id){var it=findItem(sec.id,id);var q=sel[sec.id][id];lines.push('  · '+it.ko+' × '+q+'개');lines.push('    → '+won(it.p*q)+'원');total+=it.p*q;});
      lines.push('');
    } else if(sec.type==='expr'){
      if(!sel[sec.id])return; var ids=Object.keys(sel[sec.id]); if(!ids.length)return;
      var names=ids.map(function(id){return findItem(sec.id,id).ko;});
      lines.push('▸ '+sec.koLabel+' (무료)'); lines.push('  · '+names.join(', ')); lines.push('');
    }
  });
  lines.push('─────────────────────────────');
  lines.push('  합계 금액 : '+won(total)+'원');
  lines.push('─────────────────────────────');
  var msg=(document.getElementById('formMsg')||{}).value||'';
  if(msg.trim()){lines.push('');lines.push('✉ 작가님께 전할 말');lines.push('  '+msg.trim());}
  lines.push('');lines.push('[ 신청양식 ]');
  DATA.apply.forEach(function(q,i){
    var el=document.getElementById('aq_'+i); var v=el?el.value.trim():'';
    lines.push('▸ '+q.ko); lines.push('  '+(v||'(미입력)')); lines.push('');
  });
  var ref=(document.getElementById('fixedRef')||{}).value||'';
  var email=(document.getElementById('fixedEmail')||{}).value||'';
  if(ref.trim()||email.trim()){
    lines.push('[ 추가 정보 ]');
    if(ref.trim()){lines.push('▸ 레퍼런스 링크');lines.push('  레퍼런스: '+ref.trim());lines.push('');}
    if(email.trim()){lines.push('▸ 파일 수령 이메일');lines.push('  이메일: '+email.trim());lines.push('');}
  }
  lines.push('━━━━━━━━━━━━━━━━━━━━━━━━━━━━');
  lines.push('양식이 완성되면 복사해서 작가님께 전달해주세요 :)');
  return {text:lines.join('\n'), total:total, any:any};
}
function countSel(){
  var c=0;
  DATA.sections.forEach(function(sec){
    if(sec.type==='radio'&&sel[sec.id])c++;
    else if(sel[sec.id])c+=Object.keys(sel[sec.id]).length;
  });
  return c;
}
function rebuild(){
  var r=buildFormText();
  document.getElementById('totalAmt').textContent=won(r.total);
  var c=countSel();
  document.getElementById('totalCnt').textContent=c?UI[lang].cnt(c):'';
  var body=document.getElementById('previewBody');
  if(!r.any){body.textContent=UI[lang].emptyPreview;body.style.color='var(--ink3)';}
  else{body.textContent=r.text;body.style.color='var(--ink)';}
}
function copyForm(){
  var r=buildFormText();
  if(!r.any){toast(UI[lang].needSel);return;}
  navigator.clipboard.writeText(r.text).then(function(){toast(UI[lang].copyDone);}).catch(function(){
    var ta=document.createElement('textarea');ta.value=r.text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast(UI[lang].copyDone);
  });
}

/* ════════ notice accordion ════════ */
function toggleNt(i){
  var nt=document.getElementById('nt-'+i),a=document.getElementById('nta-'+i);
  if(nt.classList.contains('open')){nt.classList.remove('open');a.style.maxHeight=0;}
  else{nt.classList.add('open');a.style.maxHeight=a.scrollHeight+40+'px';}
}

/* ════════ toast ════════ */
var toastT;
function toast(msg){var el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){el.classList.remove('show');},2200);}

/* ════════ init ════════ */
/* 데이터는 data/commission.json 에서 불러옴 (스튜디오 편집탭에서 수정).
   불러오기 실패 시 위에 하드코딩된 DATA를 그대로 사용(fallback). */
function applyData(j){
  if(!j)return;
  if(j.hero)DATA.hero=j.hero;
  if(j.steps&&j.steps.length)STEPS=j.steps;
  if(j.chips)DATA.chips=j.chips;
  if(j.slots)DATA.slots=j.slots;
  if(j.sections)DATA.sections=j.sections;
  if(j.notice)DATA.notice=j.notice;
  if(j.apply)DATA.apply=j.apply;
  if(j.portfolioOrder)DATA.portfolioOrder=j.portfolioOrder;
}
function init(){
  fetch('data/commission.json?t='+Date.now())
    .then(function(r){return r.ok?r.json():null;})
    .then(function(j){applyData(j);})
    .catch(function(){})
    .then(function(){ setLang('ko'); loadPortfolio(); });
}
init();
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeLb();});
</script>
