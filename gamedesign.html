<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>기획 진단기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700;900&family=Noto+Sans+KR:wght@300;400;700&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;scrollbar-width:none;-ms-overflow-style:none;}
*::-webkit-scrollbar{display:none;}
:root{
  --Y:#3D8EF0; --bg:#1A1A22; --bg2:#22222C; --card:#262632;
  --border:rgba(255,255,255,.12);
  --text:#F0EEE8; --text2:#B8B4AC; --text3:#7A7870;
  --ok:#4FBF7B; --warn:#E8A33D; --bad:#E5544B;
  --display:'Bebas Neue',sans-serif;
  --cond:'Barlow Condensed',sans-serif;
  --mono:'DM Mono',monospace;
}
body{
  background:var(--bg); color:var(--text);
  font-family:'Noto Sans KR',sans-serif; font-size:14px; line-height:1.75;
  min-height:100vh; padding:22px 20px 60px;
}
.wrap{max-width:820px;margin:0 auto;}

/* header */
.head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:4px;}
.head h1{font-family:var(--display);font-size:30px;letter-spacing:1.5px;color:var(--Y);}
.head .sub{color:var(--text3);font-size:12.5px;}
.head .reset{margin-left:auto;background:none;border:1px solid var(--border);color:var(--text3);
  border-radius:7px;padding:4px 11px;font-size:11.5px;cursor:pointer;font-family:inherit;}
.head .reset:hover{color:var(--text2);}

.notice{background:rgba(229,84,75,.09);border-left:3px solid var(--bad);border-radius:7px;
  padding:10px 14px;margin:14px 0 18px;font-size:12.5px;color:var(--text2);}
.notice b{color:var(--bad);}

/* steps rail */
.rail{display:flex;gap:5px;margin:18px 0 22px;flex-wrap:wrap;}
.rail div{flex:1;min-width:60px;height:5px;border-radius:3px;background:#33333f;transition:.25s;}
.rail div.done{background:var(--ok);}
.rail div.cur{background:var(--Y);}
.railtxt{font-family:var(--mono);font-size:11px;color:var(--text3);margin-top:-14px;margin-bottom:20px;}

/* card */
.step{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:22px 24px;}
.step .no{font-family:var(--mono);font-size:11px;color:var(--Y);letter-spacing:1px;}
.step h2{font-family:var(--cond);font-size:24px;font-weight:700;letter-spacing:.3px;margin:2px 0 4px;}
.step .why{color:var(--text3);font-size:12.5px;margin-bottom:16px;}

label.f{display:block;font-size:12.5px;color:var(--text2);margin:14px 0 5px;font-weight:700;}
input[type=text],input[type=number],textarea,select{
  width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:9px;
  color:var(--text);padding:10px 12px;font-family:inherit;font-size:14px;outline:none;
}
textarea{resize:vertical;min-height:62px;line-height:1.6;}
input:focus,textarea:focus,select:focus{border-color:var(--Y);}
input.bad,textarea.bad{border-color:var(--bad);}
input.good,textarea.good{border-color:var(--ok);}
.sentence{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px 16px;
  font-size:15px;line-height:2.4;margin:6px 0 2px;}
.sentence input{display:inline-block;width:auto;min-width:210px;background:#2e2e3a;
  border-bottom:2px solid var(--Y);border-radius:5px 5px 0 0;padding:5px 10px;font-size:14px;}
.hint{font-size:11.5px;color:var(--text3);margin-top:5px;}
.ex{font-size:11.5px;color:var(--text3);background:var(--bg2);border-radius:7px;padding:8px 11px;margin-top:8px;}
.ex b{color:var(--text2);}

/* verdict on field */
.vd{font-size:12.5px;margin-top:7px;padding:9px 12px;border-radius:8px;display:none;}
.vd.show{display:block;}
.vd.no{background:rgba(229,84,75,.11);color:#ffb3ad;border-left:3px solid var(--bad);}
.vd.yes{background:rgba(79,191,123,.10);color:#a8e6c1;border-left:3px solid var(--ok);}
.vd .why2{color:var(--text3);display:block;margin-top:3px;font-size:11.5px;}
.appeal{background:none;border:none;color:var(--text3);text-decoration:underline;font-size:11px;
  cursor:pointer;font-family:inherit;padding:0;margin-top:6px;}
.appeal:hover{color:var(--text2);}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px;}
.chip{background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:6px 14px;
  font-size:12.5px;cursor:pointer;user-select:none;transition:.13s;}
.chip:hover{border-color:var(--text3);}
.chip.on{background:rgba(61,142,240,.18);border-color:var(--Y);color:var(--Y);font-weight:700;}
.chip.on.sub{background:rgba(79,191,123,.15);border-color:var(--ok);color:var(--ok);}

/* loop */
.loop{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
@media(max-width:620px){.loop{grid-template-columns:1fr;}}

/* table */
table{width:100%;border-collapse:collapse;margin:10px 0;font-size:13px;}
th,td{border:1px solid var(--border);padding:7px 9px;text-align:left;}
th{background:var(--bg2);color:var(--text2);font-size:12px;font-weight:700;}
td input{padding:6px 8px;font-size:13px;}
td.num{font-family:var(--mono);text-align:right;}

/* scope result */
.gauge{margin-top:14px;background:var(--bg2);border-radius:11px;padding:16px;}
.gauge .big{font-family:var(--display);font-size:38px;letter-spacing:1px;line-height:1.1;}
.gauge .big.ok{color:var(--ok);} .gauge .big.warn{color:var(--warn);} .gauge .big.bad{color:var(--bad);}
.gauge .lab{font-size:12px;color:var(--text3);font-family:var(--mono);}
.gauge .msg{margin-top:9px;font-size:13px;}
.bar{height:9px;background:#33333f;border-radius:5px;overflow:hidden;margin:11px 0 4px;}
.bar i{display:block;height:100%;transition:.4s;}

/* auto derived */
.derived{background:rgba(61,142,240,.07);border:1px solid rgba(61,142,240,.3);border-radius:11px;
  padding:13px 16px;margin-top:12px;font-size:13px;}
.derived .t{font-family:var(--mono);font-size:11px;color:var(--Y);letter-spacing:1px;margin-bottom:5px;}
.derived b{color:var(--Y);}

/* nav */
.nav{display:flex;gap:9px;margin-top:22px;align-items:center;}
.btn{background:var(--Y);color:#0d1420;border:none;border-radius:9px;padding:11px 22px;
  font-family:var(--cond);font-size:15px;font-weight:700;letter-spacing:.5px;cursor:pointer;}
.btn:hover{filter:brightness(1.1);}
.btn:disabled{background:#3a3a46;color:var(--text3);cursor:not-allowed;filter:none;}
.btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text2);}
.blockmsg{font-size:12px;color:var(--bad);margin-left:auto;text-align:right;}

/* report */
.grade{text-align:center;padding:26px 0 10px;}
.grade .g{font-family:var(--display);font-size:60px;letter-spacing:2px;line-height:1;}
.grade .g.ok{color:var(--ok);} .grade .g.warn{color:var(--warn);} .grade .g.bad{color:var(--bad);}
.grade .d{color:var(--text2);font-size:14px;margin-top:6px;}
.flaws{margin-top:16px;}
.flaw{display:flex;gap:10px;align-items:flex-start;background:var(--bg2);border-radius:9px;
  padding:10px 13px;margin-bottom:7px;font-size:13px;}
.flaw .ic{flex:none;}
.flaw.bad{border-left:3px solid var(--bad);}
.flaw.warn{border-left:3px solid var(--warn);}
.flaw.ok{border-left:3px solid var(--ok);}
pre{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px 16px;
  font-family:var(--mono);font-size:12px;line-height:1.7;overflow-x:auto;white-space:pre-wrap;
  color:var(--text2);margin-top:12px;max-height:420px;}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,16px);background:var(--Y);
  color:#0d1420;font-weight:700;padding:10px 20px;border-radius:22px;opacity:0;transition:.25s;
  font-size:13px;pointer-events:none;z-index:99;}
.toast.on{opacity:1;transform:translate(-50%,0);}
</style>
</head>
<body>
<div class="wrap">

<div class="head">
  <h1>기획 진단기</h1>
  <span class="sub">빈칸을 채우면 기획서가 나옵니다 — 통과했을 때만</span>
  <button class="reset" id="reset">처음부터</button>
</div>

<div class="notice">
  <b>경고 —</b> 이 도구는 문서 생성기가 아니라 <b>진단기</b>입니다. 형용사·장르 명사로 빈칸을 채우면 통과되지 않고, 스코프가 비현실적이면 그대로 알려줍니다. 기분 좋으라고 만든 게 아닙니다.
</div>

<div class="rail" id="rail"></div>
<div class="railtxt" id="railtxt"></div>

<div id="stage"></div>

</div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   데이터
   ============================================================ */
const FUN8 = [
  ['감각','타격감·비주얼·소리의 쾌감'],
  ['도전','어려운 것을 극복'],
  ['판타지','다른 존재가 되어봄'],
  ['서사','이야기가 펼쳐짐'],
  ['교제','같이 노는 즐거움'],
  ['발견','미지를 탐험'],
  ['표현','내 것을 만듦'],
  ['몰입','생각 없이 빠져듦']
];

const GENRES = {
  '3D 액션/공포':      {bottle:'프로그래머', gray:'캡슐·큐브·단색 도형', proto:'맵 1개 + 코어 메카닉 1개', lane:'코드가 아트를 절대 기다리지 않게 배치'},
  '2D 도트 액션':      {bottle:'프로그래머', gray:'단색 사각형',        proto:'스테이지 1개',            lane:'코드 선행, 도트는 Fun Gate 통과 후'},
  '비주얼 노벨/내러티브':{bottle:'기획·글',   gray:'서식 없는 텍스트',   proto:'1챕터 30분 텍스트 빌드',  lane:'초반 주차를 집필에 통째로 배정'},
  '퍼즐':             {bottle:'레벨 설계',  gray:'종이와 엑셀',        proto:'코드 없이 손으로 플레이',  lane:'종이 검증이 코드보다 먼저'},
  '시뮬/경영':         {bottle:'밸런스 설계', gray:'스프레드시트',       proto:'밸런스 시트',             lane:'수치 시트가 코드보다 먼저'},
  '로그라이크':        {bottle:'프로그래머', gray:'도형 + 텍스트 로그',  proto:'런 1회 완주 가능한 빌드',  lane:'코드 선행 + 데이터 주도 설계 필수'},
  '코옵 멀티':         {bottle:'프로그래머', gray:'도형 + 2인 접속',    proto:'2인 접속 상태의 코어 1개', lane:'★1일차부터 2인 접속으로 개발 (나중에 못 붙임)'},
  '비주얼이 상품(아트게임)':{bottle:'아트',   gray:'러프 스케치',        proto:'대표 장면 1컷 완성 품질',  lane:'아트 생산량으로 스코프 역산'}
};

/* 차단 사전
   주의: "완벽한 타이밍에 회피할", "수많은 적에게 포위될" 처럼 형용사가 들어가도
   정상인 문장이 많다. 그래서 무조건 막는 건 '그 단어 자체가 답을 대신하는' 공허어뿐이고,
   나머지 감정 형용사는 뒷칸(왜)에서만 동어반복으로 막는다. */
const BAN_VAGUE  = ['재미있','재밌','꿀잼','다양','다채','여러가지','여러 가지','색다른','신선','참신','독특','창의적','중독성'];
const BAN_EMOTION= ['짜릿','신나','즐거','행복','흥미로','몰입감','감동적','스릴','쾌감'];
const BAN_RESULT = ['그래픽','아트가','그림이','작화','스토리가','시나리오가','음악이','사운드가','브금','bgm','연출이','분위기가'];
const BAN_EMPTY  = ['등등','기타','그런것','그런 것','무언가','뭔가','암튼','아무거나'];
const BAN_GENRE_ONLY = ['전투','수집','탐험','성장','육성','퍼즐','액션','스토리','대화','건설','생존','추리','경쟁','협력','제작','장식'];

// 동사 어간(활용해도 남는 부분)
const ACTION_RE = /(하는|할|해서|하며|하면서|하다가|되는|되어|모으|모아|모을|찾|만드|만들|부수|부술|버리|버릴|고르|고를|선택|피하|피할|숨|잡|들고|옮기|옮길|던지|던질|막|맞추|맞출|섞|쌓|달리|싸우|싸울|먹|열|닫|타고|넘|올라|내려|탐험|탈출|생존|조합|배치|공격|방어|회피|추리|관찰|대화|육성|건설|수집|경쟁|협력|청소|정리|도망|기다리|버티|훔치|고치|끄|켜)/;

// 한국어 관형형(-ㄹ/-ㄴ/-ㅁ 받침) 판별 — "옮길", "찾을", "만들", "숨은" 등을 잡기 위함
function isVerbish(v){
  v=(v||'').trim();
  if(!v) return false;
  if(ACTION_RE.test(v)) return true;
  if(/(는|던|기|때|면|서|며|고|다)$/.test(v)) return true;
  const last=v[v.length-1], code=last.charCodeAt(0)-0xAC00;
  if(code>=0 && code<11172){
    const jong=code%28;
    if(jong===8||jong===4||jong===16) return true; // ㄹ / ㄴ / ㅁ 받침 = 관형형 가능성
  }
  return false;
}

/* ============================================================
   상태
   ============================================================ */
const KEY='mm_gamedesign_v1';
const BLANK={
  hyp1:'',hyp2:'',hypAppeal:false,
  fun:[], loop:['','','',''], loopMin:'', loopClosed:false,
  genre:'',
  assets:[
    {n:'주요 캐릭터', c:'', h:''},
    {n:'배경/맵',     c:'', h:''},
    {n:'프롭/오브젝트', c:'', h:''},
    {n:'UI 화면',     c:'', h:''},
    {n:'애니메이션/컷', c:'', h:''}
  ],
  weekHours:'', targetWeeks:'',
  success:'', killCond:'', killWeeks:'',
  pitchA:'', pitchB:'',
  team:'', coreVerified:'', watchable:'',
  title:''
};
let S = load();
function load(){
  try{ const v=JSON.parse(localStorage.getItem(KEY)); return v? Object.assign(JSON.parse(JSON.stringify(BLANK)),v) : JSON.parse(JSON.stringify(BLANK)); }
  catch(e){ return JSON.parse(JSON.stringify(BLANK)); }
}
function save(){
  localStorage.setItem(KEY, JSON.stringify(S));
  localStorage.setItem(KEY+'_step', step);
  localStorage.setItem(KEY+'_max', maxStep);
}
const STEPS = ['재미 가설','재미 종류','코어 루프','장르·병목','스코프 예산','검증 계획','피치·팀','진단서'];
const _clamp=v=>Math.min(STEPS.length-1, Math.max(0, parseInt(v||'0',10)||0));
let step    = _clamp(localStorage.getItem(KEY+'_step'));
// 한 번 통과한 최고 단계는 새로고침 후에도 유지 — 되돌아갔다가 다시 앞으로 갈 수 있어야 한다
let maxStep = Math.max(step, _clamp(localStorage.getItem(KEY+'_max')));

/* ============================================================
   검증
   ============================================================ */
function hit(text, list){
  const t = text.toLowerCase().replace(/\s/g,'');
  for(const w of list){ if(t.includes(w.toLowerCase().replace(/\s/g,''))) return w; }
  return null;
}
// 재미가설 앞칸: 행동+상황이어야 함
function vHyp1(v){
  v=(v||'').trim();
  if(v.length<4) return {ok:false,msg:'너무 짧습니다.',why:'"플레이어가 무엇을 하는 순간인지"를 상황까지 써야 합니다.'};
  const a=hit(v,BAN_VAGUE);
  if(a) return {ok:false,msg:`"${a}" — 그 단어가 답을 대신하고 있습니다.`,why:'무엇이 다양한지, 무엇이 재미있는지를 쓰는 게 기획입니다. 플레이어가 하는 동작 하나를 구체적으로 쓰세요.'};
  const e=hit(v,BAN_EMPTY);
  if(e) return {ok:false,msg:`"${e}" — 내용이 비어 있습니다.`,why:'구체적으로 하나만 고르세요. 여러 개를 뭉뚱그리면 기획이 아닙니다.'};
  if(v.replace(/\s/g,'').length<=8 && BAN_GENRE_ONLY.some(g=>v.includes(g)))
    return {ok:false,msg:`"${v}" — 장르 분류지 행동이 아닙니다.`,why:'"전투" 말고 "체력이 1 남은 채로 보스 패턴을 읽어낼" 처럼 상황이 들어가야 합니다.'};
  if(!isVerbish(v))
    return {ok:false,msg:'동사가 보이지 않습니다.',why:'"~할 때"의 형태로, 플레이어가 실제로 하는 동작을 쓰세요. (예: "무거운 물건을 옮길", "보스 패턴을 읽어낼")'};
  return {ok:true};
}
// 재미가설 뒷칸: 인과(왜)여야 하고 결과물 자랑이면 안 됨
function vHyp2(v){
  v=(v||'').trim();
  if(v.length<4) return {ok:false,msg:'너무 짧습니다.',why:'"왜" 재미있는지 메커니즘을 써야 합니다.'};
  const r=hit(v,BAN_RESULT);
  if(r) return {ok:false,msg:`"${r}" — 그건 당신이 만든 결과물입니다.`,why:'그래픽·스토리·음악이 좋아서 재밌다면, 그건 게임이 아니라 감상물의 이유입니다. 플레이어가 겪는 심리(긴장·성취·손실 위험·의외성)를 쓰세요.'};
  const a=hit(v,BAN_VAGUE)||hit(v,BAN_EMOTION);
  if(a) return {ok:false,msg:`"${a}" — 동어반복입니다.`,why:'"재밌어서 재밌다"가 됩니다. 그 감정이 왜 생기는지 — 긴장·손실 위험·의외성·성취 같은 기제를 쓰세요.'};
  const e=hit(v,BAN_EMPTY);
  if(e) return {ok:false,msg:`"${e}" — 내용이 비어 있습니다.`,why:'하나만 고르세요.'};
  return {ok:true};
}
function vShort(v,min){
  v=(v||'').trim();
  if(v.length<min) return {ok:false,msg:'너무 짧습니다.',why:'구체적으로 쓰세요.'};
  const a=hit(v,BAN_VAGUE)||hit(v,BAN_EMPTY);
  if(a) return {ok:false,msg:`"${a}" — 통과되지 않는 표현입니다.`,why:'모호어는 기획이 아닙니다. 구체적으로 쓰세요.'};
  return {ok:true};
}
function hasNum(v){ return /\d/.test(v||''); }

/* ============================================================
   스코프 계산
   ============================================================ */
function scope(){
  let hours=0, items=0;
  S.assets.forEach(a=>{
    const c=parseFloat(a.c)||0, h=parseFloat(a.h)||0;
    hours += c*h; items += c;
  });
  const wk = parseFloat(S.weekHours)||0;
  const weeks = wk>0 ? (hours/wk)*1.5 : 0;   // 1.5 = 현실 보정
  return {hours, items, weeks, months: weeks/4.345};
}
function scopeVerdict(w){
  if(w<=0) return {k:'',t:'',c:''};
  if(w<=12) return {k:'ok',   t:'현실적',   c:'프로토타입~버티컬 슬라이스 범위입니다.'};
  if(w<=26) return {k:'warn', t:'빠듯함',   c:'6개월 규모. 여기서 더 늘리면 미완성 위험이 급격히 커집니다.'};
  if(w<=52) return {k:'bad',  t:'위험',     c:'1년 규모. 소규모 팀에서 이 크기는 대부분 중도 이탈합니다.'};
  return               {k:'bad',  t:'비현실적', c:'1년을 넘습니다. 기간이 아니라 개수를 줄여야 합니다.'};
}

const stage=document.getElementById('stage');
function rail(){
  maxStep=Math.max(maxStep,step);
  const r=document.getElementById('rail'); r.innerHTML='';
  STEPS.forEach((s,i)=>{
    const d=document.createElement('div');
    d.className = i<step?'done':(i===step?'cur':'');
    if(i<=maxStep){                       // 이미 지나온 단계는 눌러서 되돌아갈 수 있게
      d.style.cursor='pointer'; d.title=`${i+1}. ${s}`;
      d.onclick=()=>{ step=i; save(); render(); };
    }
    r.appendChild(d);
  });
  document.getElementById('railtxt').textContent =
    `STEP ${step+1} / ${STEPS.length} — ${STEPS[step]}` + (maxStep>0?'   ·  막대를 눌러 이전 단계로':'');
}
function esc(s){ return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function render(){
  rail();
  stage.innerHTML = VIEWS[step]();
  wire();
  window.scrollTo({top:0,behavior:'smooth'});
}

function diagnose(){
  const flaws=[]; let score=100;
  const s=scope(), v=scopeVerdict(s.weeks);

  if(S.hypAppeal){ flaws.push(['warn','재미 가설이 자동 검증을 통과하지 못한 채 이의제기로 진행되었습니다. 사람에게 직접 읽혀보세요.']); score-=10; }
  if(S.fun.length<2) flaws.push(['warn','보조 재미가 없습니다. 문제는 아니지만 단조로워질 수 있습니다.']);

  const lm=parseFloat(S.loopMin)||0;
  if(lm>30){ flaws.push(['bad',`코어 루프 한 바퀴가 ${lm}분입니다. 30분을 넘으면 대부분의 플레이어가 첫 바퀴를 못 돕니다.`]); score-=15; }
  else if(lm>0 && lm<1){ flaws.push(['warn','루프가 1분 미만입니다. 초 단위 루프라면 상위 루프(분·시간 단위)가 따로 설계되어야 합니다.']); }

  if(v.k==='bad'){ flaws.push(['bad',`스코프가 ${s.weeks.toFixed(0)}주(${s.months.toFixed(1)}개월) 규모입니다. ${v.c}`]); score-= (s.weeks>52?30:20); }
  else if(v.k==='warn'){ flaws.push(['warn',`스코프 ${s.weeks.toFixed(0)}주. ${v.c}`]); score-=8; }
  else if(v.k==='ok'){ flaws.push(['ok',`스코프 ${s.weeks.toFixed(0)}주 — 현실적인 범위입니다.`]); }

  const wh=parseFloat(S.weekHours)||0;
  if(wh>=40) flaws.push(['warn',`주 ${wh}시간을 아트에 쓴다는 계산입니다. 전업이 아니라면 이 숫자는 거의 확실히 틀렸고, 결과 기간도 그만큼 낙관적입니다.`]);

  if(S.genre==='코옵 멀티'){ flaws.push(['bad','멀티플레이는 나중에 붙일 수 없습니다. 프로토 1일차부터 2인 접속 상태로 개발하지 않으면 사실상 재작성입니다.']); score-=8; }

  if(/한 판 더|한판 더|또 하고|계속 하고 싶/.test(S.success)){
    flaws.push(['bad','성공 기준이 "한 판 더"입니다. 아트도 사운드도 없는 회색 빌드에서 이 반응은 거의 안 나오므로, 이 기준은 좋은 게임까지 죽입니다. → "재밌던 순간을 구체적으로 짚는가"로 바꾸세요.']);
    score-=15;
  }
  const kw=parseFloat(S.killWeeks)||0;
  if(kw>12){ flaws.push(['warn',`판정 기한이 ${kw}주입니다. 프로토타입 판정은 보통 5~6주(파트타임 10~12주)입니다. 길수록 Kill을 못 하게 됩니다.`]); score-=5; }

  const pitchLen=(S.pitchA+S.pitchB).length;
  if(pitchLen>44){ flaws.push(['warn',`피치가 ${pitchLen}자입니다. 길다는 건 핵심이 아직 하나로 안 좁혀졌다는 신호입니다.`]); score-=5; }

  if(S.watchable==='안 된다 — 해봐야 안다'){ flaws.push(['bad','보는 재미가 없습니다. 완성해도 발견되지 못할 확률이 매우 높습니다. 대표 화면 하나를 만들 수 있는지 지금 고민하세요.']); score-=12; }
  else if(S.watchable==='애매하다'){ flaws.push(['warn','보는 재미가 애매합니다. 스트리머·SNS 확산이 어렵습니다.']); score-=5; }

  if(S.team==='1' && s.weeks>40){ flaws.push(['bad','1인 + 40주 이상 조합입니다. 이 구간에서 대부분의 1인 개발이 중단됩니다.']); score-=10; }

  if(S.coreVerified==='아직 아무것도 없다' && s.weeks>26){
    flaws.push(['bad','재미가 검증되지 않은 상태에서 6개월 이상 규모를 계획하고 있습니다. 순서가 반대입니다 — 먼저 그레이박스로 검증하세요.']);
    score-=15;
  }

  // 프로덕션 모델
  let model, modelWhy;
  if(S.coreVerified==='아직 아무것도 없다' || S.coreVerified==='그레이박스는 있으나 미검증'){
    model='C. 플레이테스트 주도 (포탈/밸브식)';
    modelWhy='재미가 아직 검증되지 않았습니다. 얼리 액세스로 나가기 전에 반드시 거쳐야 하는 단계입니다. 필요한 건 외부인 3명과 화면 녹화뿐입니다.';
  } else if(s.weeks<=12 && S.watchable==='된다 — 화면만 봐도 뭔지 안다'){
    model='D. 조기 출시 · 급속 반복 (뱀서/리썰컴퍼니식)';
    modelWhy='스코프가 작고 보는 재미가 있습니다. 최소 빌드를 빨리 내보내고 반응으로 방향을 정하는 편이 유리합니다. 단, 반응에 며칠 안에 대응할 수 있어야 성립합니다.';
  } else if(S.team==='1' && s.weeks>40){
    model='A. 폐쇄형 장인 (스타듀밸리/언더테일식)';
    modelWhy='1인 장기 개발 조건입니다. 비전은 지켜지지만 "4년 뒤에 안 재밌다를 발견"할 위험이 큽니다. Fun Gate를 혼자서라도 반드시 돌리세요.';
  } else {
    model='B. 공개 제작 · 얼리 액세스 (하데스/슬더스식)';
    modelWhy='코어가 검증됐고 콘텐츠를 키우는 단계라면 가장 안정적인 인디 경로입니다. 단, 업데이트에 예측 가능한 리듬을 만드세요.';
  }

  score=Math.max(0,Math.min(100,score));
  // 치명적 지적(🔴)은 점수와 무관하게 등급을 끌어내린다 — 평균으로 덮이면 안 되는 항목들이다
  const reds=flaws.filter(f=>f[0]==='bad').length;
  let grade,gk,gd;
  if(reds>=2){ grade='STOP'; gk='bad'; gd=`치명적 문제가 ${reds}개입니다. 점수와 무관하게 지금 착수하면 안 됩니다.`; }
  else if(reds===1){ grade='HOLD'; gk='warn'; gd='치명적 문제가 1개 있습니다. 그것부터 해결한 뒤 착수하세요.'; }
  else if(score>=85){ grade='GO'; gk='ok'; gd='착수 가능합니다. 아래 원페이저를 그대로 쓰세요.'; }
  else if(score>=60){ grade='HOLD'; gk='warn'; gd='조건부입니다. 아래 경고를 처리한 뒤 착수하세요.'; }
  else { grade='STOP'; gk='bad'; gd='지금 착수하면 안 됩니다. 아래 문제부터 해결하세요.'; }

  return {flaws,score,grade,gk,gd,model,modelWhy,s,v};
}

/* 판정 기한을 6구간으로 쪼개 병목 레인이 먼저 채워지는 주차 계획을 만든다 */
function weekPlan(){
  const total=parseFloat(S.killWeeks)||6;
  const g=GENRES[S.genre]||{bottle:'프로그래머',gray:'도형',proto:'코어 1개'};
  const B=g.bottle;
  const seg=[0,0.08,0.25,0.45,0.65,0.85,1].map(r=>Math.round(r*total));
  const lab=i=>seg[i]===seg[i+1]?`W${seg[i]}`:`W${seg[i]}~${seg[i+1]}`;
  const 병목작업 = {
    '프로그래머':['이동·조작·카메라 (그레이박스)','코어 메카닉 #1','루프 연결(시작→목표→정산→재시작)','계측 로그 + 배포 빌드'],
    '기획·글'   :['1챕터 플롯 + 인물 시트','1챕터 본문 집필','분기·플래그 구조 확정','외부 낭독 테스트'],
    '레벨 설계' :['규칙 확정 + 종이 프로토','레벨 10개 손으로 검증','난이도 곡선 배치','테스터 통과율 측정'],
    '밸런스 설계':['핵심 수치 시트 설계','1사이클 시트 시뮬','수치↔체감 대조','시트→빌드 이관'],
    '아트'      :['스타일 후보 2안 시간 측정','대표 장면 1컷 완성 품질','에셋 1개당 제작시간 실측','키비주얼']
  }[B] || ['코어 구현','메카닉 #1','루프 연결','계측·빌드'];
  return [
    [lab(0),'준비',   `코어 루프 1문장 확정 · 성공/Kill 기준 못박기 · 리포·컨벤션 · **첫날 Hello World 빌드 배포**`],
    [lab(1),'착수',   `${B}: ${병목작업[0]}  ／  나머지: 무드보드·안티 레퍼런스, 그리드 단위 확정`],
    [lab(2),'코어',   `${B}: ${병목작업[1]}  ／  그레이박스 = ${g.gray} (본 아트 금지)`],
    [lab(3),'루프',   `${B}: ${병목작업[2]}  ／  ★Fun Gate #1 — 통과 못하면 아트 착수 금지`],
    [lab(4),'검증',   `${B}: ${병목작업[3]}  ／  외부 테스터 3~5명 섭외 (게임 많이 해본 사람)`],
    [lab(5),'판정',   `플레이테스트 → **Go / Pivot / Kill 회의** (완성도와 무관하게 개최)`]
  ];
}

/* ============================================================
   단계 검증 (진행 차단)
   ============================================================ */
function canProceed(){
  if(step===0){
    const a=vHyp1(S.hyp1), b=vHyp2(S.hyp2);
    if(S.hypAppeal) return {ok:!!(S.hyp1.trim()&&S.hyp2.trim()), msg:'두 칸을 모두 채우세요'};
    return {ok:a.ok&&b.ok, msg:'재미 가설이 통과되지 않았습니다'};
  }
  if(step===1) return {ok:S.fun.length>=1, msg:'최소 1개(주)를 고르세요'};
  if(step===2){
    const filled=S.loop.every(l=>vShort(l,3).ok);
    const m=parseFloat(S.loopMin)>0;
    if(!filled) return {ok:false,msg:'4단계를 구체적으로 채우세요'};
    if(!m) return {ok:false,msg:'한 바퀴 소요 시간을 입력하세요'};
    if(!S.loopClosed) return {ok:false,msg:'루프가 닫히지 않았습니다 — 체크되지 않음'};
    return {ok:true};
  }
  if(step===3) return {ok:!!S.genre, msg:'장르를 선택하세요'};
  if(step===4){
    const s=scope();
    if(!(s.items>0)) return {ok:false,msg:'에셋 개수를 입력하세요'};
    if(!(parseFloat(S.weekHours)>0)) return {ok:false,msg:'주당 작업 시간을 입력하세요'};
    if(!(s.hours>0)) return {ok:false,msg:'개당 제작시간을 입력하세요'};
    return {ok:true};
  }
  if(step===5){
    if(!hasNum(S.success)) return {ok:false,msg:'성공 기준에 숫자가 없습니다'};
    if(!vShort(S.killCond,6).ok) return {ok:false,msg:'Kill 기준을 구체적으로 쓰세요'};
    if(!(parseFloat(S.killWeeks)>0)) return {ok:false,msg:'판정 기한(주)을 입력하세요'};
    return {ok:true};
  }
  if(step===6){
    if(!vShort(S.pitchA,2).ok||!vShort(S.pitchB,2).ok) return {ok:false,msg:'피치 두 칸을 채우세요'};
    if(!S.team||!S.coreVerified||!S.watchable) return {ok:false,msg:'세 항목을 모두 선택하세요'};
    return {ok:true};
  }
  return {ok:true};
}

function navBar(){
  if(step===7) return '';
  const c=canProceed();
  return `<div class="nav">
    ${step>0?'<button class="btn ghost" id="prev">← 이전</button>':''}
    <button class="btn" id="next" ${c.ok?'':'disabled'}>${step===6?'진단서 받기':'다음 →'}</button>
    ${c.ok?'':`<div class="blockmsg">⛔ ${c.msg}</div>`}
  </div>`;
}

/* ============================================================
   이벤트 배선
   ============================================================ */
function showVd(id, r, showOk){
  const el=document.getElementById(id); if(!el) return;
  if(r===null){ el.className='vd'; el.innerHTML=''; return; }
  if(r.ok){
    if(!showOk){ el.className='vd'; el.innerHTML=''; return; }
    el.className='vd show yes'; el.innerHTML='✅ 통과';
  } else {
    el.className='vd show no';
    el.innerHTML=`⛔ <b>${r.msg}</b><span class="why2">${r.why}</span>`;
  }
}

function wire(){
  stage.insertAdjacentHTML('beforeend', navBar());

  const nx=document.getElementById('next');
  if(nx) nx.onclick=()=>{ if(canProceed().ok){ step++; save(); render(); } };
  const pv=document.getElementById('prev');
  if(pv) pv.onclick=()=>{ step--; render(); };

  const refresh=()=>{
    save();
    const old=stage.querySelector('.nav'); if(old) old.remove();
    stage.insertAdjacentHTML('beforeend', navBar());
    const n=document.getElementById('next');
    if(n) n.onclick=()=>{ if(canProceed().ok){ step++; save(); render(); } };
    const p=document.getElementById('prev');
    if(p) p.onclick=()=>{ step--; render(); };
  };

  /* step 0 */
  const t=document.getElementById('title');
  if(t) t.oninput=e=>{ S.title=e.target.value; save(); };
  const h1=document.getElementById('hyp1'), h2=document.getElementById('hyp2');
  if(h1){
    const chk1=()=>{ const r=vHyp1(S.hyp1); h1.className=S.hyp1?(r.ok?'good':'bad'):''; showVd('vd1',S.hyp1?r:null,true); appealBtn(); refresh(); };
    h1.oninput=e=>{ S.hyp1=e.target.value; S.hypAppeal=false; chk1(); };
    if(S.hyp1) chk1();
  }
  if(h2){
    const chk2=()=>{ const r=vHyp2(S.hyp2); h2.className=S.hyp2?(r.ok?'good':'bad'):''; showVd('vd2',S.hyp2?r:null,true); appealBtn(); refresh(); };
    h2.oninput=e=>{ S.hyp2=e.target.value; S.hypAppeal=false; chk2(); };
    if(S.hyp2) chk2();
  }
  function appealBtn(){
    if(step!==0) return;
    document.querySelectorAll('.appeal').forEach(b=>b.remove());
    const bad = (S.hyp1&&!vHyp1(S.hyp1).ok) || (S.hyp2&&!vHyp2(S.hyp2).ok);
    if(bad && !S.hypAppeal){
      const host=document.getElementById('vd2').parentNode;
      const b=document.createElement('button');
      b.className='appeal';
      b.textContent='이 판정에 이의 있음 — 그래도 진행 (진단서에 미검증으로 기록됨)';
      b.onclick=()=>{ S.hypAppeal=true; save(); toast('미검증 상태로 진행합니다'); render(); };
      host.appendChild(b);
    }
  }
  appealBtn();

  /* step 1 */
  document.querySelectorAll('#funchips .chip').forEach(c=>{
    c.onclick=()=>{
      const i=+c.dataset.i, at=S.fun.indexOf(i);
      if(at>=0) S.fun.splice(at,1);
      else if(S.fun.length<2) S.fun.push(i);
      else { showVd('vdfun',{ok:false,msg:'3개째는 선택할 수 없습니다.',why:'주 1개 + 보조 1개까지. 8가지를 다 넣으려는 기획은 소규모 팀에서 확실한 미완성 루트입니다. 먼저 하나를 빼세요.'}); return; }
      save(); render();
    };
  });

  /* step 2 */
  document.querySelectorAll('.loopin').forEach(el=>{
    el.oninput=e=>{
      const i=+e.target.dataset.i; S.loop[i]=e.target.value;
      const r=vShort(S.loop[i],3);
      e.target.className='loopin '+(S.loop[i]?(r.ok?'good':'bad'):'');
      showVd('vdloop', S.loop[i]&&!r.ok?r:null);
      refresh();
    };
  });
  const lm=document.getElementById('loopMin');
  if(lm) lm.oninput=e=>{
    S.loopMin=e.target.value;
    const v=parseFloat(S.loopMin)||0;
    if(v>30) showVd('vdloop',{ok:false,msg:`한 바퀴 ${v}분 — 너무 깁니다.`,why:'초반 30분 이상 걸리는 루프는 대부분의 플레이어가 첫 바퀴를 완주하지 못하고 이탈합니다. 루프를 쪼개거나 짧은 하위 루프를 만드세요.'});
    else showVd('vdloop',null);
    refresh();
  };
  const lc=document.getElementById('loopClosed');
  if(lc) lc.onchange=e=>{ S.loopClosed=e.target.checked; refresh(); };

  /* step 3 */
  const gs=document.getElementById('genre');
  if(gs) gs.onchange=e=>{ S.genre=e.target.value; save(); render(); };

  /* step 4 */
  document.querySelectorAll('.an').forEach(el=>el.oninput=e=>{ S.assets[+e.target.dataset.i].n=e.target.value; save(); });
  const recalc=()=>{ save(); render(); };
  document.querySelectorAll('.ac').forEach(el=>el.onchange=e=>{ S.assets[+e.target.dataset.i].c=e.target.value; recalc(); });
  document.querySelectorAll('.ah').forEach(el=>el.onchange=e=>{ S.assets[+e.target.dataset.i].h=e.target.value; recalc(); });
  const wh=document.getElementById('weekHours');
  if(wh) wh.onchange=e=>{ S.weekHours=e.target.value; recalc(); };
  const tw=document.getElementById('targetWeeks');
  if(tw) tw.onchange=e=>{ S.targetWeeks=e.target.value; recalc(); };
  const ar=document.getElementById('addrow');
  if(ar) ar.onclick=()=>{ S.assets.push({n:'',c:'',h:''}); recalc(); };
  document.querySelectorAll('.rowdel').forEach(b=>b.onclick=()=>{ S.assets.splice(+b.dataset.i,1); recalc(); });

  /* step 5 */
  const su=document.getElementById('success');
  if(su) su.oninput=e=>{
    S.success=e.target.value;
    if(/한 판 더|한판 더|또 하고|계속 하고 싶/.test(S.success))
      showVd('vdsuc',{ok:false,msg:'"한 판 더"를 기준으로 쓰면 안 됩니다.',why:'아트도 사운드도 없는 회색 빌드에서 그 반응은 거의 나오지 않습니다. 이 기준은 좋은 게임까지 죽입니다. → "재밌던 순간을 구체적으로 짚는가"로 바꾸세요.'});
    else if(S.success && !hasNum(S.success))
      showVd('vdsuc',{ok:false,msg:'숫자가 없습니다.',why:'"5명 중 3명" 처럼 세어서 판정할 수 있어야 기준입니다.'});
    else showVd('vdsuc',null);
    refresh();
  };
  const kc=document.getElementById('killCond');
  if(kc) kc.oninput=e=>{ S.killCond=e.target.value; refresh(); };
  const kw=document.getElementById('killWeeks');
  if(kw) kw.oninput=e=>{
    S.killWeeks=e.target.value;
    const v=parseFloat(S.killWeeks)||0;
    if(v>12) showVd('vdkill',{ok:false,msg:`${v}주는 깁니다.`,why:'프로토타입 판정은 전업 5~6주 / 파트타임 10~12주가 기준입니다. 기한이 길수록 정이 들어 Kill을 못 하게 됩니다.'});
    else showVd('vdkill',null);
    refresh();
  };

  /* step 6 */
  const pa=document.getElementById('pitchA'), pb=document.getElementById('pitchB');
  const chkP=()=>{
    const len=(S.pitchA+S.pitchB).length;
    if(len>44) showVd('vdpitch',{ok:false,msg:`${len}자 — 깁니다.`,why:'한 줄로 안 좁혀진다는 건 핵심이 아직 하나가 아니라는 뜻입니다. 차단하지는 않지만 진단서에 기록됩니다.'});
    else showVd('vdpitch',null);
    refresh();
  };
  if(pa) pa.oninput=e=>{ S.pitchA=e.target.value; chkP(); };
  if(pb) pb.oninput=e=>{ S.pitchB=e.target.value; chkP(); };
  ['team','coreVerified','watchable'].forEach(k=>{
    const el=document.getElementById(k);
    if(el) el.onchange=e=>{ S[k]=e.target.value; save(); refresh(); };
  });

  /* step 7 */
  const cp=document.getElementById('copy');
  if(cp) cp.onclick=async()=>{
    const txt=document.getElementById('md').textContent;
    try{ await navigator.clipboard.writeText(txt); toast('복사됨'); }
    catch(e){
      const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta);
      ta.select(); document.execCommand('copy'); ta.remove(); toast('복사됨');
    }
  };
  const dl=document.getElementById('dl');
  if(dl) dl.onclick=()=>{
    const txt=document.getElementById('md').textContent;
    const b=new Blob([txt],{type:'text/markdown;charset=utf-8'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(b);
    a.download=(S.title||'원페이저')+'_원페이저.md';
    a.click(); URL.revokeObjectURL(a.href); toast('저장됨');
  };
  const bk=document.getElementById('back');
  if(bk) bk.onclick=()=>{ step=0; save(); render(); };
  const bs=document.getElementById('backScope');
  if(bs) bs.onclick=()=>{ step=4; save(); render(); };
}

let tt;
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('on');
  clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('on'),1900); }

document.getElementById('reset').onclick=()=>{
  if(confirm('입력한 내용을 모두 지울까요?')){
    S=JSON.parse(JSON.stringify(BLANK)); step=0; maxStep=0; save(); render(); toast('초기화됨');
  }
};

render();
</script>
</body>
</html>
